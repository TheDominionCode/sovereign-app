const GOAL_CATEGORIES = ["Health", "Personal Growth", "Financial", "Spiritual", "Family", "Relationship", "Fitness", "Reading", "Hobbies", "Travel", "Personal"];

// Each category has its own soft color so the list is visually scannable at a glance.
const GOAL_CATEGORY_STYLE = {
  "Health":          { bg: "bg-emerald-50", text: "text-emerald-700", border: "border-emerald-200", dot: "bg-emerald-500" },
  "Personal Growth": { bg: "bg-teal-50",    text: "text-teal-700",    border: "border-teal-200",    dot: "bg-teal-500" },
  "Financial":       { bg: "bg-amber-50",   text: "text-amber-700",   border: "border-amber-200",   dot: "bg-amber-500" },
  "Spiritual":       { bg: "bg-violet-50",  text: "text-violet-700",  border: "border-violet-200",  dot: "bg-violet-500" },
  "Family":          { bg: "bg-orange-50",  text: "text-orange-700",  border: "border-orange-200",  dot: "bg-orange-500" },
  "Relationship":    { bg: "bg-pink-50",    text: "text-pink-700",    border: "border-pink-200",    dot: "bg-pink-500" },
  "Fitness":         { bg: "bg-rose-50",    text: "text-rose-700",    border: "border-rose-200",    dot: "bg-rose-500" },
  "Reading":         { bg: "bg-indigo-50",  text: "text-indigo-700",  border: "border-indigo-200",  dot: "bg-indigo-500" },
  "Hobbies":         { bg: "bg-cyan-50",    text: "text-cyan-700",    border: "border-cyan-200",    dot: "bg-cyan-500" },
  "Travel":          { bg: "bg-sky-50",     text: "text-sky-700",     border: "border-sky-200",     dot: "bg-sky-500" },
  "Personal":        { bg: "bg-stone-100",  text: "text-stone-700",   border: "border-stone-300",   dot: "bg-stone-500" },
};
const categoryStyle = (cat) => GOAL_CATEGORY_STYLE[cat] || GOAL_CATEGORY_STYLE["Personal"];
function GoalsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const [open, setOpen] = useState(false);
  const [tab, setTab] = useState("active");
  const [editing, setEditing] = useState(null);
  const [expandedId, setExpandedId] = useState(null);
  const blank = { title: "", category: "Reading", deadline: "", progress: 0, milestones: [], why: "" };
  const [form, setForm] = useState(blank);
  const [milestonesText, setMilestonesText] = useState("");
  // Helpers for the friendlier milestone editor in the modal
  const formMilestones = Array.isArray(form.milestones) ? form.milestones : [];
  const setFormMilestones = (next) => setForm({ ...form, milestones: next });
  const addMilestone = () => setFormMilestones([...formMilestones, ""]);
  const updateMilestone = (idx, text) => setFormMilestones(formMilestones.map((m, i) => i === idx ? text : m));
  const toggleMilestoneDone = (idx) => {
    const m = formMilestones[idx] || "";
    const isDone = m.includes("✓");
    setFormMilestones(formMilestones.map((x, i) => i === idx ? (isDone ? x.replace(/\s*✓\s*$/, "").trim() : `${x.replace(/\s*✓\s*$/, "").trim()} ✓`) : x));
  };
  const removeMilestone = (idx) => setFormMilestones(formMilestones.filter((_, i) => i !== idx));
  const openEditModalFor = (g) => {
    setForm({ ...g, milestones: Array.isArray(g.milestones) ? [...g.milestones] : [] });
    setEditing(g.id);
    setMilestonesText((g.milestones || []).join("\n"));
    setOpen(true);
  };
  const openNewModal = () => {
    setForm({ ...blank, milestones: [] });
    setEditing(null);
    setMilestonesText("");
    setOpen(true);
  };

  // Personal Goals — exclude any business-flavored categories from the view
  const BUSINESS_CATS = ["Business", "Income", "Sales", "Recruiting", "Production"];
  const allGoals = data.goals || [];
  const goals = allGoals.filter(g => !BUSINESS_CATS.includes(g.category));
  const active = goals.filter(g => g.progress < 100);
  const achieved = goals.filter(g => g.progress >= 100);
  const list = tab === "active" ? active : achieved;

  const save = () => {
    if (!form.title) return;
    // Use the array-based milestones from the friendly editor; trim and drop empty rows
    const cleanedMilestones = formMilestones.map(m => (m || "").trim()).filter(Boolean);
    const goal = { ...form, milestones: cleanedMilestones };
    if (editing) setData({ ...data, goals: allGoals.map(g => g.id === editing ? { ...goal, id: editing } : g) });
    else { const id = Math.max(0, ...allGoals.map(g => g.id || 0)) + 1; setData({ ...data, goals: [...allGoals, { ...goal, id }] }); }
    setOpen(false); setEditing(null); setForm(blank); setMilestonesText("");
  };

  const updateProgress = (id, p) => {
    const newP = Math.max(0, Math.min(100, p));
    const oldG = allGoals.find(g => g.id === id);
    setData({ ...data, goals: allGoals.map(g => g.id === id ? { ...g, progress: newP } : g) });
    if (newP === 100 && oldG && oldG.progress < 100) triggerConfetti(t("GOAL ACHIEVED", lang), true);
  };
  const del = (id) => setData({ ...data, goals: allGoals.filter(g => g.id !== id) });
  const updateGoalField = (id, patch) => setData({ ...data, goals: allGoals.map(g => g.id === id ? { ...g, ...patch } : g) });

  const toggleMilestone = (goalId, idx) => {
    const g = allGoals.find(x => x.id === goalId);
    if (!g) return;
    const milestones = (g.milestones || []).map((m, i) => {
      if (i !== idx) return m;
      return m.includes("✓") ? m.replace(/\s*✓\s*$/, "").trim() : `${m} ✓`;
    });
    updateGoalField(goalId, { milestones });
  };

  // Toggle a goal between done and active (no percentages)
  const toggleDone = (id) => {
    const g = allGoals.find(x => x.id === id);
    if (!g) return;
    const wasActive = (g.progress || 0) < 100;
    setData({ ...data, goals: allGoals.map(x => x.id === id ? { ...x, progress: wasActive ? 100 : 0 } : x) });
    if (wasActive) triggerConfetti(t("GOAL ACHIEVED", lang), true);
  };

  return (
    <div>
      <PageHeader title={t("Personal Goals", lang)} subtitle={t("What did you do today toward your goals?", lang)} dark={dark}
        action={<AddButton onClick={openNewModal} label={t("Add Goal", lang)} dark={dark} />} />

      {/* Stat strip */}
      <div className={`grid grid-cols-2 gap-3 mb-5 rounded-lg border ${themePanel} p-4`}>
        <div>
          <div className="text-[10px] tracking-[0.18em] text-stone-400 font-semibold">{t("ACTIVE", lang)}</div>
          <div className="font-serif text-2xl text-[#5b7351]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{active.length}</div>
        </div>
        <div>
          <div className="text-[10px] tracking-[0.18em] text-stone-400 font-semibold">{t("DONE", lang)}</div>
          <div className="font-serif text-2xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{achieved.length}</div>
        </div>
      </div>

      <div className="flex gap-1 mb-4 border-b border-stone-200">
        <button onClick={() => setTab("active")} className={`px-4 py-2 text-sm border-b-2 ${tab === "active" ? "border-[#9cb88f] text-[#9cb88f]" : `border-transparent ${themeMuted}`}`}>{t("Active", lang)} ({active.length})</button>
        <button onClick={() => setTab("achieved")} className={`px-4 py-2 text-sm border-b-2 ${tab === "achieved" ? "border-[#9cb88f] text-[#9cb88f]" : `border-transparent ${themeMuted}`}`}>{t("Done", lang)} ({achieved.length})</button>
      </div>

      {/* LIST */}
      <div className={`rounded-lg border ${themePanel} overflow-hidden`}>
        {/* Desktop header */}
        <div className="hidden md:grid grid-cols-[auto_1.6fr_110px_110px_1.2fr_140px] gap-3 px-4 py-2 text-[10px] tracking-[0.18em] text-stone-400 font-semibold bg-stone-50 border-b border-stone-200">
          <div className="w-6"></div>
          <div>{t("GOAL", lang)}</div>
          <div>{t("CATEGORY", lang)}</div>
          <div>{t("DEADLINE", lang)}</div>
          <div>{t("MILESTONES", lang)}</div>
          <div className="text-right pr-1">{t("ACTIONS", lang)}</div>
        </div>
        {list.length === 0 ? (
          <div className={`p-12 text-center ${themeMuted}`}><Target className="w-10 h-10 mx-auto mb-2 opacity-50" /><div className="text-sm">{tab === "active" ? t("No active goals. Set one.", lang) : t("Nothing done yet — keep going.", lang)}</div></div>
        ) : list.map(g => {
          const isOpen = expandedId === g.id;
          const completedMs = (g.milestones || []).filter(m => m.includes("✓")).length;
          const totalMs = (g.milestones || []).length;
          const isDone = (g.progress || 0) >= 100;
          return (
            <div key={g.id} className={`border-b border-stone-100 last:border-b-0 border-l-4 ${categoryStyle(g.category).border}`}>
              {/* DESKTOP: single line row */}
              <div className="hidden md:grid md:grid-cols-[auto_1.6fr_110px_110px_1.2fr_220px] gap-3 px-4 py-3 items-center hover:bg-[#f4f7ee]/40 transition">
                {/* Visual-only status dot — does NOT toggle done */}
                <div
                  aria-hidden="true"
                  className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isDone ? "bg-[#5b7351] border-[#5b7351]" : "border-[#a8c090]/60 bg-white"}`}
                  title={isDone ? t("Done", lang) : t("Active", lang)}
                >
                  {isDone && <Check className="w-3.5 h-3.5 text-white" />}
                </div>
                <button onClick={() => setExpandedId(isOpen ? null : g.id)} className="text-left flex items-center gap-2 min-w-0">
                  <ChevronRight className={`w-3.5 h-3.5 text-stone-400 flex-shrink-0 transition ${isOpen ? "rotate-90" : ""}`} />
                  <span className={`font-serif text-base truncate ${isDone ? "text-stone-400 line-through" : ""}`} style={{ fontFamily: "'Playfair Display', Georgia, serif" }} title={g.title}>{g.title}</span>
                </button>
                <span className={`inline-flex items-center gap-1.5 text-[10px] tracking-wider px-2 py-0.5 rounded border w-fit ${categoryStyle(g.category).bg} ${categoryStyle(g.category).text} ${categoryStyle(g.category).border}`}>
                  <span className={`w-1.5 h-1.5 rounded-full ${categoryStyle(g.category).dot}`}></span>
                  {g.category}
                </span>
                <span className={`text-xs ${themeMuted} font-mono`}>{g.deadline || "—"}</span>
                <span className="text-xs text-stone-500">{totalMs > 0 ? t("{n} of {m} ✓", lang, { n: completedMs, m: totalMs }) : <span className="italic text-stone-400">{t("none yet", lang)}</span>}</span>
                <div className="flex items-center gap-1 justify-end">
                  {/* The ONLY way to move a goal to Done is this explicit button */}
                  {!isDone ? (
                    <button
                      onClick={() => toggleDone(g.id)}
                      className="px-3 py-1.5 text-xs font-semibold bg-[#5b7351] text-white rounded hover:bg-[#3d5c34] flex items-center gap-1"
                    ><CheckCircle2 className="w-3.5 h-3.5" /> {t("Mark done", lang)}</button>
                  ) : (
                    <button
                      onClick={() => toggleDone(g.id)}
                      className="px-3 py-1.5 text-xs font-medium border border-stone-200 text-stone-600 rounded hover:bg-stone-50 flex items-center gap-1"
                    ><RefreshCw className="w-3.5 h-3.5" /> {t("Reopen", lang)}</button>
                  )}
                  <button onClick={() => openEditModalFor(g)} className="p-1.5 rounded hover:bg-stone-100 text-stone-500" title="Edit"><Edit2 className="w-3.5 h-3.5" /></button>
                  <button onClick={() => del(g.id)} className="p-1.5 rounded hover:bg-rose-50 text-stone-400 hover:text-rose-500" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>
                </div>
              </div>

              {/* MOBILE: card layout with big tap targets */}
              <div className="md:hidden p-4 space-y-3">
                <button onClick={() => setExpandedId(isOpen ? null : g.id)} className="w-full flex items-start gap-3 text-left">
                  {/* Visual-only status dot — tapping does NOT mark done; tap the button below */}
                  <span
                    aria-hidden="true"
                    className={`w-11 h-11 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${isDone ? "bg-[#5b7351] border-[#5b7351]" : "border-[#a8c090]/60 bg-white"}`}
                  >
                    {isDone && <Check className="w-5 h-5 text-white" />}
                  </span>
                  <div className="flex-1 min-w-0">
                    <div className={`font-serif text-base leading-snug ${isDone ? "text-stone-400 line-through" : "text-stone-900"}`} style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{g.title}</div>
                    <div className="flex items-center gap-2 mt-1 flex-wrap">
                      <span className="text-[10px] tracking-wider px-2 py-0.5 rounded bg-[#9cb88f]/10 text-[#5b7351]">{g.category}</span>
                      {g.deadline && <span className={`text-[10px] ${themeMuted} font-mono`}>{t("by {date}", lang, { date: g.deadline })}</span>}
                      {totalMs > 0 && <span className="text-[10px] text-stone-500">{completedMs}/{totalMs} ✓</span>}
                    </div>
                  </div>
                  <ChevronRight className={`w-5 h-5 text-stone-400 flex-shrink-0 transition mt-1 ${isOpen ? "rotate-90" : ""}`} />
                </button>
                {/* Mark done is the ONLY thing that moves a goal to the Done tab */}
                <button
                  onClick={() => toggleDone(g.id)}
                  className={`w-full py-3 text-sm font-semibold rounded-lg flex items-center justify-center gap-2 ${isDone ? "bg-stone-100 text-stone-600 active:bg-stone-200" : "bg-[#5b7351] text-white active:bg-[#3d5c34]"}`}
                >
                  {isDone ? <><RefreshCw className="w-4 h-4" /> {t("Reopen — move back to Active", lang)}</> : <><CheckCircle2 className="w-4 h-4" /> {t("Mark done — move to Done", lang)}</>}
                </button>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => { setForm(g); setEditing(g.id); setMilestonesText((g.milestones || []).join("\n")); setOpen(true); }}
                    className="py-2 text-xs font-medium border border-stone-200 text-stone-700 rounded-lg active:bg-stone-50 flex items-center justify-center gap-1.5"
                  ><Edit2 className="w-3.5 h-3.5" /> {t("Edit", lang)}</button>
                  <button
                    onClick={() => { if (confirm(t("Delete \"{title}\"?", lang, { title: g.title }))) del(g.id); }}
                    className="py-2 text-xs font-medium border border-stone-200 text-stone-500 rounded-lg active:bg-rose-50 active:text-rose-500 active:border-rose-300 flex items-center justify-center gap-1.5"
                  ><Trash2 className="w-3.5 h-3.5" /> {t("Delete", lang)}</button>
                </div>
              </div>

              {/* Expanded detail */}
              {isOpen && (
                <div className="px-4 pb-4 pt-1 bg-[#f4f7ee]/30 border-t border-stone-100">
                  <div className="grid md:grid-cols-2 gap-4">
                    <div>
                      <div className="text-[10px] tracking-[0.18em] text-stone-400 font-semibold mb-1">{t("WHY THIS MATTERS", lang)}</div>
                      {g.why ? (
                        <p className="text-sm italic text-stone-700 leading-relaxed">"{g.why}"</p>
                      ) : (
                        <p className={`text-xs italic ${themeMuted}`}>{t("Add a reason — forgetting the why is how goals die quietly.", lang)}</p>
                      )}
                    </div>
                    <div>
                      <div className="text-[10px] tracking-[0.18em] text-stone-400 font-semibold mb-2">{t("MILESTONES", lang)} {totalMs > 0 && <span className="ml-2 text-[#5b7351]">{completedMs}/{totalMs}</span>}</div>
                      {totalMs === 0 ? (
                        <p className={`text-xs italic ${themeMuted}`}>{t("No milestones yet — edit the goal to add some.", lang)}</p>
                      ) : (
                        <div className="space-y-1">
                          {g.milestones.map((m, i) => {
                            const done = m.includes("✓");
                            return (
                              <button key={i} onClick={() => toggleMilestone(g.id, i)} className={`w-full flex items-center gap-2 text-sm text-left rounded px-2 py-2 hover:bg-white ${done ? "text-stone-400 line-through" : "text-stone-700"}`}>
                                {done ? <CheckCircle2 className="w-5 h-5 text-[#9cb88f] flex-shrink-0" /> : <Circle className="w-5 h-5 text-[#9cb88f] flex-shrink-0" />}
                                <span>{m.replace(/\s*✓\s*$/, "")}</span>
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <Modal open={open} onClose={() => setOpen(false)} title={editing ? t("Edit Goal", lang) : t("Add SMART Goal", lang)} dark={dark}>
        <div className="space-y-3">
          <TextField label={t("Title", lang)} value={form.title} onChange={v => setForm({ ...form, title: v })} dark={dark} />
          <div className="grid grid-cols-2 gap-3">
            <SelectField label={t("Category", lang)} value={form.category} onChange={v => setForm({ ...form, category: v })} options={GOAL_CATEGORIES} dark={dark} />
            <TextField label={t("Deadline", lang)} value={form.deadline} onChange={v => setForm({ ...form, deadline: v })} type="date" dark={dark} />
          </div>
          <div><label className={`text-xs ${themeMuted}`}>{t("Why this matters", lang)}</label><textarea value={form.why} onChange={e => setForm({ ...form, why: e.target.value })} rows={2} className={`mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"}`} /></div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <label className={`text-xs ${themeMuted}`}>{t("Milestones", lang)}</label>
              <span className="text-[10px] italic text-stone-400" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("the steps along the way", lang)}</span>
            </div>
            {formMilestones.length === 0 ? (
              <div className="rounded-lg border border-dashed border-stone-200 p-4 text-center mb-2">
                <p className="text-xs italic text-stone-400 mb-2" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("No milestones yet. Break this goal into the smaller wins along the way.", lang)}</p>
                <button onClick={addMilestone} className="text-xs text-[#5b7351] font-medium hover:underline inline-flex items-center gap-1">
                  <Plus className="w-3.5 h-3.5" /> {t("Add first milestone", lang)}
                </button>
              </div>
            ) : (
              <div className="space-y-2 mb-2">
                {formMilestones.map((m, idx) => {
                  const text = (m || "").replace(/\s*✓\s*$/, "");
                  const done = (m || "").includes("✓");
                  return (
                    <div key={idx} className="flex items-center gap-2 group">
                      <button
                        type="button"
                        onClick={() => toggleMilestoneDone(idx)}
                        className={`w-7 h-7 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition ${done ? "bg-[#7a9a6e] border-[#7a9a6e] text-white" : "border-[#9cb88f] hover:bg-[#f4f7ee]"}`}
                        title={done ? t("Mark not done", lang) : t("Mark done", lang)}
                      >
                        {done && <Check className="w-3.5 h-3.5" />}
                      </button>
                      <input
                        value={text}
                        onChange={e => updateMilestone(idx, done ? `${e.target.value} ✓` : e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addMilestone(); } }}
                        placeholder={t("Milestone {n}…", lang, { n: idx + 1 })}
                        className={`flex-1 px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white ${done ? "line-through text-stone-400" : ""}`}
                        autoFocus={idx === formMilestones.length - 1 && !text}
                      />
                      <button
                        type="button"
                        onClick={() => removeMilestone(idx)}
                        className="p-1.5 rounded text-stone-400 hover:text-rose-500 hover:bg-rose-50 flex-shrink-0"
                        title={t("Remove this milestone", lang)}
                      ><Trash2 className="w-3.5 h-3.5" /></button>
                    </div>
                  );
                })}
              </div>
            )}
            {formMilestones.length > 0 && (
              <button
                type="button"
                onClick={addMilestone}
                className="w-full py-2 rounded-lg border border-dashed border-[#a8c090] text-[#5b7351] text-xs font-medium hover:bg-[#f4f7ee]/40 inline-flex items-center justify-center gap-1.5"
              ><Plus className="w-3.5 h-3.5" /> {t("Add another milestone", lang)}</button>
            )}
          </div>
          <button onClick={save} className="w-full py-2 bg-[#9cb88f] text-stone-950 font-medium rounded hover:bg-[#a8c090]">{editing ? t("Save", lang) : t("Add goal", lang)}</button>
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// AFFIRMATIONS MODULE
// ============================================================
function AffirmationsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const [open, setOpen] = useState(false);
  const [filter, setFilter] = useState("All");
  // Reset the category filter when the language toggles so we don't keep an
  // English filter value that no longer matches any Spanish category.
  useEffect(() => { setFilter("All"); }, [lang]);
  const [routineMode, setRoutineMode] = useState(false);
  const [form, setForm] = useState({ text: "", category: "Confidence" });
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState({ text: "", category: "Confidence" });
  const serif = { fontFamily: "'Playfair Display', Georgia, serif" };

  const list = data.affirmations || [];
  const cats = ["All", "Favorites", ...DEFAULT_AFFIRMATION_CATS];
  const filtered = filter === "All" ? list : filter === "Favorites" ? list.filter(a => a.favorite) : list.filter(a => a.category === filter);

  const dailyAffirmation = list.length ? list[new Date().getDate() % list.length] : null;
  const streak = storage.get("dom_aff_streak", { count: 0, lastDate: "" });

  const toggleFav = (id) => setData({ ...data, affirmations: list.map(a => a.id === id ? { ...a, favorite: !a.favorite } : a) });
  const del = (id) => {
    if (!confirm(t("Delete this affirmation?", lang))) return;
    setData({ ...data, affirmations: list.filter(a => a.id !== id) });
    if (editingId === id) setEditingId(null);
  };
  const add = () => { if (!form.text.trim()) return; const id = Math.max(0, ...list.map(a => a.id || 0)) + 1; setData({ ...data, affirmations: [...list, { ...form, text: form.text.trim(), id, favorite: false, custom: true }] }); setOpen(false); setForm({ text: "", category: "Confidence" }); };
  const startEdit = (a) => { setEditingId(a.id); setEditDraft({ text: a.text, category: a.category }); };
  const cancelEdit = () => { setEditingId(null); setEditDraft({ text: "", category: "Confidence" }); };
  const saveEdit = () => {
    const text = (editDraft.text || "").trim();
    if (!text) { cancelEdit(); return; }
    setData({ ...data, affirmations: list.map(a => a.id === editingId ? { ...a, text, category: editDraft.category } : a) });
    cancelEdit();
  };
  const markRead = () => { storage.set("dom_aff_streak", { count: streak.count + 1, lastDate: todayISO() }); };

  const routineList = list.filter(a => a.favorite).slice(0, 5);

  return (
    <div>
      <PageHeader title={t("Affirmations", lang)} subtitle={t("Words become beliefs. Beliefs become reality.", lang)} dark={dark}
        action={<AddButton onClick={() => setOpen(true)} label={t("Add", lang)} dark={dark} />} />

      {/* Daily affirmation hero — mobile friendly */}
      {dailyAffirmation && (
        <div className={`rounded-lg border ${themePanel} p-5 sm:p-8 mb-5 bg-gradient-to-br from-[#9cb88f]/15 to-white text-center`}>
          <div className="text-[10px] sm:text-xs tracking-[0.3em] text-[#9cb88f] mb-3" style={serif}>{t("TODAY'S AFFIRMATION", lang)}</div>
          <p className="font-serif text-xl sm:text-3xl md:text-4xl italic leading-snug mb-5 max-w-3xl mx-auto break-words" style={serif}>"{dailyAffirmation.text}"</p>
          <div className="flex items-center justify-center gap-2 flex-wrap">
            <span className="text-[10px] tracking-wider px-2 py-0.5 rounded bg-[#9cb88f]/10 text-[#5b7351]">{dailyAffirmation.category}</span>
            <button onClick={markRead} className="px-3 py-1.5 bg-[#7a9a6e] text-white text-xs font-medium rounded hover:bg-[#5b7351] flex items-center gap-1.5"><Flame className="w-3 h-3" /> {t("Mark read · {n}d streak", lang, { n: streak.count })}</button>
            <button onClick={() => setRoutineMode(!routineMode)} className="px-3 py-1.5 border border-stone-300 text-xs rounded hover:border-[#7a9a6e] flex items-center gap-1.5"><PlayCircle className="w-3 h-3" /> {t("Morning routine", lang)}</button>
          </div>
        </div>
      )}

      {routineMode && (
        <div className={`rounded-lg border ${themePanel} p-5 sm:p-6 mb-5`}>
          <h3 className="text-[10px] tracking-[0.2em] text-[#5b7351] font-semibold mb-4">{t("MORNING ROUTINE — READ ALOUD", lang)}</h3>
          <ol className="space-y-3">
            {routineList.map((a, i) => (
              <li key={a.id} className="flex items-start gap-3">
                <span className="font-serif text-2xl sm:text-3xl text-[#9cb88f]/50 flex-shrink-0" style={serif}>{i + 1}</span>
                <span className="font-serif text-base sm:text-xl italic leading-snug break-words" style={serif}>"{a.text}"</span>
              </li>
            ))}
            {routineList.length === 0 && <li className={`${themeMuted} text-sm italic`} style={serif}>{t("Mark some affirmations as favorites to build your routine.", lang)}</li>}
          </ol>
        </div>
      )}

      {/* Category filter — horizontal scroll on mobile */}
      <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1 -mx-1 px-1 sm:flex-wrap">
        {cats.map(c => (
          <button
            key={c}
            onClick={() => setFilter(c)}
            className={`flex-shrink-0 px-3 py-1.5 text-xs rounded-full italic transition ${filter === c ? "bg-[#5b7351] text-white font-medium" : "bg-white border border-stone-200 text-stone-600 hover:border-[#7a9a6e]"}`}
            style={serif}
          >{t(c, lang)}</button>
        ))}
      </div>

      {/* Affirmations list — single column on mobile, two on tablet+ */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
        {filtered.length === 0 && (
          <div className={`md:col-span-2 p-8 text-center rounded-lg border ${themePanel} ${themeMuted}`}>
            <p className="text-sm italic" style={serif}>{t("No affirmations in this filter yet. Add one above.", lang)}</p>
          </div>
        )}
        {filtered.map(a => {
          const isEditing = editingId === a.id;
          if (isEditing) {
            return (
              <div key={a.id} className={`p-4 rounded-lg border-2 border-[#7a9a6e] bg-[#f4f7ee]/30`}>
                <textarea
                  autoFocus
                  value={editDraft.text}
                  onChange={e => setEditDraft({ ...editDraft, text: e.target.value })}
                  rows={3}
                  className="w-full px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white resize-none italic leading-snug mb-2"
                  style={serif}
                />
                <select
                  value={editDraft.category}
                  onChange={e => setEditDraft({ ...editDraft, category: e.target.value })}
                  className="w-full px-3 py-2 rounded border border-stone-200 text-xs bg-white focus:border-[#7a9a6e] outline-none mb-3"
                >
                  {DEFAULT_AFFIRMATION_CATS.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <div className="flex gap-2">
                  <button onClick={saveEdit} className="flex-1 py-2 bg-[#7a9a6e] text-white text-xs font-medium rounded hover:bg-[#5b7351]">{t("Save", lang)}</button>
                  <button onClick={cancelEdit} className="px-3 py-2 border border-stone-200 text-xs rounded hover:bg-stone-50">{t("Cancel", lang)}</button>
                  <button onClick={() => del(a.id)} className="px-3 py-2 border border-stone-200 text-xs rounded text-rose-500 hover:border-rose-300 hover:bg-rose-50" title="Delete">
                    <Trash2 className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            );
          }
          return (
            <div key={a.id} className={`p-4 sm:p-5 rounded-lg border ${themePanel} group hover:border-[#7a9a6e] transition`}>
              <div className="flex items-start justify-between gap-3 mb-3">
                <p className="font-serif text-base sm:text-lg italic flex-1 leading-snug break-words" style={serif}>"{a.text}"</p>
                <button onClick={() => toggleFav(a.id)} className="flex-shrink-0">
                  <Heart className={`w-4 h-4 transition ${a.favorite ? "fill-rose-400 text-rose-400" : "text-stone-300 hover:text-rose-400"}`} />
                </button>
              </div>
              <div className="flex items-center justify-between gap-2">
                <span className="text-[10px] italic tracking-wide px-2 py-0.5 rounded bg-[#9cb88f]/10 text-[#5b7351]" style={serif}>{a.category}</span>
                <div className="flex items-center gap-1">
                  <button onClick={() => startEdit(a)} className="p-1.5 rounded text-stone-400 hover:text-[#5b7351] hover:bg-stone-50" title="Edit"><Edit2 className="w-3.5 h-3.5" /></button>
                  <button onClick={() => del(a.id)} className="p-1.5 rounded text-stone-400 hover:text-rose-500 hover:bg-rose-50" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      <Modal open={open} onClose={() => setOpen(false)} title={t("Add Affirmation", lang)} dark={dark}>
        <div className="space-y-3">
          <div><label className={`text-xs ${themeMuted}`}>{t("Affirmation", lang)}</label><textarea value={form.text} onChange={e => setForm({ ...form, text: e.target.value })} rows={3} placeholder="I am…" className="mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm bg-white border-stone-300" /></div>
          <SelectField label={t("Category", lang)} value={form.category} onChange={v => setForm({ ...form, category: v })} options={DEFAULT_AFFIRMATION_CATS} dark={dark} />
          <button onClick={add} className="w-full py-2 bg-[#7a9a6e] text-white font-medium rounded hover:bg-[#5b7351]">{t("Add affirmation", lang)}</button>
        </div>
      </Modal>
    </div>
  );
}

// ============================================================
// VISION BOARD MODULE
// ============================================================
const VISION_QUOTES = [
  "What the mind can conceive and believe, it can achieve.",
  "Dreams written down become goals. Goals broken into steps become reality.",
  "If you can see it, you can be it.",
  "Don't downgrade your dream to fit your reality. Upgrade your conviction to match your destiny.",
];
function VisionModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const [open, setOpen] = useState(false);
  const [tab, setTab] = useState("board");
  const [editing, setEditing] = useState(null);
  const [headerOpen, setHeaderOpen] = useState(false);
  const [letterView, setLetterView] = useState(null); // {caption, letter, date}
  const blank = { caption: "", img: "", why: "", letter: "", date: "", achieved: false };
  const [form, setForm] = useState(blank);

  // Header / cover settings, persisted
  const meta = data.visionMeta || {
    year: new Date().getFullYear(),
    statement: "I walk with clear vision, move with divine authority, and nothing delays what God has written for me.",
    topVerse: "HABAKKUK 2:2",
  };
  const [metaForm, setMetaForm] = useState(meta);
  const saveMeta = () => {
    setData({ ...data, visionMeta: metaForm });
    setHeaderOpen(false);
  };

  const items = data.visionBoard || [];
  const filtered = items.filter(v => v.achieved === (tab === "wins"));

  const save = () => {
    if (!form.caption && !form.img) return;
    if (editing) setData({ ...data, visionBoard: items.map(v => v.id === editing ? { ...form, id: editing } : v) });
    else { const id = Math.max(0, ...items.map(v => v.id || 0)) + 1; setData({ ...data, visionBoard: [...items, { ...form, id }] }); }
    setOpen(false); setEditing(null); setForm(blank);
  };
  const del = (id) => setData({ ...data, visionBoard: items.filter(v => v.id !== id) });
  const toggleAchieved = (id) => {
    const v = items.find(x => x.id === id);
    setData({ ...data, visionBoard: items.map(x => x.id === id ? { ...x, achieved: !x.achieved, achievedDate: !x.achieved ? todayISO() : null } : x) });
  };

  return (
    <div>
      {/* HEADER — magazine style */}
      <div className="mb-6 group relative">
        <button onClick={() => { setMetaForm(meta); setHeaderOpen(true); }} className="absolute top-0 right-0 opacity-0 group-hover:opacity-100 p-1.5 rounded border border-stone-200 bg-white hover:border-[#7a9a6e] transition" title="Edit header">
          <Edit2 className="w-3.5 h-3.5 text-stone-500" />
        </button>
        <div className="flex items-start justify-between gap-4 flex-wrap">
          <h1 className="font-serif text-5xl tracking-tight text-[#5b3a1e]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>
            {t("Vision Board", lang)} <span className="text-stone-700">{meta.year}</span>
          </h1>
          <div className="text-right">
            <span className="text-xs tracking-[0.2em] font-bold text-[#5b3a1e]">{meta.topVerse}</span>
          </div>
        </div>
        <p className="text-sm font-bold tracking-wider mt-2 italic text-[#5b3a1e] max-w-4xl uppercase" style={{ fontFamily: "Georgia, serif" }}>
          "{meta.statement}"
        </p>
      </div>

      {/* TABS + ADD */}
      <div className="flex items-center justify-between mb-5 gap-3 flex-wrap">
        <div className="flex gap-1">
          <button onClick={() => setTab("board")} className={`px-3 py-1.5 text-sm rounded transition ${tab === "board" ? "bg-[#7a9a6e] text-white font-medium" : "bg-white border border-stone-200 text-stone-600 hover:border-[#7a9a6e]"}`}>{t("The Board ({n})", lang, { n: items.filter(x => !x.achieved).length })}</button>
          <button onClick={() => setTab("wins")} className={`px-3 py-1.5 text-sm rounded transition ${tab === "wins" ? "bg-[#7a9a6e] text-white font-medium" : "bg-white border border-stone-200 text-stone-600 hover:border-[#7a9a6e]"}`}>{t("Wall of Wins ({n})", lang, { n: items.filter(x => x.achieved).length })}</button>
        </div>
        <button onClick={() => { setForm(blank); setEditing(null); setOpen(true); }} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm font-medium rounded hover:bg-[#5b7351] flex items-center gap-1.5">
          <Plus className="w-4 h-4" /> {t("Add card", lang)}
        </button>
      </div>

      {/* GRID — smaller Pinterest-style with verse caption overlay */}
      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2">
        {filtered.map(v => (
          <div key={v.id} className="group relative rounded-md overflow-hidden bg-stone-100 aspect-[3/4] hover:shadow-xl transition-shadow">
            {v.img ? (
              <img src={v.img} alt={v.caption || ""} className="absolute inset-0 w-full h-full object-cover group-hover:scale-[1.02] transition-transform duration-700" />
            ) : (
              <div className="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-[#f4f7ee] to-stone-100 p-6">
                <p className="text-center font-serif italic text-stone-700 text-sm" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>
                  {v.why || t("Add a picture or scripture", lang)}
                </p>
              </div>
            )}

            {/* Verse caption at bottom */}
            {v.caption && (
              <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent pt-8 pb-2 px-2">
                <p className="text-center text-white text-[10px] font-bold tracking-[0.12em] uppercase" style={{ fontFamily: "Georgia, serif", textShadow: "0 1px 2px rgba(0,0,0,0.5)" }}>
                  {v.caption}
                </p>
              </div>
            )}

            {/* Achieved ribbon */}
            {v.achieved && (
              <div className="absolute top-2 left-2 px-2 py-0.5 bg-[#7a9a6e] text-white text-[9px] font-bold tracking-wider rounded">{t("ACHIEVED", lang)}</div>
            )}

            {/* Letter indicator — visible when a letter is written */}
            {v.letter && (
              <button
                onClick={(e) => { e.stopPropagation(); setLetterView({ id: v.id, caption: v.caption || "", letter: v.letter, date: v.date || "" }); }}
                className="absolute bottom-2 left-2 p-1.5 rounded-full bg-white/90 backdrop-blur hover:bg-[#f4f7ee] text-[#5b3a1e] shadow"
                title={t("Read your letter", lang)}
              >
                <Mail className="w-3.5 h-3.5" />
              </button>
            )}

            {/* Hover actions */}
            <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
              <button onClick={() => toggleAchieved(v.id)} className="p-1.5 rounded bg-white/90 backdrop-blur hover:bg-[#f4f7ee] text-stone-700" title={v.achieved ? t("Move back", lang) : t("Mark achieved", lang)}>
                <Check className="w-3.5 h-3.5" />
              </button>
              <button onClick={() => { setForm({ caption: v.caption || v.title || "", img: v.img || "", why: v.why || "", letter: v.letter || "", date: v.date || "", achieved: !!v.achieved }); setEditing(v.id); setOpen(true); }} className="p-1.5 rounded bg-white/90 backdrop-blur hover:bg-[#f4f7ee] text-stone-700" title="Edit">
                <Edit2 className="w-3.5 h-3.5" />
              </button>
              <button onClick={() => del(v.id)} className="p-1.5 rounded bg-white/90 backdrop-blur hover:bg-rose-50 text-stone-700 hover:text-rose-600" title="Delete">
                <Trash2 className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>
        ))}

        {/* Add card placeholder */}
        <button onClick={() => { setForm(blank); setEditing(null); setOpen(true); }} className="rounded-md border-2 border-dashed border-stone-300 hover:border-[#7a9a6e] hover:bg-[#f4f7ee] aspect-[3/4] flex flex-col items-center justify-center text-stone-400 hover:text-[#7a9a6e] transition">
          <Plus className="w-5 h-5 mb-1" />
          <span className="text-[10px] font-medium">{t("Add", lang)}</span>
        </button>
      </div>

      {filtered.length === 0 && (
        <div className="text-center py-12 text-stone-500 text-sm">
          {tab === "wins" ? t("No achievements yet — your first win is on the way.", lang) : t("Click any tile or 'Add card' to start your board.", lang)}
        </div>
      )}

      {/* ADD/EDIT CARD MODAL */}
      <Modal open={open} onClose={() => setOpen(false)} title={editing ? t("Edit card", lang) : t("Add to Vision Board", lang)} dark={dark}>
        <div className="space-y-3">
          <TextField
            label={t("Caption (verse, scripture, or short phrase)", lang)}
            value={form.caption}
            onChange={v => setForm({ ...form, caption: v })}
            dark={dark}
            placeholder="ROMANS 12:2"
          />
          <VisionImagePicker form={form} setForm={setForm} themeMuted={themeMuted} lang={lang} />
          <TextField label={t("Target date (optional)", lang)} value={form.date} onChange={v => setForm({ ...form, date: v })} type="date" dark={dark} />
          <div>
            <label className={`text-xs ${themeMuted}`}>{t("Why this matters (private notes — not shown on card)", lang)}</label>
            <textarea value={form.why} onChange={e => setForm({ ...form, why: e.target.value })} rows={2} className="mt-1 w-full px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
          </div>
          <div>
            <label className={`text-xs ${themeMuted} flex items-center gap-1.5`}>
              <Mail className="w-3.5 h-3.5 text-[#5b3a1e]" /> {t("Letter to yourself", lang)}
            </label>
            <p className="text-[10px] text-stone-400 italic mb-1">{t("Write a note from future-you who's already living this. What does it feel like? Who are you? What changed?", lang)}</p>
            <textarea
              value={form.letter}
              onChange={e => setForm({ ...form, letter: e.target.value })}
              rows={6}
              placeholder="Dear me,&#10;&#10;You did it. The day finally came when…"
              className="w-full px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-[#fffdf7] leading-relaxed"
              style={{ fontFamily: "Georgia, serif" }}
            />
          </div>
          <button onClick={save} className="w-full py-2 bg-[#7a9a6e] text-white font-medium rounded hover:bg-[#5b7351]">{editing ? t("Save changes", lang) : t("Add to board", lang)}</button>
        </div>
      </Modal>

      {/* LETTER READING MODAL */}
      <Modal open={!!letterView} onClose={() => setLetterView(null)} title={t("Letter to yourself", lang)} dark={dark}>
        {letterView && (
          <div>
            {letterView.caption && (
              <div className="text-[10px] tracking-[0.18em] text-[#5b3a1e] mb-1">{letterView.caption}</div>
            )}
            {letterView.date && (
              <div className="text-[10px] text-stone-400 mb-3">{t("For {date}", lang, { date: fmtDate(letterView.date) })}</div>
            )}
            <div className="rounded-md bg-[#fffdf7] border border-stone-200 p-5">
              <p className="whitespace-pre-wrap text-base leading-relaxed text-stone-800" style={{ fontFamily: "Georgia, serif" }}>{letterView.letter}</p>
            </div>
          </div>
        )}
      </Modal>

      {/* HEADER EDIT MODAL */}
      <Modal open={headerOpen} onClose={() => setHeaderOpen(false)} title={t("Edit Header", lang)} dark={dark}>
        <div className="space-y-3">
          <TextField label={t("Year", lang)} value={metaForm.year} onChange={v => setMetaForm({ ...metaForm, year: v })} dark={dark} />
          <TextField label={t("Top-right verse / reference", lang)} value={metaForm.topVerse} onChange={v => setMetaForm({ ...metaForm, topVerse: v })} dark={dark} placeholder="HABAKKUK 2:2" />
          <div>
            <label className={`text-xs ${themeMuted}`}>{t("Vision statement (subtitle, in quotes)", lang)}</label>
            <textarea value={metaForm.statement} onChange={e => setMetaForm({ ...metaForm, statement: e.target.value })} rows={3} className="mt-1 w-full px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
          </div>
          <button onClick={saveMeta} className="w-full py-2 bg-[#7a9a6e] text-white font-medium rounded hover:bg-[#5b7351]">{t("Save header", lang)}</button>
        </div>
      </Modal>
    </div>
  );
}
