<!-- ============================================================
     CLOUD STORAGE BOOTSTRAP (added for Supabase sync)
     Backs the app's window.storage seam with the signed-in user's data via
     same-origin /api/state, then compiles & starts the app. Cloud state is
     loaded FIRST so the app reads it on first render; if the cloud is
     unreachable we leave window.storage unset and the app's built-in
     localStorage fallback takes over, so it always loads.
     ============================================================ -->
<script>
(function () {
  var BABEL_SRC = "https://unpkg.com/@babel/standalone@7.24.7/babel.min.js";

  function showError(msg) {
    var l = document.getElementById("root-loading");
    if (l) l.innerHTML =
      '<div style="text-align:center;max-width:560px;padding:24px;font-family:Inter,system-ui;">' +
      '<div style="font-size:32px;margin-bottom:12px;">🌿</div>' +
      '<div style="color:#5b7351;letter-spacing:0.3em;font-size:11px;margin-bottom:16px;">SOVEREIGN</div>' +
      '<div style="color:#dc2626;font-size:13px;">' + (msg || "Could not load. Please refresh.") + '</div></div>';
  }

  function loadBabel() {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = BABEL_SRC;
      s.onload = resolve;
      s.onerror = function () { reject(new Error("Could not load app engine. Check your connection.")); };
      document.head.appendChild(s);
    });
  }

  // Returns the user's saved state map, or null if the cloud is unreachable.
  function loadState() {
    return fetch("/api/state", { credentials: "same-origin", headers: { "Accept": "application/json" } })
      .then(function (r) { if (!r.ok) throw new Error("state " + r.status); return r.json(); })
      .then(function (j) { return (j && j.state) || {}; })
      .catch(function () { return null; });
  }

  // Synchronous window.storage facade over an in-memory cache, with debounced
  // writes to /api/state. Mirrors to localStorage so reloads are instant and
  // offline writes aren't lost.
  function installCloudStorage(initial) {
    var cache = initial || {};
    var dirty = {}, removed = {}, timer = null;
    function schedule() { if (!timer) timer = setTimeout(function () { flush(false); }, 700); }
    function flush(keepalive) {
      timer = null;
      var entries = Object.keys(dirty).map(function (k) { return { key: k, value: dirty[k] }; });
      var deletes = Object.keys(removed);
      dirty = {}; removed = {};
      if (entries.length) fetch("/api/state", { method: "PUT", headers: { "Content-Type": "application/json" }, credentials: "same-origin", keepalive: keepalive, body: JSON.stringify({ entries: entries }) }).catch(function () {});
      if (deletes.length) fetch("/api/state", { method: "DELETE", headers: { "Content-Type": "application/json" }, credentials: "same-origin", keepalive: keepalive, body: JSON.stringify({ keys: deletes }) }).catch(function () {});
    }
    window.storage = {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(cache, k) ? cache[k] : null; },
      setItem: function (k, v) { v = String(v); cache[k] = v; delete removed[k]; dirty[k] = v; try { localStorage.setItem(k, v); } catch (e) {} schedule(); },
      removeItem: function (k) { delete cache[k]; delete dirty[k]; removed[k] = true; try { localStorage.removeItem(k); } catch (e) {} schedule(); }
    };
    function leaveFlush() { if (timer) clearTimeout(timer); flush(true); }
    window.addEventListener("pagehide", leaveFlush);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") leaveFlush(); });
  }

  // Compile the (deferred) JSX app source and run it as a module so the import
  // map resolves react/recharts/etc. exactly as before.
  function startApp() {
    var src = document.getElementById("app-source");
    if (!src) { showError("App source missing."); return; }
    try {
      var compiled = window.Babel.transform(src.textContent, { presets: ["react"], sourceType: "module", filename: "sovereign-app.jsx" }).code;
      var m = document.createElement("script");
      m.type = "module";
      m.textContent = compiled;
      document.body.appendChild(m);
    } catch (e) {
      showError((e && e.message) || "Compile error.");
    }
  }

  Promise.all([loadState(), loadBabel()])
    .then(function (res) {
      var state = res[0];
      if (state) installCloudStorage(state);
      startApp();
    })
    .catch(function (e) { showError((e && e.message) || "Load error."); });
})();
</script>

// STORAGE WRAPPER (window.storage with try/catch fallback)
// ============================================================
const memoryStore = {};
function pickStore() {
  try {
    if (typeof window !== "undefined" && window.storage && typeof window.storage.getItem === "function") return window.storage;
  } catch (e) {}
  try {
    if (typeof window !== "undefined" && window.localStorage) return window.localStorage;
  } catch (e) {}
  return null;
}
const storage = {
  get(key, fallback = null) {
    const s = pickStore();
    if (s) {
      try {
        const v = s.getItem(key);
        if (v == null) return fallback;
        try { return JSON.parse(v); } catch { return v; }
      } catch (e) { /* ignore */ }
    }
    return key in memoryStore ? memoryStore[key] : fallback;
  },
  set(key, value) {
    const s = pickStore();
    if (s) {
      try { s.setItem(key, JSON.stringify(value)); return; } catch (e) {}
    }
    memoryStore[key] = value;
  },
  remove(key) {
    const s = pickStore();
    if (s) { try { s.removeItem(key); return; } catch (e) {} }
    delete memoryStore[key];
  }
};

// Compress an image File to a small data URL (max 800px wide, ~80% quality JPEG)
function compressImage(file, { maxWidth = 800, quality = 0.82 } = {}) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try {
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

export default function DominionOS() {
  // Inner sign-in collapsed into the outer Supabase login: when no inner
  // user is stored, default to the master account so the app opens straight
  // into the dashboard after Supabase auth (the real security gate).
  const [user, setUser] = useState(() =>
    storage.get("dom_user", null) || { username: "natalyg", name: "Nataly" }
  );
  const [dark, setDark] = useState(false); // Force light mode
  const [loading, setLoading] = useState(true);

  useEffect(() => { const t = setTimeout(() => setLoading(false), 400); return () => clearTimeout(t); }, []);
  useEffect(() => { storage.set("dom_user", user); }, [user]);
  useEffect(() => { storage.set("dom_dark", dark); }, [dark]);

  // Seed owner + demo accounts on first load (username-based)
  useEffect(() => {
    const accounts = storage.get("dom_accounts", {});
    let changed = false;
    if (!storage.get("dom_seeded_v3")) {
      if (!accounts["natalyg"]) {
        accounts["natalyg"] = {
          password: "Master2026",
          name: "Nataly",
          role: "owner",
          termsAcceptedAt: new Date().toISOString(),
          termsVersion: "1.0",
        };
        storage.set("dom_data_natalyg", buildEmptyData());
      }
      // Demo account seed removed — owner-only deployment.
      storage.set("dom_seeded_v3", true);
      changed = true;
    }
    // One-time fix: strip legacy demo names ("Alex Rivera") and ensure owner display name is "Nataly"
    if (!storage.get("dom_name_cleanup_v1")) {
      Object.keys(accounts).forEach(key => {
        const a = accounts[key];
        if (!a) return;
        if (a.name === "Alex Rivera" || a.name === "Alex") {
          // For demo account → reset to "Demo"; for any other → strip to capitalized username
          if (key === "demo") a.name = "Demo";
          else a.name = key.charAt(0).toUpperCase() + key.slice(1);
        }
        // Strip leftover business fields
        delete a.agency;
        delete a.role;
        if (a.role === "Agency Owner" || a.role === "Solo Agent" || a.role === "Team Lead") {
          delete a.role;
        }
      });
      if (accounts["natalyg"]) accounts["natalyg"].name = "Nataly";
      storage.set("dom_name_cleanup_v1", true);
      changed = true;
    }
    if (changed) storage.set("dom_accounts", accounts);

    // Also fix the currently logged-in session if it's showing Alex
    if (user) {
      const fromStore = accounts[user.username];
      if (user.name === "Alex Rivera" || user.name === "Alex") {
        const fixed = fromStore?.name || (user.username === "natalyg" ? "Nataly" : user.username);
        setUser({ ...user, name: fixed });
      }
    }
  }, []);

  // Sync owner display name in the active session if needed
  useEffect(() => {
    if (user && user.username === "natalyg" && user.name !== "Nataly") {
      setUser({ ...user, name: "Nataly" });
    }
  }, [user && user.username]);

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-white">
        <div className="text-center">
          <Crown className="w-12 h-12 text-[#5b7351] mx-auto mb-3 animate-pulse" />
          <div className="text-[#5b7351] tracking-[0.3em] text-xs">SOVEREIGN</div>
        </div>
      </div>
    );
  }

  // The inner AuthPage is only reachable if something explicitly clears the
  // user (which we no longer do — onLogout now signs out of Supabase). Keep
  // the fallback as a safety net.
  if (!user) return <AuthPage onLogin={(u) => setUser(u)} />;
  return (<>
    <AppShell
      user={user}
      setUser={setUser}
      dark={dark}
      setDark={setDark}
      onLogout={() => {
        // Inner logout = real logout. Bust the parent frame's session via
        // the Next /logout route so the user lands on the marketing site,
        // signed out everywhere.
        try {
          if (window.top && window.top !== window.self) window.top.location.href = "/logout";
          else window.location.href = "/logout";
        } catch (e) { window.location.href = "/logout"; }
      }}
    />
    <InstallBanner />
  </>);
}

// Mobile install hint — shows on iOS / Android browsers (not yet in standalone
// mode) and walks the user through "Share → Add to Home Screen". Dismissed
// dismissal persists in cloud-synced storage so it only shows once.
function InstallBanner() {
  const [dismissed, setDismissed] = useState(() => storage.get("install_banner_dismissed_v1", false));
  const [show, setShow] = useState(false);
  const [isIOS, setIsIOS] = useState(false);
  useEffect(() => {
    try {
      const ua = navigator.userAgent || "";
      const ios = /iPhone|iPad|iPod/i.test(ua);
      const android = /Android/i.test(ua);
      const standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      setIsIOS(ios);
      setShow((ios || android) && !standalone);
    } catch (e) {}
  }, []);
  if (dismissed || !show) return null;
  const dismiss = () => { storage.set("install_banner_dismissed_v1", true); setDismissed(true); };
  return (
    <div className="fixed bottom-4 left-4 right-4 z-50 mx-auto max-w-md bg-white border border-[#9cb88f] rounded-2xl shadow-xl p-4">
      <div className="flex items-start gap-3">
        <div className="w-10 h-10 rounded-xl bg-[#5b7351] flex items-center justify-center flex-shrink-0">
          <Crown className="w-5 h-5 text-white" />
        </div>
        <div className="flex-1 min-w-0">
          <div className="text-sm font-semibold text-[#5b7351]">Install Sovereign on your phone</div>
          {isIOS ? (
            <ol className="text-xs text-stone-600 mt-1 space-y-0.5 list-decimal list-inside">
              <li>Tap the <strong>Share</strong> icon in Safari (square with ↑)</li>
              <li>Choose <strong>Add to Home Screen</strong></li>
              <li>Tap <strong>Add</strong> in the top right</li>
            </ol>
          ) : (
            <ol className="text-xs text-stone-600 mt-1 space-y-0.5 list-decimal list-inside">
              <li>Tap the menu (<strong>⋮</strong>) in your browser</li>
              <li>Choose <strong>Install app</strong> or <strong>Add to Home screen</strong></li>
            </ol>
          )}
        </div>
        <button onClick={dismiss} className="text-xs text-stone-400 hover:text-stone-600 p-1" aria-label="Dismiss">✕</button>
      </div>
    </div>
  );
}

function AuthPage({ onLogin }) {
  const [mode, setMode] = useState("login");
  const [form, setForm] = useState({ username: "", password: "", name: "" });
  const [err, setErr] = useState("");
  const [agreed, setAgreed] = useState(false);
  const [showTerms, setShowTerms] = useState(false);
  const serif = { fontFamily: "'Playfair Display', Georgia, serif" };

  const submit = (e) => {
    e.preventDefault();
    setErr("");
    const accounts = storage.get("dom_accounts", {});
    const uname = (form.username || "").trim().toLowerCase();
    if (mode === "login") {
      const a = accounts[uname];
      if (!a || a.password !== form.password) return setErr("Username or password is incorrect.");
      onLogin({ username: uname, name: a.name });
    } else {
      if (!uname || !form.password || !form.name) return setErr("Name, username, and password are required.");
      if (!/^[a-z0-9_.-]{3,}$/.test(uname)) return setErr("Username can use letters, numbers, dot, dash, underscore (min 3 chars).");
      if (!agreed) return setErr("Please read and agree to the Terms before creating an account.");
      if (accounts[uname]) return setErr("That username is already taken.");
      accounts[uname] = {
        password: form.password,
        name: form.name,
        termsAcceptedAt: new Date().toISOString(),
        termsVersion: "1.0",
      };
      storage.set("dom_accounts", accounts);
      storage.set(`dom_data_${uname}`, buildEmptyData());
      onLogin({ username: uname, name: form.name });
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#f4f7ee] via-white to-[#f4f7ee]/40 p-6" style={{ fontFamily: "Inter, system-ui, sans-serif" }}>

// t(key, lang, params?) — looks up the translation; if params is provided,
// replaces {tokens} in the result (e.g. t("of {n} today", lang, { n: 5 })).
const t = (key, lang, params) => {
  const dict = TRANSLATIONS[lang] || TRANSLATIONS.en;
  let result = dict[key] || key;
  if (params) {
    for (const k in params) {
      result = result.split("{" + k + "}").join(String(params[k]));
    }
  }
  return result;
};

      css += `.text-\\[${esc}\\]{color:${to} !important;}`;
      css += `.border-\\[${esc}\\]{border-color:${to} !important;}`;
      css += `.hover\\:bg-\\[${esc}\\]:hover{background-color:${to} !important;}`;
      css += `.hover\\:text-\\[${esc}\\]:hover{color:${to} !important;}`;
      css += `.hover\\:border-\\[${esc}\\]:hover{border-color:${to} !important;}`;
      css += `.focus\\:bg-\\[${esc}\\]:focus{background-color:${to} !important;}`;
      css += `.focus\\:border-\\[${esc}\\]:focus{border-color:${to} !important;}`;
    });
    style.textContent = css;

// ============================================================
// NOTIFICATIONS BELL — pulls actionable reminders from app data
// ============================================================
function NotificationsBell({ data, setActive, open, setOpen }) {
  const today = todayISO();
  const now = new Date();

  // 1. TODAY'S PENDING TASKS
  const tasksToday = (data.tasks || []).filter(t => t.date === today && !t.done);

  // 2. UPCOMING CLIENT BIRTHDAYS (next 14 days)
  const birthdaysUpcoming = (data.clients || []).filter(c => {
    if (!c.birthday) return false;
    const m = c.birthday.match(/^\d{4}-(\d{2})-(\d{2})$/);
    if (!m) return false;
    const bMonth = parseInt(m[1], 10) - 1;
    const bDay = parseInt(m[2], 10);
    const thisYear = new Date(now.getFullYear(), bMonth, bDay);
    if (thisYear < now) thisYear.setFullYear(now.getFullYear() + 1);
    const days = Math.ceil((thisYear - now) / (1000 * 60 * 60 * 24));
    return days >= 0 && days <= 14;
  }).map(c => {
    const m = c.birthday.match(/^\d{4}-(\d{2})-(\d{2})$/);
    const bMonth = parseInt(m[1], 10) - 1;
    const bDay = parseInt(m[2], 10);
    const thisYear = new Date(now.getFullYear(), bMonth, bDay);
    if (thisYear < now) thisYear.setFullYear(now.getFullYear() + 1);
    const days = Math.ceil((thisYear - now) / (1000 * 60 * 60 * 24));
    return { ...c, daysAway: days };
  }).sort((a, b) => a.daysAway - b.daysAway);

  // 3. CLIENTS NOT CONTACTED IN 30+ DAYS
  const stale = (data.clients || []).filter(c => {
    if (!c.lastContact) return false;
    const last = new Date(c.lastContact);
    const days = Math.floor((now - last) / (1000 * 60 * 60 * 24));
    return days >= 30 && c.status !== "lapsed";
  }).slice(0, 3);

  // 4. GOALS WITH DEADLINES IN NEXT 30 DAYS
  const goalsDue = (data.goals || []).filter(g => {
    if (!g.deadline || g.progress >= 100) return false;
    const d = new Date(g.deadline);
    const days = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
    return days >= 0 && days <= 30;
  });

  // 5. VITAMINS NOT TAKEN TODAY
  const vitaminsMissed = (Array.isArray(data.vitamins) ? data.vitamins : []).filter(v => !(v.taken || []).includes(today));

  // 6. RECRUITS STILL NON-LICENSED FOR 60+ DAYS
  const recruitsStalled = (data.recruits || []).filter(r => {
    if (r.stage !== "non-licensed" || !r.startDate) return false;
    const d = new Date(r.startDate);
    const days = Math.floor((now - d) / (1000 * 60 * 60 * 24));
    return days >= 60;
  }).slice(0, 3);

  const totalCount = tasksToday.length + birthdaysUpcoming.length + stale.length + goalsDue.length + vitaminsMissed.length + recruitsStalled.length;
  const hasAlerts = totalCount > 0;

  const Section = ({ icon: Icon, label, items, render, route, color = "#7a9a6e" }) => {
    if (items.length === 0) return null;
    return (
      <div className="border-b border-stone-100 last:border-0">
        <button onClick={() => { setOpen(false); if (route) setActive(route); }} className="w-full flex items-center gap-2 px-4 py-2 text-left hover:bg-[#f4f7ee]/40">
          <Icon className="w-3.5 h-3.5" style={{ color }} />
          <span className="text-[10px] tracking-[0.18em] text-stone-500 flex-1">{label}</span>
          <span className="text-[10px] font-mono text-stone-500">{items.length}</span>
        </button>
        <div className="px-4 pb-2 space-y-1">
          {items.slice(0, 4).map((it, i) => (
            <div key={i} className="text-xs text-stone-700 leading-snug">{render(it)}</div>
          ))}
          {items.length > 4 && <div className="text-[10px] text-stone-400 italic">+{items.length - 4} more</div>}
        </div>
      </div>
    );
  };

  return (
    <div className="relative">
      <button onClick={() => setOpen(!open)} className="p-2 rounded hover:bg-stone-100 relative" title={hasAlerts ? `${totalCount} reminder${totalCount === 1 ? "" : "s"}` : "No reminders"}>
        <Bell className="w-4 h-4" />
        {hasAlerts && (
          <span className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 bg-[#7a9a6e] text-white text-[9px] font-bold rounded-full flex items-center justify-center">{totalCount > 9 ? "9+" : totalCount}</span>
        )}
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-40" onClick={() => setOpen(false)} />
          <div className="absolute right-0 top-full mt-2 w-80 bg-white border border-stone-200 rounded-lg shadow-2xl z-50 overflow-hidden max-h-[70vh] overflow-y-auto">
            <div className="px-4 py-3 border-b border-stone-100 flex items-center justify-between">
              <div>
                <div className="text-sm font-semibold">Reminders</div>
                <div className="text-[10px] text-stone-500">{hasAlerts ? `${totalCount} thing${totalCount === 1 ? "" : "s"} on your radar` : "Nothing pressing — well done"}</div>
              </div>
              <Bell className="w-4 h-4 text-[#7a9a6e]" />
            </div>
            {!hasAlerts && (
              <div className="px-4 py-10 text-center text-sm text-stone-400 italic">You're all clear. Take a breath.</div>
            )}
            <Section
              icon={CheckSquare}
              label="TODAY'S PENDING TASKS"
              items={tasksToday}
              route="planner"
              render={(t) => <span>• {t.title}{t.priority === "critical" || t.priority === "high" ? <span className="ml-1 text-[#5b7351] font-medium tracking-wider">PRIORITY</span> : null}</span>}
            />
            <Section
              icon={Gift}
              label="UPCOMING BIRTHDAYS"
              items={birthdaysUpcoming}
              route="clients"
              color="#a16207"
              render={(c) => <span>🎂 {c.name} — {c.daysAway === 0 ? "today" : c.daysAway === 1 ? "tomorrow" : `in ${c.daysAway} days`}</span>}
            />
            <Section
              icon={Phone}
              label="CLIENTS GOING COLD (30+ DAYS)"
              items={stale}
              route="clients"
              color="#b45309"
              render={(c) => <span>📞 {c.name} — {Math.floor((now - new Date(c.lastContact)) / (1000 * 60 * 60 * 24))} days</span>}
            />
            <Section
              icon={Target}
              label="GOALS DUE THIS MONTH"
              items={goalsDue}
              route="goals"
              render={(g) => <span>🎯 {g.title} — {g.progress}% · due {fmtDate(g.deadline)}</span>}
            />
            <Section
              icon={Heart}
              label="VITAMINS NOT TAKEN TODAY"
              items={vitaminsMissed}
              route="cycle"
              color="#b07a7a"
              render={(v) => <span>💊 {v.name}</span>}
            />
            <Section
              icon={UserPlus}
              label="RECRUITS STALLED 60+ DAYS"
              items={recruitsStalled}
              route="recruits"
              color="#b45309"
              render={(r) => <span>👤 {r.name} — non-licensed since {fmtDate(r.startDate)}</span>}
            />
          </div>
        </>
      )}
    </div>
  );
}

// ============================================================
// CONFETTI ANIMATION
// ============================================================
function ConfettiBurst({ big = false }) {
  // Sage + white + butter yellow palette (soft, creamy yellows)
  const colors = big
    ? ["#7a9a6e", "#5b7351", "#a8c090", "#d3e0c5", "#bccfa8", "#9cb88f", "#4a5d3f", "#ffffff", "#f8f9f5", "#fefce8", "#fef9c3", "#f5e6a8", "#ecd9a0", "#e8d394"]
    : ["#7a9a6e", "#a8c090", "#d3e0c5", "#5b7351", "#ffffff", "#f8f9f5", "#fef9c3", "#f5e6a8"];
  const count = big ? 280 : 100;
  const shapes = ["square", "rect", "circle", "ribbon"];
  // Each piece radiates from center on a unique vector
  const pieces = useMemo(() => Array.from({ length: count }, (_, i) => {
    const angle = Math.random() * Math.PI * 2;
    const distance = (big ? 320 : 220) + Math.random() * (big ? 480 : 280);
    return {
      id: i,
      angle,
      tx: Math.cos(angle) * distance,
      ty: Math.sin(angle) * distance,
      delay: Math.random() * (big ? 0.15 : 0.08),
      duration: (big ? 1.6 : 1.2) + Math.random() * (big ? 1.4 : 0.8),
      color: colors[i % colors.length],
      rotate: Math.random() * 360,
      rotateEnd: 360 + Math.random() * 1080,
      size: (big ? 8 : 6) + Math.random() * (big ? 14 : 8),
      shape: shapes[i % shapes.length],
    };
  }), [big, count]);
  return (
    <>
      <style>{`
        @keyframes confettiBurst {
          0% { transform: translate3d(-50%, -50%, 0) translate3d(0, 0, 0) rotate(0deg) scale(0.4); opacity: 0; }
          15% { opacity: 1; transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--tx) * 0.3), calc(var(--ty) * 0.3), 0) rotate(120deg) scale(1.1); }
          80% { opacity: 1; }
          100% { transform: translate3d(-50%, -50%, 0) translate3d(var(--tx), calc(var(--ty) + 200px), 0) rotate(var(--rot-end, 720deg)) scale(0.9); opacity: 0; }
        }
        @keyframes confettiBurstBig {
          0% { transform: translate3d(-50%, -50%, 0) translate3d(0, 0, 0) rotate(0deg) scale(0.3); opacity: 0; }
          10% { opacity: 1; transform: translate3d(-50%, -50%, 0) translate3d(calc(var(--tx) * 0.2), calc(var(--ty) * 0.2), 0) rotate(180deg) scale(1.3); }
          85% { opacity: 1; }
          100% { transform: translate3d(-50%, -50%, 0) translate3d(var(--tx), calc(var(--ty) + 300px), 0) rotate(var(--rot-end, 1080deg)) scale(0.8); opacity: 0; }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes ringFill { from { stroke-dashoffset: var(--full); } to { stroke-dashoffset: var(--target); } }
        @keyframes burstIn {
          0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); opacity: 0; }
          50% { transform: translate(-50%, -50%) scale(1.4) rotate(10deg); opacity: 1; }
          75% { transform: translate(-50%, -50%) scale(0.95) rotate(-5deg); }
          100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes burstFade {
          0%, 70% { opacity: 1; }
          100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); }
        }
      `}</style>
      <div className="fixed inset-0 pointer-events-none z-[60] overflow-hidden">
        {pieces.map(p => {
          const isLight = ["#ffffff", "#f8f9f5", "#fefce8", "#fef9c3", "#f5e6a8", "#ecd9a0", "#e8d394", "#d3e0c5"].includes(p.color);
          const baseStyle = {
            position: "absolute",
            left: "50%",
            top: "50%",
            background: p.color,
            animation: `${big ? "confettiBurstBig" : "confettiBurst"} ${p.duration}s ${p.delay}s cubic-bezier(0.15, 0.8, 0.3, 1) forwards`,
            "--tx": `${p.tx}px`,
            "--ty": `${p.ty}px`,
            "--rot-end": `${p.rotateEnd}deg`,
            willChange: "transform, opacity",
            boxShadow: isLight ? "0 1px 3px rgba(91, 115, 81, 0.25)" : "0 1px 2px rgba(0,0,0,0.08)",
          };
          if (p.shape === "circle") {
            return <div key={p.id} style={{ ...baseStyle, width: `${p.size}px`, height: `${p.size}px`, borderRadius: "50%" }} />;
          } else if (p.shape === "rect") {
            return <div key={p.id} style={{ ...baseStyle, width: `${p.size * 1.6}px`, height: `${p.size * 0.4}px`, borderRadius: "1px" }} />;
          } else if (p.shape === "ribbon") {
            return <div key={p.id} style={{ ...baseStyle, width: `${p.size * 0.4}px`, height: `${p.size * 1.8}px`, borderRadius: "2px" }} />;
          }
          return <div key={p.id} style={{ ...baseStyle, width: `${p.size}px`, height: `${p.size * 0.6}px`, borderRadius: "1px" }} />;
        })}
      </div>
    </>
  );
}

    sky: "text-sky-400",
  };
  const baseCls = `p-4 rounded-lg border bg-white border-stone-200 group ${onClick ? "text-left w-full hover:border-[#7a9a6e] hover:shadow-sm transition cursor-pointer" : ""}`;
  const inner = (
    <>
      <div className="flex items-center justify-between mb-3">
        <span className="text-[10px] tracking-[0.2em] text-stone-500 uppercase">{label}</span>
        <div className="flex items-center gap-1">
          {onClear && (
            <span onClick={(e) => { e.stopPropagation(); e.preventDefault(); onClear(); }} className="p-0.5 rounded text-stone-400 hover:text-rose-500 hover:bg-rose-50 opacity-0 group-hover:opacity-100 transition cursor-pointer" title="Reset to zero">
              <RefreshCw className="w-3.5 h-3.5" />
            </span>
          )}
          {Icon && <Icon className={`w-4 h-4 ${accents[accent]}`} />}
        </div>
      </div>
      <div className={`font-serif text-3xl ${accents[accent]}`} style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{value}</div>
      {sub && <div className="text-xs mt-1 text-stone-500">{sub}</div>}
    </>
  );
  if (onClick) return <button onClick={onClick} className={baseCls}>{inner}</button>;
  return <div className={baseCls}>{inner}</div>;
}

function Panel({ title, action, children, dark, className = "" }) {
  return (
    <div className={`rounded-lg border ${dark ? "bg-white border-stone-200" : "bg-white border-stone-200"} ${className}`}>
      {title && (
        <div className={`flex items-center justify-between p-4 border-b ${dark ? "border-stone-200" : "border-stone-200"}`}>
          <h3 className="text-sm font-semibold tracking-wide">{title}</h3>
          {action}
        </div>
      )}
      <div className="p-4">{children}</div>
    </div>
  );
}

function AddButton({ onClick, label = "Add", dark }) {
  return (
    <button onClick={onClick} className="px-3 py-2 bg-[#9cb88f] text-stone-950 text-sm font-medium rounded hover:bg-[#a8c090] transition flex items-center gap-1.5">
      <Plus className="w-4 h-4" /> {label}
    </button>
  );
}

function Modal({ open, onClose, title, children, dark }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#f7faf3] backdrop-blur-sm" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className={`w-full max-w-lg rounded-lg border ${dark ? "bg-white border-stone-200 text-stone-900" : "bg-white border-stone-200 text-stone-900"} max-h-[90vh] overflow-y-auto`}>
        <div className={`flex items-center justify-between p-4 border-b ${dark ? "border-stone-200" : "border-stone-200"}`}>
          <h3 className="font-serif text-xl" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{title}</h3>
          <button onClick={onClose} className={`p-1 rounded ${dark ? "hover:bg-stone-100" : "hover:bg-stone-100"}`}><X className="w-4 h-4" /></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function TextField({ label, value, onChange, type = "text", dark, placeholder }) {
  return (
    <label className="block">
      <span className={`text-xs tracking-wide ${dark ? "text-stone-400" : "text-stone-600"}`}>{label}</span>
      <input value={value || ""} onChange={e => onChange(e.target.value)} type={type} placeholder={placeholder} className={`mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm ${dark ? "bg-white border-stone-200 text-stone-900" : "bg-white border-stone-300 text-stone-900"}`} />
    </label>
  );
}

function SelectField({ label, value, onChange, options, dark }) {
  // Accepts either ["a","b"] or [{ value, label }, …] — translated labels
  // need the latter so the dropdown shows Spanish without changing the
  // stored value.
  return (
    <label className="block">
      <span className={`text-xs tracking-wide ${dark ? "text-stone-400" : "text-stone-600"}`}>{label}</span>
      <select value={value} onChange={e => onChange(e.target.value)} className={`mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm capitalize ${dark ? "bg-white border-stone-200 text-stone-900" : "bg-white border-stone-300 text-stone-900"}`}>
        {options.map(o => {
          const v = (o && typeof o === "object") ? o.value : o;
          const l = (o && typeof o === "object") ? (o.label || o.value) : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </label>
  );
}

function ProgressRing({ value = 0, size = 100, stroke = 8, label, dark }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (value / 100) * c;
  return (
    <div className="relative inline-flex items-center justify-center">
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size / 2} cy={size / 2} r={r} stroke={dark ? "#292524" : "#e7e5e4"} strokeWidth={stroke} fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#7a9a6e" strokeWidth={stroke} fill="none" strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset 0.8s ease" }} />
      </svg>
      <div className="absolute text-center">
        <div className="font-serif text-xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{value}%</div>
        {label && <div className="text-[10px] text-stone-500">{label}</div>}
      </div>
    </div>
  );
}

  const [pwd, setPwd] = useState({ current: "", next: "", confirm: "" });
  const [pwdMsg, setPwdMsg] = useState(null);
  const [prefs, setPrefs] = useState(() => storage.get(`dom_prefs_${user.username}`, {
    notifyDaily: true,
    notifyMilestones: true,
    weekStart: "Monday",
    currency: "$",
    accent: "sage",

  // Keep prefs.accent + lang in sync with the lifted AppShell state
  useEffect(() => { if (accent && accent !== prefs.accent) setPrefs(p => ({ ...p, accent })); }, [accent]);
  useEffect(() => { if (lang && lang !== prefs.lang) setPrefs(p => ({ ...p, lang })); }, [lang]);

  useEffect(() => { storage.set(`dom_prefs_${user.username}`, prefs); }, [prefs, user.username]);

  const saveProfile = () => {
    setUser({ ...user, ...profile });
    triggerConfetti(t("Profile saved", lang));

  const changePassword = () => {
    setPwdMsg(null);
    if (!pwd.current || !pwd.next) { setPwdMsg({ type: "err", text: t("Fill in all fields.", lang) }); return; }
    if (pwd.next.length < 6) { setPwdMsg({ type: "err", text: t("New password must be at least 6 characters.", lang) }); return; }
    if (pwd.next !== pwd.confirm) { setPwdMsg({ type: "err", text: t("New passwords don't match.", lang) }); return; }

    const acct = accounts[user.username];
    if (!acct || acct.password !== pwd.current) { setPwdMsg({ type: "err", text: t("Current password is incorrect.", lang) }); return; }
    accounts[user.username] = { ...acct, password: pwd.next };
    storage.set("dom_accounts", accounts);

    setPwdMsg({ type: "ok", text: t("Password updated.", lang) });

  const exportData = () => {

    const a = document.createElement("a");
    a.href = url;
    a.download = `sovereign-export-${todayISO()}.json`;

          {pwdMsg && (

            <div className="grid grid-cols-2 gap-2">

                  >

                    <span className={`text-sm font-medium ${active ? "text-[#5b7351]" : "text-stone-700"}`}>{l.name}</span>

            </div>
            <p className="text-[11px] italic text-stone-400 mt-2" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("Translations cover the sidebar, greeting, and main labels — more strings are being translated module by module.", lang)}</p>

const EXPENSE_CATEGORIES = [
  "Housing", "Food & Groceries", "Transportation", "Utilities",
  "Health & Insurance", "Subscriptions", "Personal Care",
  "Entertainment", "Shopping", "Education", "Childcare", "Debt", "Other"
];

const INCOME_FREQ = ["weekly", "biweekly", "monthly", "yearly"];
const FREQ_TO_MONTHLY = { weekly: 4.33, biweekly: 2.17, monthly: 1, yearly: 1 / 12 };

function PersonalFinanceModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const pf = data.personalFinance || { income: [], expenses: [], savingsGoals: [] };
  const [tab, setTab] = useState("income");

  const blankIncome = { source: "", amount: "", frequency: "monthly" };
  const blankExpense = { name: "", amount: "", category: "" };
  const blankBill = { name: "", amount: "", frequency: "monthly" };
  const blankGoal = { name: "", target: "", saved: "" };
  const blankInvestment = { name: "", amount: "", type: "Stocks" };
  const [incomeForm, setIncomeForm] = useState(blankIncome);
  const [expenseForm, setExpenseForm] = useState(blankExpense);
  const [billForm, setBillForm] = useState(blankBill);
  const [goalForm, setGoalForm] = useState(blankGoal);
  const [investmentForm, setInvestmentForm] = useState(blankInvestment);
  const [editingIncomeId, setEditingIncomeId] = useState(null);
  const [incomeEditForm, setIncomeEditForm] = useState({ source: "", amount: "", frequency: "monthly", type: "recurring" });

  const INVESTMENT_TYPES = ["Stocks", "ETF", "Index Fund", "Bonds", "Crypto", "Real Estate", "Retirement (401k/IRA)", "Other"];

  const updatePF = (patch) => setData({ ...data, personalFinance: { ...pf, ...patch } });

  const addIncome = () => {
    if (!incomeForm.source.trim() || !parseFloat(incomeForm.amount)) return;
    const id = Math.max(0, ...pf.income.map(i => i.id || 0)) + 1;
    const isOneTime = incomeForm.frequency === "one-time";
    updatePF({ income: [...pf.income, {
      id,
      source: incomeForm.source.trim(),
      amount: parseFloat(incomeForm.amount) || 0,
      type: isOneTime ? "one-time" : "recurring",
      frequency: isOneTime ? "monthly" : incomeForm.frequency,
      date: todayISO(),
      notes: "",
    }] });
    setIncomeForm(blankIncome);
  };
  const removeIncome = (id) => updatePF({ income: pf.income.filter(i => i.id !== id) });

  const startEditIncome = (item) => {
    setEditingIncomeId(item.id);
    setIncomeEditForm({
      source: item.source || "",
      amount: item.amount != null ? String(item.amount) : "",
      frequency: item.type === "one-time" ? "one-time" : (item.frequency || "monthly"),
      type: item.type || "recurring",
    });
  };
  const cancelEditIncome = () => {
    setEditingIncomeId(null);
    setIncomeEditForm({ source: "", amount: "", frequency: "monthly", type: "recurring" });
  };
  const saveEditIncome = () => {
    if (editingIncomeId == null) return;
    const source = (incomeEditForm.source || "").trim();
    const amount = parseFloat(incomeEditForm.amount) || 0;
    if (!source || !amount) return;
    const isOneTime = incomeEditForm.frequency === "one-time";
    updatePF({
      income: pf.income.map(i => i.id === editingIncomeId ? {
        ...i,
        source,
        amount,
        type: isOneTime ? "one-time" : "recurring",
        frequency: isOneTime ? (i.frequency || "monthly") : incomeEditForm.frequency,
      } : i)
    });
    cancelEditIncome();
  };

  const addExpense = () => {
    if (!expenseForm.name.trim() || !parseFloat(expenseForm.amount)) return;
    const id = Math.max(0, ...pf.expenses.map(e => e.id || 0)) + 1;
    updatePF({ expenses: [...pf.expenses, {
      id,
      name: expenseForm.name.trim(),
      amount: parseFloat(expenseForm.amount) || 0,
      category: expenseForm.category,
      type: "one-time",
      frequency: "monthly",
      date: todayISO(),
      notes: "",
    }] });
    setExpenseForm(blankExpense);
  };

  const addBill = () => {
    if (!billForm.name.trim() || !parseFloat(billForm.amount)) return;
    const id = Math.max(0, ...pf.expenses.map(e => e.id || 0)) + 1;
    updatePF({ expenses: [...pf.expenses, {
      id,
      name: billForm.name.trim(),
      amount: parseFloat(billForm.amount) || 0,
      category: "Bills",
      type: "recurring",
      frequency: billForm.frequency,
      date: todayISO(),
      notes: "",
    }] });
    setBillForm(blankBill);
  };

  const removeExpense = (id) => {
    if (!confirm(t("Remove this entry?", lang))) return;
    updatePF({ expenses: pf.expenses.filter(e => e.id !== id) });
  };
  const updateExpenseField = (id, field, value) => {
    updatePF({ expenses: pf.expenses.map(e => e.id === id ? { ...e, [field]: value } : e) });
  };
  const updateIncomeField = (id, field, value) => {
    updatePF({ income: pf.income.map(i => i.id === id ? { ...i, [field]: value } : i) });
  };

  const addGoal = () => {
    if (!goalForm.name.trim() || !parseFloat(goalForm.target)) return;
    const id = Math.max(0, ...pf.savingsGoals.map(s => s.id || 0)) + 1;
    updatePF({ savingsGoals: [...pf.savingsGoals, {
      id,
      name: goalForm.name.trim(),
      target: parseFloat(goalForm.target) || 0,
      saved: parseFloat(goalForm.saved) || 0,
      deadline: "",
      why: "",
    }] });
    setGoalForm(blankGoal);
  };
  const removeGoal = (id) => updatePF({ savingsGoals: pf.savingsGoals.filter(s => s.id !== id) });

  const investments = Array.isArray(pf.investments) ? pf.investments : [];
  const addInvestment = () => {
    const name = (investmentForm.name || "").trim();
    if (!name || !parseFloat(investmentForm.amount)) return;
    const existingIds = investments.map(x => Number(x && x.id)).filter(n => !isNaN(n));
    const id = (existingIds.length ? Math.max(...existingIds) : 0) + 1;
    updatePF({ investments: [...investments, {
      id,
      name,
      amount: parseFloat(investmentForm.amount) || 0,
      type: investmentForm.type,
      date: todayISO(),
    }] });
    setInvestmentForm(blankInvestment);
  };
  const removeInvestment = (id) => {
    if (!confirm(t("Remove this investment?", lang))) return;
    updatePF({ investments: investments.filter(x => x.id !== id) });
  };
  const updateInvestmentAmount = (id, amount) => {
    const newAmount = Math.max(0, parseFloat(amount) || 0);
    updatePF({ investments: investments.map(x => x.id === id ? { ...x, amount: newAmount } : x) });
  };
  const updateInvestmentField = (id, field, value) => {
    updatePF({ investments: investments.map(x => x.id === id ? { ...x, [field]: value } : x) });
  };

  // Credit score tracking — three bureaus
  const BUREAUS = [
    { id: "experian",   name: "Experian",   accent: "#1d3a6e" },
    { id: "equifax",    name: "Equifax",    accent: "#c0392b" },
    { id: "transunion", name: "TransUnion", accent: "#0f6c5b" },
  ];
  // Migrate any legacy single-bureau shape into Experian to keep prior data
  const rawCredit = pf.credit || {};
  const credit = (rawCredit.experian || rawCredit.equifax || rawCredit.transunion)
    ? rawCredit
    : (rawCredit.current
        ? { experian: { current: rawCredit.current, lastUpdated: rawCredit.lastUpdated, history: rawCredit.history || [] }, equifax: { current: null, history: [] }, transunion: { current: null, history: [] } }
        : { experian: { current: null, history: [] }, equifax: { current: null, history: [] }, transunion: { current: null, history: [] } });

  const [creditDrafts, setCreditDrafts] = useState({ experian: "", equifax: "", transunion: "" });
  const saveCreditScore = (bureauId) => {
    const n = parseInt(creditDrafts[bureauId], 10);
    if (!n || n < 300 || n > 850) return;
    const b = credit[bureauId] || { current: null, history: [] };
    const history = Array.isArray(b.history) ? b.history : [];
    const next = {
      ...credit,
      [bureauId]: {
        current: n,
        lastUpdated: todayISO(),
        history: [...history, { date: todayISO(), score: n }].slice(-24),
      },
    };
    updatePF({ credit: next });
    setCreditDrafts({ ...creditDrafts, [bureauId]: "" });
  };
  const removeCreditEntry = (bureauId, date) => {
    const b = credit[bureauId] || { current: null, history: [] };
    const newHistory = (b.history || []).filter(h => h.date !== date);
    const latest = newHistory.at(-1);
    updatePF({
      credit: {
        ...credit,
        [bureauId]: { current: latest ? latest.score : null, lastUpdated: latest ? latest.date : null, history: newHistory },
      },
    });
  };
  const creditBand = (n) => {
    if (n == null) return { label: "—",         color: "#a8a29e", bg: "bg-stone-100",  text: "text-stone-500" };
    if (n >= 800)   return { label: "Excellent", color: "#5b7351", bg: "bg-emerald-50", text: "text-emerald-700" };
    if (n >= 740)   return { label: "Very good", color: "#7a9a6e", bg: "bg-teal-50",    text: "text-teal-700" };
    if (n >= 670)   return { label: "Good",      color: "#c0a363", bg: "bg-amber-50",   text: "text-amber-700" };
    if (n >= 580)   return { label: "Fair",      color: "#d97757", bg: "bg-orange-50",  text: "text-orange-700" };
    return            { label: "Needs work", color: "#b91c1c", bg: "bg-rose-50",    text: "text-rose-700" };
  };
  const bureauChange = (b) => {
    const h = (b && b.history) || [];
    return h.length >= 2 ? h.at(-1).score - h.at(-2).score : null;
  };
  const averageScore = (() => {
    const scores = BUREAUS.map(x => credit[x.id]?.current).filter(s => typeof s === "number");
    if (!scores.length) return null;
    return Math.round(scores.reduce((s, n) => s + n, 0) / scores.length);
  })();

  const updateSaved = (id, saved) => {
    const goal = pf.savingsGoals.find(g => g.id === id);
    const newSaved = Math.max(0, parseFloat(saved) || 0);
    updatePF({ savingsGoals: pf.savingsGoals.map(s => s.id === id ? { ...s, saved: newSaved } : s) });
    if (goal && newSaved >= goal.target && goal.saved < goal.target) {
      triggerConfetti(t("Goal hit: {name}", lang, { name: goal.name }), true);
    }
  };

  // Date-aware calculations
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const yearStr = String(now.getFullYear());
  const inThisMonth = (d) => (d || "").startsWith(ym);
  const inThisYear = (d) => (d || "").startsWith(yearStr);
  const monthsElapsed = now.getMonth() + 1; // Jan = 1, Dec = 12

  const monthlyOf = (it) => {
    if (it.type === "one-time" || !it.type) {
      return inThisMonth(it.date) ? (it.amount || 0) : 0;
    }
    return (it.amount || 0) * (FREQ_TO_MONTHLY[it.frequency] || 1);
  };

  const ytdOf = (it) => {
    if (it.type === "one-time" || !it.type) {
      return inThisYear(it.date) ? (it.amount || 0) : 0;
    }
    // Recurring: monthly equivalent × months elapsed in the year
    return (it.amount || 0) * (FREQ_TO_MONTHLY[it.frequency] || 1) * monthsElapsed;
  };

  const monthlyIncome = pf.income.reduce((sum, i) => sum + monthlyOf(i), 0);
  const monthlyExpenses = pf.expenses.reduce((sum, e) => sum + monthlyOf(e), 0);
  const monthlyNet = monthlyIncome - monthlyExpenses;
  const totalSaved = pf.savingsGoals.reduce((sum, g) => sum + (g.saved || 0), 0);

  const ytdIncome = pf.income.reduce((sum, i) => sum + ytdOf(i), 0);
  const ytdExpenses = pf.expenses.reduce((sum, e) => sum + ytdOf(e), 0);
  const ytdNet = ytdIncome - ytdExpenses;

  const fmt = (n) => `$${(Math.round((n || 0) * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

  const billsList = pf.expenses.filter(e => e.type === "recurring");
  const oneTimeExpenses = pf.expenses.filter(e => e.type === "one-time" || !e.type);

  const FOREST = "#3d5c34";
  const CREAM = "#f1ebda";

  const inputCls = "px-3 py-2.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white";

  return (
    <div>
      <div className="mb-6">
        <h1 className="font-serif text-3xl tracking-tight" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("Personal Finance", lang)}</h1>
        <p className={`text-sm mt-1 ${themeMuted}`}>{t("Your income, expenses, bills, and savings goals. Saved privately on this device only.", lang)}</p>
      </div>

      {/* YEAR-TO-DATE LITTLE BOXES */}
      <div className="text-[10px] tracking-[0.22em] text-[#5b7351] mb-2" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("YEAR TO DATE · {year}", lang, { year: yearStr })}</div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        {[
          { label: t("YTD INCOME", lang), val: ytdIncome },
          { label: t("YTD EXPENSES", lang), val: ytdExpenses },
          { label: t("YTD NET", lang), val: ytdNet },
          { label: t("INVESTMENTS", lang), val: investments.reduce((s, x) => s + (x.amount || 0), 0) },
        ].map(c => (
          <div key={c.label} className="rounded-lg p-4 text-center" style={{ background: FOREST, color: CREAM }}>
            <div className="text-[10px] tracking-[0.18em]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{c.label}</div>
            <div className="font-serif text-2xl mt-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{fmt(c.val)}</div>
          </div>
        ))}
      </div>

      {/* DIVIDER between YTD section and the rest */}
      <hr className="border-t border-stone-200 mb-6" />

      {/* DARK FOREST STAT CARDS */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        {[
          { label: t("MONTHLY INCOME", lang), val: monthlyIncome },
          { label: t("MONTHLY EXPENSES", lang), val: monthlyExpenses },
          { label: t("MONTHLY NET", lang), val: monthlyNet },
          { label: t("TOTAL SAVED", lang), val: totalSaved },
        ].map(c => (
          <div key={c.label} className="rounded-lg p-5 text-center" style={{ background: FOREST, color: CREAM }}>
            <div className="text-[11px] tracking-[0.18em]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{c.label}</div>
            <div className="font-serif text-3xl mt-2" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{fmt(c.val)}</div>
          </div>
        ))}
      </div>

      {/* TABS */}
      <div className="grid grid-cols-4 gap-1 sm:gap-2 mb-5">
        {[
          { id: "income", label: t("Income", lang) },
          { id: "expenses", label: t("Expenses", lang) },
          { id: "bills", label: t("Bills", lang) },
          { id: "goals", label: t("Goals", lang) },
        ].map(t => (
          <button
            key={t.id}
            onClick={() => setTab(t.id)}
            className={`px-2 sm:px-4 py-2 sm:py-3 rounded-md text-xs sm:text-sm tracking-wide transition ${tab === t.id ? "text-white" : `${themeMuted} hover:text-[#5b7351]`}`}
            style={{
              fontFamily: "'Playfair Display', Georgia, serif",
              background: tab === t.id ? FOREST : "transparent",
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {/* INLINE ADD FORM */}
      {tab === "income" && (
        <div className="grid grid-cols-1 sm:grid-cols-[1.5fr_1fr_1fr_auto] gap-2 mb-5">
          <input value={incomeForm.source} onChange={e => setIncomeForm({ ...incomeForm, source: e.target.value })} onKeyDown={e => e.key === "Enter" && addIncome()} placeholder={t("Source (e.g., Job, Side gig)", lang)} className={inputCls} />
          <input type="number" value={incomeForm.amount} onChange={e => setIncomeForm({ ...incomeForm, amount: e.target.value })} onKeyDown={e => e.key === "Enter" && addIncome()} placeholder={t("Amount", lang)} className={inputCls} />
          <select value={incomeForm.frequency} onChange={e => setIncomeForm({ ...incomeForm, frequency: e.target.value })} className={inputCls}>
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Biweekly</option>
            <option value="yearly">Yearly</option>
            <option value="one-time">One-time</option>
          </select>
          <button onClick={addIncome} className="px-5 py-2.5 rounded text-white font-medium flex items-center justify-center gap-1" style={{ background: FOREST }} title="Add">
            <Plus className="w-4 h-4" />
          </button>
        </div>
      )}

      {tab === "expenses" && (
        <div className="grid grid-cols-1 sm:grid-cols-[1.5fr_1fr_1fr_auto] gap-2 mb-5">
          <input value={expenseForm.name} onChange={e => setExpenseForm({ ...expenseForm, name: e.target.value })} onKeyDown={e => e.key === "Enter" && addExpense()} placeholder={t("Name (e.g., Restaurant, Gas)", lang)} className={inputCls} />
          <input type="number" value={expenseForm.amount} onChange={e => setExpenseForm({ ...expenseForm, amount: e.target.value })} onKeyDown={e => e.key === "Enter" && addExpense()} placeholder={t("Amount", lang)} className={inputCls} />
          <input value={expenseForm.category} onChange={e => setExpenseForm({ ...expenseForm, category: e.target.value })} onKeyDown={e => e.key === "Enter" && addExpense()} placeholder={t("Spent on…", lang)} className={inputCls} />
          <button onClick={addExpense} className="px-5 py-2.5 rounded text-white font-medium flex items-center justify-center gap-1" style={{ background: FOREST }} title="Add">
            <Plus className="w-4 h-4" />
          </button>
        </div>
      )}

      {tab === "bills" && (
        <div className="grid grid-cols-1 sm:grid-cols-[1.5fr_1fr_1fr_auto] gap-2 mb-5">
          <input value={billForm.name} onChange={e => setBillForm({ ...billForm, name: e.target.value })} onKeyDown={e => e.key === "Enter" && addBill()} placeholder={t("Bill (e.g., Rent, Spotify)", lang)} className={inputCls} />
          <input type="number" value={billForm.amount} onChange={e => setBillForm({ ...billForm, amount: e.target.value })} onKeyDown={e => e.key === "Enter" && addBill()} placeholder={t("Amount", lang)} className={inputCls} />
          <select value={billForm.frequency} onChange={e => setBillForm({ ...billForm, frequency: e.target.value })} className={inputCls}>
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Biweekly</option>
            <option value="yearly">Yearly</option>
          </select>
          <button onClick={addBill} className="px-5 py-2.5 rounded text-white font-medium flex items-center justify-center gap-1" style={{ background: FOREST }} title="Add">
            <Plus className="w-4 h-4" />
          </button>
        </div>
      )}

      {tab === "goals" && (
        <div className="grid grid-cols-1 sm:grid-cols-[1.5fr_1fr_1fr_auto] gap-2 mb-5">
          <input value={goalForm.name} onChange={e => setGoalForm({ ...goalForm, name: e.target.value })} onKeyDown={e => e.key === "Enter" && addGoal()} placeholder={t("Goal (e.g., Emergency fund)", lang)} className={inputCls} />
          <input type="number" value={goalForm.target} onChange={e => setGoalForm({ ...goalForm, target: e.target.value })} onKeyDown={e => e.key === "Enter" && addGoal()} placeholder={t("Target $", lang)} className={inputCls} />
          <input type="number" value={goalForm.saved} onChange={e => setGoalForm({ ...goalForm, saved: e.target.value })} onKeyDown={e => e.key === "Enter" && addGoal()} placeholder={t("Saved $", lang)} className={inputCls} />
          <button onClick={addGoal} className="px-5 py-2.5 rounded text-white font-medium flex items-center justify-center gap-1" style={{ background: FOREST }} title="Add">
            <Plus className="w-4 h-4" />
          </button>
        </div>
      )}

      {/* LIST / EMPTY STATES */}
      {tab === "income" && (
        pf.income.length === 0 ? (
          <div className={`p-12 text-center italic ${themeMuted} text-sm`}>{t("No income sources yet. Add one above.", lang)}</div>
        ) : (
          <div className="space-y-2">
            {[...pf.income].sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0)).map(i => editingIncomeId === i.id ? (
              <div key={i.id} className="grid grid-cols-1 sm:grid-cols-[auto_1.5fr_1fr_1fr_auto] gap-2 items-center p-3 rounded border-2 border-[#7a9a6e] bg-[#f4f7ee]/40">
                <RefreshCw className="w-4 h-4 text-[#7a9a6e] flex-shrink-0" />
                <input
                  value={incomeEditForm.source}
                  onChange={e => setIncomeEditForm({ ...incomeEditForm, source: e.target.value })}
                  onKeyDown={e => { if (e.key === "Enter") saveEditIncome(); if (e.key === "Escape") cancelEditIncome(); }}
                  placeholder={t("Source", lang)}
                  className={inputCls}
                  autoFocus
                />
                <input
                  type="number"
                  value={incomeEditForm.amount}
                  onChange={e => setIncomeEditForm({ ...incomeEditForm, amount: e.target.value })}
                  onKeyDown={e => { if (e.key === "Enter") saveEditIncome(); if (e.key === "Escape") cancelEditIncome(); }}
                  placeholder={t("Amount", lang)}
                  className={inputCls}
                />
                <select
                  value={incomeEditForm.frequency}
                  onChange={e => setIncomeEditForm({ ...incomeEditForm, frequency: e.target.value })}
                  className={inputCls}
                >
                  <option value="monthly">Monthly</option>
                  <option value="weekly">Weekly</option>
                  <option value="biweekly">Biweekly</option>
                  <option value="yearly">Yearly</option>
                  <option value="one-time">One-time</option>
                </select>
                <div className="flex items-center gap-1">
                  <button onClick={saveEditIncome} className="px-3 py-2 rounded text-white text-sm font-medium" style={{ background: FOREST }} title="Save">
                    <Check className="w-4 h-4" />
                  </button>
                  <button onClick={cancelEditIncome} className="p-2 text-stone-400 hover:text-stone-700" title="Cancel">
                    <X className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ) : (
              <div key={i.id} className="grid grid-cols-1 sm:grid-cols-[auto_1.6fr_120px_140px_auto] gap-2 items-center p-3 rounded border border-stone-200 hover:border-[#7a9a6e] transition">
                {i.type === "recurring" ? (
                  <RefreshCw className="w-4 h-4 text-[#7a9a6e] flex-shrink-0 hidden sm:block" />
                ) : (
                  <DollarSign className="w-4 h-4 text-[#7a9a6e] flex-shrink-0 hidden sm:block" />
                )}
                <input
                  value={i.source}
                  onChange={ev => updateIncomeField(i.id, "source", ev.target.value)}
                  placeholder={t("Source", lang)}
                  className="font-medium text-sm px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                />
                {i.type === "recurring" ? (
                  <select
                    value={i.frequency || "monthly"}
                    onChange={ev => updateIncomeField(i.id, "frequency", ev.target.value)}
                    className="text-xs text-stone-600 px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                  >
                    <option value="weekly">weekly</option>
                    <option value="biweekly">biweekly</option>
                    <option value="monthly">monthly</option>
                    <option value="yearly">yearly</option>
                  </select>
                ) : (
                  <input
                    type="date"
                    value={i.date || ""}
                    onChange={ev => updateIncomeField(i.id, "date", ev.target.value)}
                    className="text-xs text-stone-600 px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                  />
                )}
                <div className="flex items-center gap-1 sm:justify-end">
                  <span className="text-xs text-[#5b7351]">$</span>
                  <input
                    type="number"
                    value={i.amount || 0}
                    onChange={ev => updateIncomeField(i.id, "amount", parseFloat(ev.target.value) || 0)}
                    className="w-24 font-mono text-[#5b7351] font-semibold px-2 py-1.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white text-right"
                  />
                  {i.type === "recurring" && (
                    <span className="text-[10px] text-stone-500 ml-1 whitespace-nowrap">≈ ${Math.round((i.amount || 0) * (FREQ_TO_MONTHLY[i.frequency] || 1)).toLocaleString()}/mo</span>
                  )}
                </div>
                <button onClick={() => removeIncome(i.id)} className="p-2 text-stone-400 hover:text-rose-500 hover:bg-rose-50 rounded justify-self-end" title="Delete"><Trash2 className="w-4 h-4" /></button>
              </div>
            ))}
          </div>
        )
      )}

      {tab === "expenses" && (
        oneTimeExpenses.length === 0 ? (
          <div className={`p-12 text-center italic ${themeMuted} text-sm`}>No expenses yet. Add one above.</div>
        ) : (
          <div className="space-y-2">
            {[...oneTimeExpenses].sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(e => (
              <div key={e.id} className={`grid grid-cols-1 sm:grid-cols-[1.6fr_1.2fr_120px_120px_auto] gap-2 items-center p-3 rounded border ${inThisMonth(e.date) ? "border-rose-200 bg-rose-50/30" : "border-stone-200"} hover:border-[#7a9a6e] transition`}>
                <input
                  value={e.name}
                  onChange={ev => updateExpenseField(e.id, "name", ev.target.value)}
                  placeholder="Name"
                  className="font-medium text-sm px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                />
                <input
                  value={e.category || ""}
                  onChange={ev => updateExpenseField(e.id, "category", ev.target.value)}
                  placeholder={t("Spent on…", lang)}
                  className="text-xs text-stone-600 italic px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                />
                <input
                  type="date"
                  value={e.date || ""}
                  onChange={ev => updateExpenseField(e.id, "date", ev.target.value)}
                  className="text-xs text-stone-600 font-mono px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                />
                <div className="flex items-center gap-1 sm:justify-end">
                  <span className="text-xs text-rose-500">$</span>
                  <input
                    type="number"
                    value={e.amount || 0}
                    onChange={ev => updateExpenseField(e.id, "amount", parseFloat(ev.target.value) || 0)}
                    className="w-24 font-mono text-rose-600 font-semibold px-2 py-1.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white text-right"
                  />
                </div>
                <button onClick={() => removeExpense(e.id)} className="p-2 text-stone-400 hover:text-rose-500 hover:bg-rose-50 rounded justify-self-end" title="Delete"><Trash2 className="w-4 h-4" /></button>
              </div>
            ))}
          </div>
        )
      )}

      {tab === "bills" && (
        billsList.length === 0 ? (
          <div className={`p-12 text-center italic ${themeMuted} text-sm`}>No bills yet. Add one above.</div>
        ) : (
          <div className="space-y-2">
            {[...billsList].sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0)).map(e => (
              <div key={e.id} className="grid grid-cols-1 sm:grid-cols-[auto_1.6fr_120px_140px_auto] gap-2 items-center p-3 rounded border border-stone-200 hover:border-[#7a9a6e] transition">
                <RefreshCw className="w-4 h-4 text-[#7a9a6e] flex-shrink-0 hidden sm:block" />
                <input
                  value={e.name}
                  onChange={ev => updateExpenseField(e.id, "name", ev.target.value)}
                  placeholder="Bill name"
                  className="font-medium text-sm px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                />
                <select
                  value={e.frequency || "monthly"}
                  onChange={ev => updateExpenseField(e.id, "frequency", ev.target.value)}
                  className="text-xs text-stone-600 px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-white outline-none bg-transparent"
                >
                  <option value="weekly">weekly</option>
                  <option value="biweekly">biweekly</option>
                  <option value="monthly">monthly</option>
                  <option value="yearly">yearly</option>
                </select>
                <div className="flex items-center gap-1 sm:justify-end">
                  <span className="text-xs text-rose-500">$</span>
                  <input
                    type="number"

        {investments.length === 0 ? (
          <div className={`p-10 text-center italic ${themeMuted} text-sm`}>No investments yet. Add one above.</div>
        ) : (
          <div className="space-y-2">
            {[...investments].sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0)).map(x => (
              <div key={x.id} className="grid grid-cols-1 sm:grid-cols-[140px_1fr_140px_auto] gap-2 items-center p-3 rounded border border-stone-200 hover:border-[#7a9a6e] transition">
                {/* TYPE — editable text */}
                <input
                  value={x.type}
                  onChange={e => updateInvestmentField(x.id, "type", e.target.value)}

                  list="investment-types"
                />
                {/* NAME — editable input */}
                <input
                  value={x.name}
                  onChange={e => updateInvestmentField(x.id, "name", e.target.value)}

                  className="font-medium text-sm px-2 py-1.5 rounded border border-transparent focus:border-[#7a9a6e] focus:bg-[#f4f7ee] outline-none bg-transparent min-w-0"

                <div className="flex items-center gap-2 sm:justify-end">
                  <span className="text-xs text-stone-400">$</span>
                  <input
                    type="number"

                    onChange={e => updateInvestmentAmount(x.id, e.target.value)}
