// FINANCIALS MODULE
// ============================================================
function FinancialsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const [open, setOpen] = useState(false);
  const [tab, setTab] = useState("overview");
  const blankExpenseForm = { category: "Leads", amount: 0, date: todayISO(), note: "" };
  const [form, setForm] = useState(blankExpenseForm);
  const [editingExpenseId, setEditingExpenseId] = useState(null);

  // Revenue logging
  const currentMonthLabel = new Date().toLocaleString("en-US", { month: "short" });
  const [revOpen, setRevOpen] = useState(false);
  const blankRevForm = { month: currentMonthLabel, revenue: "", expenses: "" };
  const [revForm, setRevForm] = useState(blankRevForm);
  const [editingMonth, setEditingMonth] = useState(null);

  // Commission logging
  const [commOpen, setCommOpen] = useState(false);
  const blankCommForm = { type: "FYC", source: "", amount: "" };
  const [commForm, setCommForm] = useState(blankCommForm);
  const [editingCommissionId, setEditingCommissionId] = useState(null);

  const totalRev = data.revenueData.reduce((s, r) => s + r.revenue, 0);
  const totalExp = data.revenueData.reduce((s, r) => s + r.expenses, 0);
  const netProfit = totalRev - totalExp;
  const margin = totalRev === 0 ? 0 : Math.round((netProfit / totalRev) * 100);

  const commissionByType = ["FYC", "Renewals", "Override", "Bonus"].map(type => ({
    type, total: data.commissions.filter(c => c.type === type).reduce((s, c) => s + c.amount, 0)
  }));

  const openExpenseAdd = () => { setEditingExpenseId(null); setForm(blankExpenseForm); setOpen(true); };
  const openExpenseEdit = (exp) => {
    setEditingExpenseId(exp.id);
    setForm({ category: exp.category || "Leads", amount: exp.amount, date: exp.date || todayISO(), note: exp.note || "" });
    setOpen(true);
  };
  const saveExpense = () => {
    if (!form.amount) return;
    const amount = parseFloat(form.amount) || 0;
    const list = data.expenses || [];
    if (editingExpenseId != null) {
      setData({ ...data, expenses: list.map(e => e.id === editingExpenseId ? { ...e, ...form, amount } : e) });
    } else {
      const id = (list.length ? Math.max(0, ...list.map(e => Number(e.id) || 0)) : 0) + 1;
      setData({ ...data, expenses: [...list, { ...form, id, amount }] });
    }
    setOpen(false);
    setEditingExpenseId(null);
    setForm(blankExpenseForm);
  };
  const removeExpense = (id) => {
    if (!confirm("Delete this expense?")) return;
    setData({ ...data, expenses: (data.expenses || []).filter(e => e.id !== id) });
  };

  const openCommissionAdd = () => { setEditingCommissionId(null); setCommForm(blankCommForm); setCommOpen(true); };
  const openCommissionEdit = (c) => {
    setEditingCommissionId(c.id);
    setCommForm({ type: c.type || "FYC", source: c.source || "", amount: String(c.amount ?? "") });
    setCommOpen(true);
  };
  const saveCommission = () => {
    const source = (commForm.source || "").trim();
    const amount = parseFloat(commForm.amount) || 0;
    if (!source || !amount) return;
    const list = data.commissions || [];
    if (editingCommissionId != null) {
      setData({ ...data, commissions: list.map(c => c.id === editingCommissionId ? { ...c, type: commForm.type, source, amount } : c) });
    } else {
      const id = (list.length ? Math.max(0, ...list.map(c => Number(c.id) || 0)) : 0) + 1;
      setData({ ...data, commissions: [...list, { id, type: commForm.type, source, amount }] });
    }
    setCommOpen(false);
    setEditingCommissionId(null);
    setCommForm(blankCommForm);
  };
  const removeCommission = (id) => {
    if (!confirm("Delete this commission entry?")) return;
    setData({ ...data, commissions: (data.commissions || []).filter(c => c.id !== id) });
  };

  const openLogRevenue = () => {
    setEditingMonth(null);
    setRevForm({ month: currentMonthLabel, revenue: "", expenses: "" });
    setRevOpen(true);
  };
  const startEditRevenue = (entry) => {
    setEditingMonth(entry.month);
    setRevForm({ month: entry.month, revenue: String(entry.revenue ?? ""), expenses: String(entry.expenses ?? "") });
    setRevOpen(true);
  };
  const saveRevenue = () => {
    const month = (revForm.month || "").trim();
    const revenue = parseFloat(revForm.revenue) || 0;
    const expenses = parseFloat(revForm.expenses) || 0;
    if (!month) return;
    const list = Array.isArray(data.revenueData) ? data.revenueData : [];
    let next;
    if (editingMonth) {
      next = list.map(r => r.month === editingMonth ? { month, revenue, expenses } : r);
    } else {
      const idx = list.findIndex(r => r.month === month);
      if (idx >= 0) next = list.map((r, i) => i === idx ? { month, revenue, expenses } : r);
      else next = [...list, { month, revenue, expenses }];
    }
    setData({ ...data, revenueData: next });
    setRevOpen(false);
    setEditingMonth(null);
    setRevForm(blankRevForm);
  };
  const deleteRevenue = (month) => {
    if (!confirm(`Delete revenue entry for ${month}?`)) return;
    setData({ ...data, revenueData: data.revenueData.filter(r => r.month !== month) });
  };

  const COLORS = ["#7a9a6e", "#5b7351", "#78716c", "#a8c090", "#a8c090"];

  return (
    <div>
      <PageHeader title="Financials" subtitle="Revenue. Expenses. Net. Year over year." dark={dark}
        action={
          <div className="flex gap-2 flex-wrap">
            <button onClick={openLogRevenue} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm font-medium rounded hover:bg-[#5b7351] flex items-center gap-1.5"><Plus className="w-4 h-4" /> Log Revenue</button>
            <button onClick={openCommissionAdd} className="px-3 py-2 border border-stone-300 hover:border-[#7a9a6e] text-sm rounded flex items-center gap-1.5"><Plus className="w-4 h-4" /> Log Commission</button>
            <AddButton onClick={openExpenseAdd} label="Add Expense" dark={dark} />
          </div>
        } />

      <div className="flex gap-1 mb-5 border-b border-stone-200">
        {["overview", "expenses", "commissions"].map(t => (
          <button key={t} onClick={() => setTab(t)} className={`px-4 py-2 text-sm capitalize border-b-2 transition ${tab === t ? "border-[#9cb88f] text-[#9cb88f]" : `border-transparent ${themeMuted}`}`}>{t}</button>
        ))}
      </div>

      {tab === "overview" && (
        <>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
            <StatCard label="Revenue (6mo)" value={<><span className="text-2xl">$</span><AnimatedNumber value={totalRev} /></>} accent="amber" dark={dark} icon={DollarSign} />
            <StatCard label="Expenses (6mo)" value={<><span className="text-2xl">$</span><AnimatedNumber value={totalExp} /></>} accent="rose" dark={dark} icon={TrendingDown} />
            <StatCard label="Net Profit" value={<><span className="text-2xl">$</span><AnimatedNumber value={netProfit} /></>} accent="emerald" dark={dark} icon={TrendingUp} />
            <StatCard label="Margin" value={<AnimatedNumber value={margin} suffix="%" />} accent="emerald" dark={dark} icon={PieIcon} />
          </div>

          <div className="grid lg:grid-cols-2 gap-5 mb-5">
            <Panel title="Revenue vs Expenses" dark={dark}>
              <ResponsiveContainer width="100%" height={250}>
                <BarChart data={data.revenueData}>
                  <CartesianGrid stroke={dark ? "#292524" : "#e7e5e4"} strokeDasharray="3 3" />
                  <XAxis dataKey="month" stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} />
                  <YAxis stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} />
                  <Tooltip contentStyle={{ background: dark ? "#1c1917" : "#fff", border: "1px solid #57534e", fontSize: 12 }} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  <Bar dataKey="revenue" fill="#7a9a6e" />
                  <Bar dataKey="expenses" fill="#78716c" />
                </BarChart>
              </ResponsiveContainer>
            </Panel>
            <Panel title="Commission Breakdown" dark={dark}>
              <ResponsiveContainer width="100%" height={250}>
                <PieChart>
                  <Pie data={commissionByType} dataKey="total" nameKey="type" outerRadius={90} label={(e) => e.type}>
                    {commissionByType.map((_, i) => <Cell key={i} fill={COLORS[i]} />)}
                  </Pie>
                  <Tooltip contentStyle={{ background: dark ? "#1c1917" : "#fff", border: "1px solid #57534e", fontSize: 12 }} />
                </PieChart>
              </ResponsiveContainer>
            </Panel>
          </div>

          <Panel title="Year-over-Year Revenue Trend" dark={dark}>
            <ResponsiveContainer width="100%" height={220}>
              <LineChart data={data.revenueData}>
                <CartesianGrid stroke={dark ? "#292524" : "#e7e5e4"} strokeDasharray="3 3" />
                <XAxis dataKey="month" stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} />
                <YAxis stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} />
                <Tooltip contentStyle={{ background: dark ? "#1c1917" : "#fff", border: "1px solid #57534e", fontSize: 12 }} />
                <Line type="monotone" dataKey="revenue" stroke="#7a9a6e" strokeWidth={2.5} dot={{ fill: "#7a9a6e" }} />
              </LineChart>
            </ResponsiveContainer>
          </Panel>

          <Panel title="Monthly entries" dark={dark} className="mt-5" action={

              </thead>
              <tbody>
                {[...data.commissions].sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0)).map(c => (
                  <tr key={c.id} className="border-t border-stone-200">
                    <td className="p-2"><span className="px-2 py-0.5 text-xs rounded bg-[#9cb88f]/10 text-[#9cb88f]">{c.type}</span></td>
                    <td className="p-2 text-sm">{c.source}</td>

                    <td className="p-2 text-right whitespace-nowrap">
                      <button onClick={() => openCommissionEdit(c)} className="p-1 text-stone-400 hover:text-[#5b7351]" title="Edit"><Edit2 className="w-3.5 h-3.5" /></button>
                      <button onClick={() => removeCommission(c.id)} className="p-1 text-stone-400 hover:text-rose-500" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>

      <Modal open={open} onClose={() => { setOpen(false); setEditingExpenseId(null); }} title={editingExpenseId ? "Edit Expense" : "Log Expense"} dark={dark}>
        <div className="grid grid-cols-2 gap-3">

        <button onClick={saveCommission} className="w-full mt-4 py-2 bg-[#7a9a6e] text-white font-medium rounded hover:bg-[#5b7351]">{editingCommissionId ? "Save changes" : "Log commission"}</button>

      <Modal open={revOpen} onClose={() => { setRevOpen(false); setEditingMonth(null); }} title={editingMonth ? `Edit ${editingMonth}` : "Log Revenue"} dark={dark}>

        <div className="grid grid-cols-1 gap-3">

          <TextField label="Revenue ($)" value={revForm.revenue} onChange={v => setRevForm({ ...revForm, revenue: v })} type="number" dark={dark} placeholder="0" />
          <TextField label="Expenses ($)" value={revForm.expenses} onChange={v => setRevForm({ ...revForm, expenses: v })} type="number" dark={dark} placeholder="0" />
        </div>
        <button onClick={saveRevenue} className="w-full mt-4 py-2 bg-[#7a9a6e] text-white font-medium rounded hover:bg-[#5b7351]">{editingMonth ? "Save changes" : "Log this month"}</button>
      </Modal>
    </div>
  );
}

const PLANNER_HOURS = [
  "5:00 AM", "5:30 AM", "6:00 AM", "6:30 AM",
  "7:00 AM", "7:30 AM", "8:00 AM", "8:30 AM",
  "9:00 AM", "9:30 AM", "10:00 AM", "10:30 AM",
  "11:00 AM", "11:30 AM", "12:00 PM", "12:30 PM",
  "1:00 PM", "1:30 PM", "2:00 PM", "2:30 PM",
  "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM",
  "5:00 PM", "5:30 PM", "6:00 PM", "6:30 PM",
  "7:00 PM", "7:30 PM", "8:00 PM", "8:30 PM",
  "9:00 PM", "9:30 PM", "10:00 PM", "10:30 PM",
  "11:00 PM"
];

// Hour-only rows for the weekly grid (5 AM → 11 PM)
const WEEK_HOURS = [
  "5:00 AM", "6:00 AM", "7:00 AM", "8:00 AM", "9:00 AM",
  "10:00 AM", "11:00 AM", "12:00 PM", "1:00 PM", "2:00 PM",
  "3:00 PM", "4:00 PM", "5:00 PM", "6:00 PM", "7:00 PM",
  "8:00 PM", "9:00 PM", "10:00 PM", "11:00 PM"
];

const WEEK_DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

// Get the Monday of the ISO week containing `dateStr` (YYYY-MM-DD)
function startOfWeekMonday(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay(); // 0 Sun … 6 Sat
  const diff = (day === 0 ? -6 : 1 - day); // shift to Monday
  d.setDate(d.getDate() + diff);
  return toLocalISO(d);
}

function addDaysISO(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return toLocalISO(d);
}

function PlannerModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  // Daily Planner — explicit onFocus/onBlur tracking so inputs reliably grow
  // when you click in and collapse when you click out (CSS :focus alone was
  // flaky on touch). i18n via t(); layout is two 3-square rows above the
  // full-width Weekly Schedule.
  const [date, setDate] = useState(todayISO());
  const [newTitle, setNewTitle] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editingText, setEditingText] = useState("");
  const [focusedField, setFocusedField] = useState(null);

  // Weekly schedule state (lifted from the Calendar — verbatim)
  const [weekAnchor, setWeekAnchor] = useState(() => todayISO());
  const [showHalfHours, setShowHalfHours] = useState(false);
  const [focusedCell, setFocusedCell] = useState(null);
  const showWeeklySchedule = data.showWeeklySchedule !== false;
  const toggleWeeklySchedule = () => setData({ ...data, showWeeklySchedule: !showWeeklySchedule });

  const showPriorities = data.showPriorities !== false;
  const togglePriorities = () => setData({ ...data, showPriorities: !showPriorities });

  // grow(key, base, focus, rows, extraClass) — returns props for a textarea
  // that grows when focused and collapses back when blurred. Same UX as the
  // Weekly Schedule cells. extraClass lets a caller layer on done-state
  // styles (line-through, muted color) without breaking the focus rings.
  const grow = (key, base = 40, focus = 120, focusRows = 5, extraClass = "") => {
    const isFocused = focusedField === key;
    return {
      onFocus: () => setFocusedField(key),
      onBlur: () => setFocusedField(prev => prev === key ? null : prev),
      rows: isFocused ? focusRows : 1,
      className:
        "w-full px-3 py-2 border rounded text-sm outline-none resize-none transition-all duration-150 " +
        (isFocused
          ? "bg-[#f4f7ee] border-[#7a9a6e] shadow-md ring-2 ring-[#7a9a6e]/20 overflow-auto"
          : "bg-white border-stone-200 overflow-hidden") +
        (extraClass ? " " + extraClass : ""),
      style: {
        minHeight: isFocused ? focus + "px" : base + "px",
        height: isFocused ? "auto" : base + "px",
      },
    };
  };

  // Small "Done" pill that appears at the top-right of any focused field —
  // gives users an explicit way to collapse the textarea without hunting for
  // somewhere to click outside (reliable on mobile, where tap-outside is
  // flaky). Clicking it lets the natural blur fire, which collapses via the
  // grow() onBlur handler.
  const CollapseBtn = ({ shown }) => shown ? (
    <button
      type="button"
      tabIndex={-1}
      aria-label="Done editing"
      title="Done"
      className="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-[#7a9a6e] text-white flex items-center justify-center shadow-sm hover:bg-[#5b7351] transition-colors"
    >
      <Check className="w-3 h-3" />
    </button>
  ) : null;

  // ----- Per-day plan -----
  const planners = data.planners || {};
  const todayPlan = planners[date] || {};
  const priorities = Array.isArray(todayPlan.priorities) && todayPlan.priorities.length === 3 ? todayPlan.priorities : ["", "", ""];
  const wins = Array.isArray(todayPlan.wins) && todayPlan.wins.length === 3 ? todayPlan.wins : ["", "", ""];
  const prioritiesDone = Array.isArray(todayPlan.prioritiesDone) && todayPlan.prioritiesDone.length === 3 ? todayPlan.prioritiesDone : [false, false, false];
  const winsDone = Array.isArray(todayPlan.winsDone) && todayPlan.winsDone.length === 3 ? todayPlan.winsDone : [false, false, false];
  const gratitude = todayPlan.gratitude || "";
  const journal = todayPlan.journal || "";
  const tomorrow = todayPlan.tomorrow || "";

  const updatePlan = (patch) => {
    const next = { ...(planners[date] || {}), ...patch };
    setData({ ...data, planners: { ...planners, [date]: next } });
  };
  const setPriority = (i, v) => { const arr = [...priorities]; arr[i] = v; updatePlan({ priorities: arr }); };
  const setWin = (i, v) => { const arr = [...wins]; arr[i] = v; updatePlan({ wins: arr }); };
  const togglePriorityDone = (i) => {
    const arr = [...prioritiesDone]; arr[i] = !arr[i];
    updatePlan({ prioritiesDone: arr });
    if (arr[i] && triggerConfetti) triggerConfetti();
  };
  const toggleWinDone = (i) => {
    const arr = [...winsDone]; arr[i] = !arr[i];
    updatePlan({ winsDone: arr });
    if (arr[i] && triggerConfetti) triggerConfetti();
  };

  // ----- Weekly schedule helpers (verbatim from the Calendar) -----
  const weekStart = startOfWeekMonday(weekAnchor);
  const weekDates = WEEK_DAYS.map((_, i) => addDaysISO(weekStart, i));
  const shiftWeek = (n) => setWeekAnchor(addDaysISO(weekAnchor, n * 7));
  const updateBlockForDate = (isoDate, hour, v) => {
    const existing = planners[isoDate] || { priorities: ["","",""], blocks: {}, wins: ["","",""], gratitude: "", journal: "", waterGlasses: 0 };
    const next = { ...existing, blocks: { ...(existing.blocks || {}), [hour]: v } };
    setData({ ...data, planners: { ...planners, [isoDate]: next } });
  };

  // ----- To-do list -----
  const allTasks = Array.isArray(data.tasks) ? data.tasks : [];
  const dayTasks = allTasks.filter(t => t && t.date === date);
  const doneCount = dayTasks.filter(t => t.done).length;
  const setTasks = (next) => setData({ ...data, tasks: next });
  const addTask = () => {
    const title = (newTitle || "").trim();
    if (!title) return;
    const ids = allTasks.map(t => Number(t && t.id)).filter(n => !isNaN(n));
    const id = (ids.length ? Math.max(...ids) : 0) + 1;
    setTasks([...allTasks, { id, title, date, done: false }]);
    setNewTitle("");
  };
  const toggleTask = (id) => {
    const t = allTasks.find(x => x && x.id === id);
    const becoming = t && !t.done;
    setTasks(allTasks.map(x => x && x.id === id ? { ...x, done: !x.done } : x));
    if (becoming && triggerConfetti) triggerConfetti();
  };
  const removeTask = (id) => setTasks(allTasks.filter(x => x && x.id !== id));
  const startEdit = (task) => { setEditingId(task.id); setEditingText(task.title); };
  const saveEdit = () => {
    const text = (editingText || "").trim();
    if (!text) { setEditingId(null); return; }
    setTasks(allTasks.map(x => x && x.id === editingId ? { ...x, title: text } : x));
    setEditingId(null);
  };
  const clearCompleted = () => setTasks(allTasks.filter(t => !(t && t.date === date && t.done)));

  // ----- Date controls -----
  const shiftDate = (days) => {
    const d = new Date(date + "T00:00:00");
    d.setDate(d.getDate() + days);
    setDate(toLocalISO(d));
  };
  const isToday = date === todayISO();
  const subtitle = fmtDate(date);

  const dateAction = (
    <div className="flex items-center gap-1 text-stone-500">
      <button onClick={() => shiftDate(-1)} className="px-2 py-1 rounded hover:bg-[#f4f7ee] hover:text-[#5b7351] text-sm" aria-label={t("Previous day", lang)}>←</button>
      <input
        type="date"
        value={date}
        onChange={e => setDate(e.target.value || todayISO())}
        className="px-2 py-1 bg-transparent border border-transparent hover:border-stone-200 focus:border-[#7a9a6e] rounded text-xs text-stone-600 focus:outline-none"
      />
      <button onClick={() => shiftDate(1)} className="px-2 py-1 rounded hover:bg-[#f4f7ee] hover:text-[#5b7351] text-sm" aria-label={t("Next day", lang)}>→</button>
      {!isToday && (
        <button onClick={() => setDate(todayISO())} className="ml-1 px-2 py-1 text-[10px] uppercase tracking-wider text-[#5b7351] hover:underline">{t("Today", lang)}</button>
      )}
    </div>
  );

  // ----- Section pieces -----
  const PrioritiesCard = (
    <div className={`rounded-2xl border ${themePanel} ${showPriorities ? "p-5" : "p-3"} h-full flex flex-col`}>
      <button onClick={togglePriorities} className="flex items-start gap-2 text-left group" title={showPriorities ? t("Hide priorities", lang) : t("Expand priorities", lang)}>
        <ChevronRight className={`w-4 h-4 text-stone-400 mt-0.5 flex-shrink-0 transition ${showPriorities ? "rotate-90" : ""}`} />
        <h2 className="text-sm font-semibold tracking-[0.2em] text-stone-700 group-hover:text-[#5b7351]">{t("TOP 3 PRIORITIES", lang)}</h2>
      </button>
      {showPriorities && (
        <div className="space-y-2 mt-4 flex-1">
          {priorities.map((p, i) => {
            const done = !!prioritiesDone[i];
            const key = "priority-" + i;
            return (
              <div key={i} className="flex items-start gap-2">
                <button
                  type="button"
                  onClick={() => togglePriorityDone(i)}
                  aria-label={done ? t("Mark not done", lang) : t("Mark done", lang)}
                  className={`w-5 h-5 mt-2 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition ${done ? "bg-[#7a9a6e] border-[#7a9a6e] text-white" : "border-[#9cb88f] hover:bg-[#f4f7ee]"}`}
                >
                  {done && <Check className="w-3 h-3" />}
                </button>
                <span className={`font-display text-xl w-6 text-center pt-1.5 flex-shrink-0 ${done ? "text-stone-300" : "text-[#5b7351]"}`} style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{i + 1}</span>
                <div className="relative flex-1">
                  <textarea {...grow(key, 40, 120, 5, done ? "line-through text-stone-400" : "")} value={p} onChange={e => setPriority(i, e.target.value)}
                    placeholder={i === 0 ? t("The thing that matters most…", lang) : i === 1 ? t("Second priority", lang) : t("Third priority", lang)} />
                  <CollapseBtn shown={focusedField === key} />
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );

  const TodoCard = (
    <div className={`rounded-2xl border ${themePanel} p-5 h-full flex flex-col`}>
      <div className="flex items-baseline justify-between mb-3">
        <h2 className="text-sm font-semibold tracking-[0.2em] text-stone-700">{t("TO-DO LIST", lang)}</h2>
        <div className="text-[11px] text-stone-500">{dayTasks.length === 0 ? t("no tasks", lang) : `${doneCount} ${t("of", lang)} ${dayTasks.length} ${t("done", lang)}`}</div>
      </div>
      <textarea {...grow("todo-new")} value={newTitle} onChange={e => setNewTitle(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addTask(); } }}
        placeholder={t("Add a task…", lang)} />
      <div className="flex justify-between items-center mt-2 mb-3">
        {doneCount > 0 ? (
          <button onClick={clearCompleted} className="text-[11px] italic text-stone-500 hover:text-[#5b7351]">{t("clear completed", lang)}</button>
        ) : <span className="text-[11px] italic text-stone-400">{t("Press Enter to add", lang)}</span>}
        <button onClick={addTask}
          className="px-3 py-1 text-[11px] uppercase tracking-wider text-stone-600 border border-stone-200 rounded hover:bg-[#f4f7ee] hover:border-[#7a9a6e] hover:text-[#5b7351] transition">
          + {t("Add", lang)}
        </button>
      </div>
      <div className="flex-1 overflow-y-auto" style={{ maxHeight: "260px" }}>
        {dayTasks.length === 0 ? (
          <div className={`py-6 text-center ${themeMuted} text-xs italic`}>{t("Nothing here yet.", lang)}</div>
        ) : (
          <ul className="divide-y divide-stone-100">
            {dayTasks.map(task => (
              <li key={task.id} className="flex items-start gap-3 py-2 group">
                <button onClick={() => toggleTask(task.id)}
                  className={`w-5 h-5 mt-0.5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition ${task.done ? "bg-[#7a9a6e] border-[#7a9a6e] text-white" : "border-[#9cb88f] hover:bg-[#f4f7ee]"}`}
                  aria-label={task.done ? t("Mark not done", lang) : t("Mark done", lang)}>
                  {task.done && <Check className="w-2.5 h-2.5" />}
                </button>
                {editingId === task.id ? (
                  <textarea {...grow("todo-edit-" + task.id)} autoFocus value={editingText}
                    onChange={e => setEditingText(e.target.value)}
                    onBlur={() => { setFocusedField(prev => prev === "todo-edit-" + task.id ? null : prev); saveEdit(); }}
                    onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(); } if (e.key === "Escape") setEditingId(null); }} />
                ) : (
                  <button onClick={() => startEdit(task)}
                    className={`flex-1 text-left text-xs ${task.done ? "line-through text-stone-400" : "text-ink"}`} title={t("Click to edit", lang)}>
                    {task.title}
                  </button>

                const isMeal = ["8:00 AM", "12:00 PM", "6:00 PM"].includes(hour);

                  <div

                      const cellKey = iso + "|" + hour;
                      const cellValue = ((planners[iso] || {}).blocks || {})[hour] || "";
                      const isFocused = focusedCell === cellKey;
                      return (
                        <textarea
                          key={cellKey}
                          value={cellValue}

// YEAR CALENDAR MODULE — full 12-month view with day events

const MONTH_NAMES = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"
];
const WEEKDAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"];

function buildMonthGrid(year, month) {
  // month: 0–11 · returns array of 42 cells (6 weeks × 7 days), each {iso, day, inMonth}
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay(); // 0 Sun … 6 Sat
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    let d, m, y, inMonth;
    if (i < startWeekday) {
      d = daysInPrev - startWeekday + 1 + i;
      m = month - 1; y = year;
      if (m < 0) { m = 11; y = year - 1; }
      inMonth = false;
    } else if (i < startWeekday + daysInMonth) {
      d = i - startWeekday + 1;
      m = month; y = year;
      inMonth = true;
    } else {
      d = i - startWeekday - daysInMonth + 1;
      m = month + 1; y = year;
      if (m > 11) { m = 0; y = year + 1; }
      inMonth = false;
    }
    const iso = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    cells.push({ iso, day: d, inMonth });
  }
  return cells;
}

function YearCalendarModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const today = todayISO();
  const [year, setYear] = useState(new Date().getFullYear());
  const [selectedDate, setSelectedDate] = useState(null); // ISO date or null
  const [showCalendarConnect, setShowCalendarConnect] = useState(false);
  const [draftTitle, setDraftTitle] = useState("");
  const [draftTime, setDraftTime] = useState("");
  const [draftNotes, setDraftNotes] = useState("");
  // Title rename + show/hide year view
  const calendarLabel = data.calendarLabel || "Calendar";
  const setCalendarLabel = (v) => setData({ ...data, calendarLabel: v });
  const [editingTitle, setEditingTitle] = useState(false);
  const showYearView = data.showYearView !== false; // default true
  const toggleYearView = () => setData({ ...data, showYearView: !showYearView });


  const events = data.calendarEvents || {};
  const connectedCalendar = data.connectedCalendar || null;

  const dayEvents = selectedDate ? (events[selectedDate] || []) : [];

  const addEvent = () => {
    if (!selectedDate) return;
    const title = (draftTitle || "").trim();
    if (!title) return;
    const list = events[selectedDate] || [];
    const id = (list.length ? Math.max(...list.map(e => e.id || 0)) : 0) + 1;
    const next = [...list, { id, title, time: draftTime || "", notes: draftNotes || "" }];
    setData({ ...data, calendarEvents: { ...events, [selectedDate]: next } });
    setDraftTitle(""); setDraftTime(""); setDraftNotes("");
  };

  const updateEvent = (id, patch) => {
    if (!selectedDate) return;
    const list = events[selectedDate] || [];
    const next = list.map(e => e.id === id ? { ...e, ...patch } : e);
    setData({ ...data, calendarEvents: { ...events, [selectedDate]: next } });
  };

  const deleteEvent = (id) => {
    if (!selectedDate) return;
    const list = events[selectedDate] || [];
    const next = list.filter(e => e.id !== id);
    const nextEvents = { ...events };
    if (next.length === 0) delete nextEvents[selectedDate];
    else nextEvents[selectedDate] = next;
    setData({ ...data, calendarEvents: nextEvents });
  };

  // Count events per ISO date for dot indicators
  const eventCountFor = (iso) => (events[iso] || []).length;

  const selectedLabel = selectedDate ? fmtDate(selectedDate) : "";

  return (
    <div>
      {/* HEADER — renameable title + show/hide year toggle */}
      <div className="flex items-start justify-between mb-6 gap-4 flex-wrap">
        <div className="min-w-0 flex-1">
          {editingTitle ? (
            <input
              autoFocus
              value={calendarLabel}
              onChange={e => setCalendarLabel(e.target.value)}
              onBlur={() => setEditingTitle(false)}
              onKeyDown={e => { if (e.key === "Enter" || e.key === "Escape") setEditingTitle(false); }}
              className="font-serif text-3xl tracking-tight bg-[#f4f7ee] border border-[#7a9a6e] rounded px-2 py-1 outline-none"
              style={{ fontFamily: "'Playfair Display', Georgia, serif" }}
            />
          ) : (
            <button
              onClick={() => setEditingTitle(true)}
              className="group inline-flex items-center gap-2 text-left"
              title={t("Rename this page", lang)}
            >
              <h1 className="font-serif text-3xl tracking-tight" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{calendarLabel}</h1>
              <Edit2 className="w-4 h-4 text-stone-300 group-hover:text-[#5b7351] transition" />
            </button>
          )}
          <p className={`text-sm mt-1 ${themeMuted}`}>{t("Plan your week and your year. Click any day to add what you need to do.", lang)}</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <button onClick={() => setShowCalendarConnect(true)} className="px-3 py-2 rounded border border-[#a8c090] text-[#5b7351] text-sm font-medium hover:bg-[#f4f7ee] flex items-center gap-2">
            <Mail className="w-4 h-4" /> {connectedCalendar ? `✓ ${connectedCalendar}` : t("Connect calendar", lang)}
          </button>
        </div>
      </div>

      {/* YEAR VIEW HEADER — always visible, click to expand/hide */}
      <div className="flex items-center justify-between mb-4 gap-2 flex-wrap">
        <button onClick={toggleYearView} className="flex items-center gap-2 group" title={showYearView ? t("Hide year view", lang) : t("Expand year view", lang)}>
          <ChevronRight className={`w-4 h-4 text-stone-400 flex-shrink-0 transition ${showYearView ? "rotate-90" : ""}`} />
          <h2 className="text-sm font-semibold tracking-[0.2em] text-stone-700 group-hover:text-[#5b7351]">{t("YEAR VIEW", lang)}</h2>
        </button>
        {showYearView && (
          <div className="flex items-center gap-2 flex-wrap">
            <button onClick={() => setYear(year - 1)} className="p-2 rounded border border-stone-200 hover:border-[#7a9a6e] hover:bg-[#f4f7ee]"><ArrowRight className="w-4 h-4 rotate-180" /></button>

      {/* 12-MONTH GRID — only when showYearView is true */}

        {MONTH_NAMES.map((name, mIdx) => {

              <div className="grid grid-cols-7 gap-0.5">
                {cells.map((c, i) => {

                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>}

      {/* EVENT EDITOR — slide-up panel */}
      {selectedDate && (
        <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/40 p-0 sm:p-6" onClick={() => setSelectedDate(null)}>

              {dayEvents.length === 0 ? (

              {/* Add new event */}

// TASKS / CALENDAR MODULE — with confetti
// ============================================================
function TasksModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const [open, setOpen] = useState(false);
  const [view, setView] = useState("today");
  const [form, setForm] = useState({ title: "", priority: "normal", date: todayISO(), recurring: false, category: "client" });

  const today = todayISO();
  const weekStart = (() => { const d = new Date(); d.setDate(d.getDate() - 7); return toLocalISO(d); })();

  const filtered = data.tasks.filter(t => {
    if (view === "today") return t.date === today;
    if (view === "week") return t.date >= weekStart;
    return true;
  });

  const sorted = [...filtered].sort((a, b) => {
    const order = { critical: 0, high: 1, normal: 2 };
    return (a.done - b.done) || (order[a.priority] - order[b.priority]);
  });

  const toggle = (id) => {
    const task = data.tasks.find(t => t.id === id);
    const wasUndone = task && !task.done;
    const updatedTasks = data.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    setData({ ...data, tasks: updatedTasks });
    if (wasUndone) {
      // Only celebrate when the last incomplete task for TODAY gets checked off
      const todaysTasks = updatedTasks.filter(t => t.date === today);
      const allDone = todaysTasks.length > 0 && todaysTasks.every(t => t.done);
      if (allDone) {
        triggerConfetti("ALL TODAY'S TASKS DONE — Champion energy", true);
      }
    }
  };

  const add = () => {
    if (!form.title) return;
    const id = Math.max(0, ...data.tasks.map(t => t.id)) + 1;
    setData({ ...data, tasks: [...data.tasks, { ...form, id, done: false }] });
    setOpen(false);
    setForm({ title: "", priority: "normal", date: todayISO(), recurring: false, category: "client" });
    triggerConfetti("✓ Task added!");
  };
  const del = (id) => setData({ ...data, tasks: data.tasks.filter(t => t.id !== id) });

  const priorityStyles = {
    critical: "border-l-rose-500 bg-rose-500/5",
    high: "border-l-[#9cb88f] bg-[#9cb88f]/5",
    normal: dark ? "border-l-stone-700" : "border-l-stone-300",
  };

  // Calendar grid
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const startDay = monthStart.getDay();
  const cells = [...Array(startDay).fill(null), ...Array(monthDays).fill(0).map((_, i) => i + 1)];
  const monthName = now.toLocaleString("en-US", { month: "long", year: "numeric" });

  return (
    <div>
      <PageHeader title="Tasks & Calendar" subtitle="Daily execution. One checkbox at a time." dark={dark}
        action={<AddButton onClick={() => setOpen(true)} label="Add Task" dark={dark} />} />

      <div className="flex gap-1 mb-4">
        {["today", "week", "all"].map(v => (
          <button key={v} onClick={() => setView(v)} className={`px-3 py-1.5 text-xs rounded capitalize ${view === v ? "bg-[#9cb88f] text-stone-950 font-medium" : `${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"} border ${themeMuted}`}`}>{v}</button>
        ))}
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 space-y-2">
          {sorted.map(t => (
            <div key={t.id} className={`flex items-center gap-3 p-3 rounded border-l-4 border ${priorityStyles[t.priority]} ${dark ? "bg-white border-stone-200" : "bg-white border-stone-200"} ${t.done ? "opacity-50" : ""}`}>
              <button onClick={() => toggle(t.id)} className={`w-6 h-6 rounded-full flex items-center justify-center transition ${t.done ? "bg-[#9cb88f] scale-110" : `border-2 ${dark ? "border-stone-600" : "border-stone-400"} hover:border-[#9cb88f] hover:scale-110`}`}>
                {t.done && <Check className="w-3.5 h-3.5 text-white" />}
              </button>
              <div className="flex-1">
                <div className={`text-sm ${t.done ? "line-through" : "font-medium"}`}>{t.title}</div>
                <div className="flex items-center gap-2 text-xs mt-0.5">
                  <span className={`capitalize ${t.priority === "critical" ? "text-rose-400" : t.priority === "high" ? "text-[#9cb88f]" : themeMuted}`}>{t.priority}</span>
                  <span className={themeMuted}>· {t.category}</span>
                  <span className={`${themeMuted} font-mono`}>· {fmtDate(t.date)}</span>
                  {t.recurring && <span className="text-[#9cb88f] flex items-center gap-0.5"><RefreshCw className="w-2.5 h-2.5" /> recurring</span>}
                </div>
              </div>
              <button onClick={() => del(t.id)} className="text-stone-500 hover:text-rose-400 p-1"><Trash2 className="w-3.5 h-3.5" /></button>
            </div>
          ))}
          {sorted.length === 0 && <div className={`p-8 text-center ${themeMuted} text-sm`}>No tasks. Add one above.</div>}
        </div>

        <div>
          <Panel title={monthName} dark={dark}>
            <div className="grid grid-cols-7 gap-1 text-center text-[10px] mb-2">
              {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div key={i} className={themeMuted}>{d}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                if (!d) return <div key={i} />;
                const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
                const has = data.tasks.some(t => t.date === dateStr);
                const isToday = d === now.getDate();
                return (
                  <div key={i} className={`aspect-square flex flex-col items-center justify-center text-xs rounded ${isToday ? "bg-[#9cb88f] text-stone-950 font-bold" : has ? (dark ? "bg-stone-100 text-[#9cb88f]" : "bg-[#f4f7ee] text-[#4a5d3f]") : themeMuted}`}>
                    {d}
                    {has && !isToday && <span className="w-1 h-1 rounded-full bg-[#9cb88f] mt-0.5" />}
                  </div>
                );
              })}
            </div>
          </Panel>
        </div>
      </div>

      <Modal open={open} onClose={() => setOpen(false)} title="Add Task" dark={dark}>
        <div className="space-y-3">
          <TextField label={t("Title", lang)} value={form.title} onChange={v => setForm({ ...form, title: v })} dark={dark} />
          <div className="grid grid-cols-3 gap-3">
            <SelectField label="Priority" value={form.priority} onChange={v => setForm({ ...form, priority: v })} options={["critical", "high", "normal"]} dark={dark} />
            <SelectField label="Category" value={form.category} onChange={v => setForm({ ...form, category: v })} options={["client", "sale", "recruit", "social", "personal"]} dark={dark} />
            <TextField label="Due date" value={form.date} onChange={v => setForm({ ...form, date: v })} type="date" dark={dark} />
          </div>
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={form.recurring} onChange={e => setForm({ ...form, recurring: e.target.checked })} className="accent-[#9cb88f]" />
            Recurring task
          </label>
          <button onClick={add} className="w-full py-2 bg-[#9cb88f] text-stone-950 font-medium rounded hover:bg-[#a8c090]">Add task</button>
        </div>
      </Modal>
    </div>
  );
}

// SOCIAL MODULE
// ============================================================
const SOCIAL_PLATFORMS = [
  { id: "instagram", name: "Instagram", icon: Instagram, color: "#E1306C" },
  { id: "facebook", name: "Facebook", icon: Facebook, color: "#1877F2" },
  { id: "tiktok", name: "TikTok", icon: Music2, color: "#000000" },
  { id: "linkedin", name: "LinkedIn", icon: Linkedin, color: "#0A66C2" },
];

function SocialModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const [open, setOpen] = useState(false);
  const blankForm = { platform: "Instagram", date: todayISO(), type: "Reel", engagement: "", leads: "", title: "" };
  const [form, setForm] = useState(blankForm);
  const [editingPostId, setEditingPostId] = useState(null);

  // Platform stats editing
  const [statsEditId, setStatsEditId] = useState(null);
  const blankStatsForm = { followers: "", reach: "", engagement: "", newWeek: "", posts: "" };
  const [statsForm, setStatsForm] = useState(blankStatsForm);

  const posts = data.socialPosts || [];
  const social = data.social || {};

  const totalReach = Object.values(social).reduce((s, p) => s + (p.reach || 0), 0);
  const totalFollowers = Object.values(social).reduce((s, p) => s + (p.followers || 0), 0);
  const totalLeads = posts.reduce((s, p) => s + (p.leads || 0), 0);
  const bestPost = [...posts].sort((a, b) => (b.engagement || 0) - (a.engagement || 0))[0];

  const followerGrowth = (() => {
    const out = []; const base = totalFollowers - 800;
    for (let i = 0; i < 8; i++) {
      out.push({ week: `W${i + 1}`, followers: base + i * 100 + Math.round(Math.random() * 60) });
    }
    return out;
  })();

  const engagementByPlatform = SOCIAL_PLATFORMS.map(p => ({ name: p.name, engagement: data.social[p.id]?.engagement || 0 }));
  const leadsBySource = ["referral", "social", "cold", "lead-vendor"].map(s => ({ name: s, value: data.clients.filter(c => c.source === s).length }));
  const COLORS = ["#7a9a6e", "#5b7351", "#78716c", "#a8c090"];

  const savePost = () => {
    const title = (form.title || "").trim();
    if (!title) return;
    const engagement = parseInt(form.engagement, 10) || 0;
    const leads = parseInt(form.leads, 10) || 0;
    if (editingPostId != null) {
      setData({ ...data, socialPosts: posts.map(p => p.id === editingPostId ? { ...p, ...form, title, engagement, leads } : p) });
    } else {
      const id = (posts.length ? Math.max(0, ...posts.map(p => Number(p.id) || 0)) : 0) + 1;
      setData({ ...data, socialPosts: [...posts, { ...form, id, title, engagement, leads }] });
    }
    setOpen(false); setEditingPostId(null); setForm(blankForm);
  };
  const openPostAdd = () => { setEditingPostId(null); setForm(blankForm); setOpen(true); };
  const openPostEdit = (p) => {
    setEditingPostId(p.id);
    setForm({ platform: p.platform || "Instagram", date: p.date || todayISO(), type: p.type || "Reel", engagement: String(p.engagement ?? ""), leads: String(p.leads ?? ""), title: p.title || "" });
    setOpen(true);
  };
  const removePost = (id) => {
    if (!confirm("Delete this post?")) return;
    setData({ ...data, socialPosts: posts.filter(p => p.id !== id) });
  };

  // Inline quick-add (compact form rendered above the table)
  const quickAddPost = () => {
    const title = (form.title || "").trim();
    if (!title) return;
    savePost();
  };

  // Clear handlers
  const clearPlatform = (platformId, name) => {
    if (!confirm(`Reset ${name} stats to zero?`)) return;
    setData({ ...data, social: { ...social, [platformId]: { followers: 0, reach: 0, engagement: 0, newWeek: 0, posts: 0 } } });
  };
  const clearAllReach = () => {
    if (!confirm("Reset reach to zero on all platforms?")) return;
    const next = { ...social };
    SOCIAL_PLATFORMS.forEach(p => { next[p.id] = { ...(next[p.id] || {}), reach: 0 }; });
    setData({ ...data, social: next });
  };
  const clearAllFollowers = () => {
    if (!confirm("Reset followers and weekly growth to zero on all platforms?")) return;
    const next = { ...social };
    SOCIAL_PLATFORMS.forEach(p => { next[p.id] = { ...(next[p.id] || {}), followers: 0, newWeek: 0 }; });
    setData({ ...data, social: next });
  };
  const clearAllLeads = () => {
    if (!confirm("Reset lead counts on every logged post to zero?")) return;
    setData({ ...data, socialPosts: posts.map(p => ({ ...p, leads: 0 })) });
  };

  // Platform stats editing
  const openStatsEdit = (platformId) => {
    const s = social[platformId] || { followers: 0, reach: 0, engagement: 0, newWeek: 0, posts: 0 };
    setStatsEditId(platformId);
    setStatsForm({
      followers: String(s.followers ?? ""),
      reach: String(s.reach ?? ""),
      engagement: String(s.engagement ?? ""),
      newWeek: String(s.newWeek ?? ""),
      posts: String(s.posts ?? ""),
    });
  };
  const saveStats = () => {
    if (!statsEditId) return;
    const next = {
      followers: parseInt(statsForm.followers, 10) || 0,
      reach: parseInt(statsForm.reach, 10) || 0,
      engagement: parseFloat(statsForm.engagement) || 0,
      newWeek: parseInt(statsForm.newWeek, 10) || 0,
      posts: parseInt(statsForm.posts, 10) || 0,
    };
    setData({ ...data, social: { ...social, [statsEditId]: next } });
    setStatsEditId(null);
    setStatsForm(blankStatsForm);
  };

  return (
    <div>
      <PageHeader title="Social Media Hub" subtitle="Reach. Engagement. Leads. ROI." dark={dark}
        action={<AddButton onClick={openPostAdd} label="Log Post" dark={dark} />} />

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        {SOCIAL_PLATFORMS.map(p => {
          const stats = social[p.id] || { followers: 0, reach: 0, engagement: 0, newWeek: 0, posts: 0 };
          const Icon = p.icon;
          return (
            <div key={p.id} className={`rounded-lg border ${themePanel} p-4 group relative`}>
              <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                <button onClick={() => openStatsEdit(p.id)} className="p-1 rounded text-stone-400 hover:text-[#5b7351] hover:bg-[#f4f7ee]" title={`Edit ${p.name} stats`}>
                  <Edit2 className="w-3.5 h-3.5" />
                </button>
                <button onClick={() => clearPlatform(p.id, p.name)} className="p-1 rounded text-stone-400 hover:text-rose-500 hover:bg-rose-50" title={`Reset ${p.name} to zero`}>
                  <RefreshCw className="w-3.5 h-3.5" />
                </button>
              </div>
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <Icon className="w-4 h-4" style={{ color: p.color }} />
                  <span className="text-sm font-medium">{p.name}</span>
                </div>
                <span className="text-[10px] text-[#9cb88f] font-mono">+{stats.newWeek}</span>
              </div>
              <div className="font-serif text-2xl text-[#9cb88f] mb-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{(stats.followers || 0).toLocaleString()}</div>
              <div className={`text-[10px] ${themeMuted} grid grid-cols-3 gap-1 mt-2`}>
                <div><div className="text-stone-500">REACH</div><div className="text-stone-700 font-mono">{((stats.reach || 0) / 1000).toFixed(1)}K</div></div>
                <div><div className="text-stone-500">ENG.</div><div className="text-stone-700 font-mono">{stats.engagement || 0}%</div></div>
                <div><div className="text-stone-500">POSTS</div><div className="text-stone-700 font-mono">{stats.posts || 0}</div></div>
              </div>
            </div>
          );
        })}

              <tbody>

                  return d !== 0 ? d : (Number(b.id) || 0) - (Number(a.id) || 0);
                }).map(p => (

// ============================================================
// TEAM MODULE
// ============================================================
function TeamModule({ data, setData, user, dark, themePanel, themeMuted, triggerConfetti }) {
  const [open, setOpen] = useState(false);
  const blankMemberForm = { name: "", level: "", mtd: 0, ytd: 0, clients: 0, recruits: 0, overridePct: "" };
  const [form, setForm] = useState(blankMemberForm);
  const [editingMemberId, setEditingMemberId] = useState(null);

  const sortedTeam = [...data.team].sort((a, b) => b.mtd - a.mtd);
  const teamTotal = data.team.reduce((s, t) => s + (t.mtd || 0), 0);
  const teamYtd = data.team.reduce((s, t) => s + (t.ytd || 0), 0);
  const teamClients = data.team.reduce((s, t) => s + (t.clients || 0), 0);
  const overrides = data.team.reduce((s, t) => s + (t.mtd || 0) * ((parseFloat(t.overridePct) || 0) / 100), 0);
  const ytdOverrides = data.team.reduce((s, t) => s + (t.ytd || 0) * ((parseFloat(t.overridePct) || 0) / 100), 0);
  const avgPct = data.team.length ? data.team.reduce((s, t) => s + (parseFloat(t.overridePct) || 0), 0) / data.team.length : 0;

  const stackedData = data.team.map(t => ({ name: t.name.split(" ")[0], MTD: t.mtd, YTD: t.ytd / 12 }));

  const openMemberAdd = () => { setEditingMemberId(null); setForm(blankMemberForm); setOpen(true); };
  const openMemberEdit = (m) => {
    setEditingMemberId(m.id);
    setForm({
      name: m.name || "",
      level: m.level || "",
      mtd: m.mtd ?? 0,
      ytd: m.ytd ?? 0,
      clients: m.clients ?? 0,
      recruits: m.recruits ?? 0,
      overridePct: m.overridePct != null ? String(m.overridePct) : "",
    });
    setOpen(true);
  };
  const saveMember = () => {
    if (!form.name) return;
    const list = data.team || [];
    const cleaned = {
      ...form,
      mtd: parseFloat(form.mtd) || 0,
      ytd: parseFloat(form.ytd) || 0,
      clients: parseInt(form.clients, 10) || 0,
      recruits: parseInt(form.recruits, 10) || 0,
      overridePct: form.overridePct === "" || form.overridePct == null ? 0 : (parseFloat(form.overridePct) || 0),
    };
    if (editingMemberId != null) {
      setData({ ...data, team: list.map(t => t.id === editingMemberId ? { ...t, ...cleaned } : t) });
    } else {
      const id = (list.length ? Math.max(0, ...list.map(t => Number(t.id) || 0)) : 0) + 1;
      setData({ ...data, team: [...list, { ...cleaned, id }] });
    }
    setOpen(false);
    setEditingMemberId(null);
    setForm(blankMemberForm);
  };
  const remove = (id) => {
    if (!confirm("Remove this team member?")) return;
    setData({ ...data, team: data.team.filter(t => t.id !== id) });
  };

  const isOwner = user.role === "Agency Owner" || user.role === "Team Lead";

  if (!isOwner && data.team.length === 0) {
    return (
      <div>
        <PageHeader title="Team Dashboard" dark={dark} />
        <div className={`p-12 text-center rounded-lg border ${themePanel}`}>
          <Trophy className={`w-12 h-12 mx-auto mb-4 ${themeMuted}`} />
          <h3 className="font-serif text-xl mb-2" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>Team Dashboard locked</h3>
          <p className={`text-sm ${themeMuted}`}>Available on Agency plan or for users with Team Lead / Agency Owner role.</p>
        </div>
      </div>
    );
  }

  return (
    <div>
      <PageHeader title="Team Dashboard" subtitle="Production. Recruits. Leaderboard." dark={dark}
        action={<AddButton onClick={openMemberAdd} label="Add Member" dark={dark} />} />

      {/* HERO TEAM TOTAL */}
      <div className={`rounded-lg border ${themePanel} p-6 mb-5 bg-gradient-to-br ${dark ? "from-[#9cb88f]/5 to-stone-900" : "from-[#9cb88f]/10 to-white"}`}>
        <div className="flex items-end justify-between flex-wrap gap-4">
          <div>
            <div className="text-xs tracking-[0.3em] text-[#9cb88f] mb-2">TEAM TOTAL INCOME · MTD</div>
            <div className="font-serif text-6xl text-[#9cb88f] leading-none" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${teamTotal.toLocaleString()}</div>
            <div className={`text-sm mt-2 ${themeMuted}`}>Override on team production: <span className="text-[#9cb88f] font-mono">${overrides.toFixed(0)}</span></div>
          </div>
          <div className="grid grid-cols-3 gap-4 text-right">
            <div><div className="text-[10px] text-stone-500 tracking-wider">YTD</div><div className="font-mono text-[#9cb88f]">${teamYtd.toLocaleString()}</div></div>
            <div><div className="text-[10px] text-stone-500 tracking-wider">CLIENTS</div><div className="font-mono text-[#9cb88f]">{teamClients}</div></div>
            <div><div className="text-[10px] text-stone-500 tracking-wider">MEMBERS</div><div className="font-mono">{data.team.length}</div></div>
          </div>
        </div>
      </div>

      {/* TEAM GRID */}
      <div className="grid lg:grid-cols-2 gap-5 mb-5">
        <Panel title="Team Leaderboard" dark={dark}>
          <div className="space-y-2">
            {sortedTeam.map((t, i) => (
              <div key={t.id} className="flex items-center gap-3 p-3 rounded bg-stone-50 group">
                <div className="w-7 text-center">
                  {i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : <span className={`text-xs ${themeMuted}`}>#{i + 1}</span>}
                </div>
                <div className={`w-9 h-9 rounded-full bg-gradient-to-br from-[#9cb88f] to-[#5b7351] flex items-center justify-center text-xs font-bold text-stone-950`}>
                  {t.name.split(" ").map(s => s[0]).join("")}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-medium text-sm truncate">{t.name}</div>
                  <div className={`text-xs ${themeMuted}`}>{[t.level, `${t.clients || 0} clients`].filter(Boolean).join(" · ")}</div>
                </div>
                <div className="text-right whitespace-nowrap">
                  <div className="font-mono text-[#9cb88f]">${(t.mtd || 0).toLocaleString()}</div>
                  <div className={`text-[10px] ${themeMuted}`}>YTD ${(t.ytd || 0).toLocaleString()}</div>
                </div>
                <button onClick={() => openMemberEdit(t)} className={`flex items-center gap-1 px-2 py-1 rounded text-[10px] font-mono whitespace-nowrap transition ${(parseFloat(t.overridePct) || 0) > 0 ? "bg-[#f4f7ee] text-[#5b7351] border border-[#d3e0c5] hover:border-[#7a9a6e]" : "border border-dashed border-stone-300 text-stone-400 hover:border-[#7a9a6e] hover:text-[#5b7351]"}`} title="Set your override % on this agent">
                  <Percent className="w-3 h-3" /> {parseFloat(t.overridePct) || 0}%
                </button>
                <div className="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition">
                  <button onClick={() => openMemberEdit(t)} className="p-1 text-stone-500 hover:text-[#5b7351]" title="Edit"><Edit2 className="w-3.5 h-3.5" /></button>
                  <button onClick={() => remove(t.id)} className="p-1 text-stone-500 hover:text-rose-500" title={t("Remove", lang)}><Trash2 className="w-3.5 h-3.5" /></button>
                </div>
              </div>
            ))}
          </div>
        </Panel>

        <div className="space-y-5">
          <Panel title="MTD Production by Member" dark={dark}>
            <ResponsiveContainer width="100%" height={180}>
              <BarChart data={stackedData} layout="vertical">
                <CartesianGrid stroke={dark ? "#292524" : "#e7e5e4"} strokeDasharray="3 3" />
                <XAxis type="number" stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} />
                <YAxis type="category" dataKey="name" stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} width={70} />
                <Tooltip contentStyle={{ background: dark ? "#1c1917" : "#fff", border: "1px solid #57534e", fontSize: 12 }} />
                <Bar dataKey="MTD" stackId="a" fill="#7a9a6e" />
              </BarChart>
            </ResponsiveContainer>
          </Panel>

        </div>
      </div>

      <Panel title="Override Calculator" dark={dark}>
        <div className="grid md:grid-cols-4 gap-4 mb-4">
          <div>
            <div className={`text-[10px] tracking-wider ${themeMuted}`}>TEAM MTD</div>
            <div className="font-serif text-2xl" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${teamTotal.toLocaleString()}</div>
          </div>
          <div>
            <div className={`text-[10px] tracking-wider ${themeMuted}`}>AVG OVERRIDE %</div>
            <div className="font-serif text-2xl" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{avgPct.toFixed(1)}%</div>
          </div>
          <div>
            <div className={`text-[10px] tracking-wider ${themeMuted}`}>YOUR OVERRIDE · MTD</div>
            <div className="font-serif text-2xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${overrides.toFixed(0)}</div>
          </div>
          <div>
            <div className={`text-[10px] tracking-wider ${themeMuted}`}>YOUR OVERRIDE · YTD</div>
            <div className="font-serif text-2xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${ytdOverrides.toFixed(0)}</div>
          </div>
        </div>
        {data.team.length > 0 && (
          <div>
            <div className={`text-[10px] tracking-wider ${themeMuted} mb-2`}>BREAKDOWN BY AGENT</div>
            <div className="space-y-1">
              {sortedTeam.map(t => {
                const pct = parseFloat(t.overridePct) || 0;
                const cut = (t.mtd || 0) * (pct / 100);
                return (
                  <div key={t.id} className="grid grid-cols-[1fr_auto_auto_auto] items-center gap-3 px-3 py-2 rounded border border-stone-100">
                    <div className="text-sm font-medium truncate">{t.name}</div>
                    <div className="text-xs font-mono text-stone-500">${(t.mtd || 0).toLocaleString()} MTD</div>
                    <div className="text-xs font-mono text-[#5b7351]">× {pct}%</div>
                    <div className="text-sm font-mono text-[#7a9a6e] font-semibold w-20 text-right">${cut.toFixed(0)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </Panel>

      <Modal open={open} onClose={() => { setOpen(false); setEditingMemberId(null); }} title={editingMemberId ? "Edit Team Member" : "Add Team Member"} dark={dark}>
        <div className="grid grid-cols-2 gap-3">
          <TextField label="Name" value={form.name} onChange={v => setForm({ ...form, name: v })} dark={dark} />
          <TextField label="Title" value={form.level} onChange={v => setForm({ ...form, level: v })} dark={dark} placeholder="Type any title — Producer, Trainee, Team Lead…" />
          <TextField label="MTD ($)" value={form.mtd} onChange={v => setForm({ ...form, mtd: v })} type="number" dark={dark} />
          <TextField label="YTD ($)" value={form.ytd} onChange={v => setForm({ ...form, ytd: v })} type="number" dark={dark} />
          <TextField label="Clients" value={form.clients} onChange={v => setForm({ ...form, clients: v })} type="number" dark={dark} />
          <TextField label="Recruits" value={form.recruits} onChange={v => setForm({ ...form, recruits: v })} type="number" dark={dark} />
        </div>
        <div className="mt-3 p-3 rounded border border-[#d3e0c5] bg-[#f4f7ee]">
          <label className="text-[10px] tracking-wider text-[#5b7351] flex items-center gap-1.5 mb-1"><Percent className="w-3.5 h-3.5" /> YOUR OVERRIDE % ON THIS AGENT</label>
          <p className="text-[10px] text-stone-500 italic mb-2">Different per agent. The Override Calculator uses this to compute what you make off their production.</p>
          <input
            type="number"
            value={form.overridePct}
            onChange={e => setForm({ ...form, overridePct: e.target.value })}
            placeholder="e.g., 5"
            step="0.1"
            className="w-full px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
          />
        </div>
        <button onClick={saveMember} className="w-full mt-4 py-2 bg-[#9cb88f] text-stone-950 font-medium rounded hover:bg-[#a8c090]">{editingMemberId ? "Save changes" : "Add member"}</button>
      </Modal>
    </div>
  );
}
