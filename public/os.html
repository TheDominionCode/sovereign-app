                  />
                </div>
                <button onClick={() => removeInvestment(x.id)} className="p-2 text-stone-400 hover:text-rose-500 hover:bg-rose-50 rounded self-start sm:self-center justify-self-end" title="Delete"><Trash2 className="w-4 h-4" /></button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* CREDIT SCORE — three bureaus, side by side */}
      <div className="mt-10 pt-8 border-t border-stone-200">
        <div className="flex items-baseline justify-between mb-1 gap-3 flex-wrap">
          <h2 className="font-serif text-2xl tracking-tight" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>Credit Score</h2>
          {averageScore != null && (
            <span className="text-xs italic text-stone-500" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>
              average across bureaus: <span className="font-mono text-[#5b7351] font-semibold">{averageScore}</span>
            </span>
          )}
        </div>
        <p className={`text-sm ${themeMuted} mb-4`}>Track your score from each of the three major bureaus. They often differ.</p>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5">
          {BUREAUS.map(bureau => {
            const b = credit[bureau.id] || { current: null, history: [] };
            const band = creditBand(b.current);
            const change = bureauChange(b);
            const minScore = 300, maxScore = 850;
            const pct = b.current ? ((b.current - minScore) / (maxScore - minScore)) * 100 : 0;
            return (
              <div key={bureau.id} className={`rounded-lg border ${themePanel} p-4`} style={{ borderTopWidth: 3, borderTopColor: bureau.accent }}>
                <div className="flex items-baseline justify-between mb-2">
                  <h3 className="font-serif text-base" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{bureau.name}</h3>
                  {b.lastUpdated && <span className="text-[10px] italic text-stone-400" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{fmtDate(b.lastUpdated)}</span>}
                </div>
                <div className="flex items-baseline gap-2">
                  <div className="font-serif text-4xl" style={{ fontFamily: "'Playfair Display', Georgia, serif", color: band.color }}>{b.current || "—"}</div>
                  <span className={`text-[10px] tracking-wider px-2 py-0.5 rounded ${band.bg} ${band.text}`}>{band.label}</span>
                  {change != null && change !== 0 && (
                    <span className={`text-xs font-mono ${change > 0 ? "text-emerald-600" : "text-rose-500"}`}>
                      {change > 0 ? "↑" : "↓"} {Math.abs(change)}
                    </span>
                  )}
                </div>
                {/* Score band visualization */}
                <div className="mt-3 relative">
                  <div className="h-1.5 rounded-full overflow-hidden flex">
                    <div className="bg-rose-300 flex-1"></div>
                    <div className="bg-orange-300 flex-1"></div>
                    <div className="bg-amber-300 flex-1"></div>
                    <div className="bg-teal-300 flex-1"></div>
                    <div className="bg-emerald-400 flex-1"></div>
                  </div>
                  {b.current && (
                    <div className="absolute top-0 -mt-0.5 w-2.5 h-3 rounded-sm bg-white border-2 border-stone-800 -translate-x-1/2 transition-all" style={{ left: `${pct}%` }}></div>
                  )}
                </div>
                {/* Inline update form */}
                <div className="flex gap-2 mt-3">
                  <input
                    type="number"
                    min="300"
                    max="850"
                    value={creditDrafts[bureau.id]}
                    onChange={e => setCreditDrafts({ ...creditDrafts, [bureau.id]: e.target.value })}
                    onKeyDown={e => { if (e.key === "Enter") saveCreditScore(bureau.id); }}
                    placeholder="New score"
                    className="flex-1 px-3 py-1.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white text-center font-mono"
                  />
                  <button
                    onClick={() => saveCreditScore(bureau.id)}
                    disabled={!creditDrafts[bureau.id]}
                    className="px-3 py-1.5 rounded text-white text-xs font-medium disabled:opacity-40 disabled:cursor-not-allowed"
                    style={{ background: bureau.accent }}
                  >Log</button>
                </div>
                {/* Mini history */}
                {(b.history || []).length > 0 && (
                  <div className="mt-3 pt-3 border-t border-stone-100">
                    <div className="text-[10px] tracking-[0.2em] text-stone-400 mb-1.5">HISTORY</div>
                    <div className="space-y-1">
                      {[...(b.history || [])].reverse().slice(0, 4).map(h => {
                        const hb = creditBand(h.score);
                        return (
                          <div key={h.date} className="flex items-center gap-2 group text-xs">
                            <span className="text-stone-500 font-mono w-20 flex-shrink-0">{fmtDate(h.date)}</span>
                            <span className="font-serif" style={{ fontFamily: "'Playfair Display', Georgia, serif", color: hb.color }}>{h.score}</span>
                            <div className="flex-1"></div>
                            <button onClick={() => removeCreditEntry(bureau.id, h.date)} className="p-1 text-stone-300 hover:text-rose-500 opacity-0 group-hover:opacity-100" title="Delete"><Trash2 className="w-3 h-3" /></button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div className="flex justify-between text-[9px] text-stone-400 font-mono px-1">
          <span>300 — needs work</span><span>670 — good</span><span>800 — excellent</span><span>850</span>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// PERSONAL SUMMARY (HOME) MODULE — checklist hero
// ============================================================
function PersonalHomeModule({ data, setData, user, dark, themePanel, themeMuted, triggerConfetti, setActive, lang }) {
  const today = todayISO();
  const tasks = data.tasks || [];
  const todaysTasks = tasks.filter(t => t.date === today);
  const todayDone = todaysTasks.filter(t => t.done).length;
  const todayTotal = todaysTasks.length;
  const todayPct = todayTotal > 0 ? (todayDone / todayTotal) * 100 : 0;

  const inspirationImg = data.inspirationImg || "";
  const [pickingImg, setPickingImg] = useState(false);
  const onPickInspiration = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert(t("Pick an image under 10MB please.", lang)); return; }
    setPickingImg(true);
    try {
      const compressed = await compressImage(file, { maxWidth: 1000, quality: 0.85 });
      setData({ ...data, inspirationImg: compressed });
    } catch (err) {
      alert(t("Could not process that image.", lang));
    } finally {
      setPickingImg(false);
      e.target.value = "";
    }
  };
  const removeInspiration = () => setData({ ...data, inspirationImg: "" });

  const toggle = (id) => {
    const task = tasks.find(t => t.id === id);
    const wasUndone = task && !task.done;
    const updated = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    setData({ ...data, tasks: updated });
    if (wasUndone) {
      const todayList = updated.filter(t => t.date === today);
      const allDone = todayList.length > 0 && todayList.every(t => t.done);
      if (allDone) triggerConfetti(t("All done — champion day", lang), true);
    }
  };

  // Summaries from each module
  const pf = data.personalFinance || { income: [], expenses: [], savingsGoals: [] };
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const monthlyIncome = pf.income.reduce((sum, i) => {
    if (i.type === "one-time" || !i.type) return sum + ((i.date || "").startsWith(ym) ? (i.amount || 0) : 0);
    return sum + (i.amount || 0) * (FREQ_TO_MONTHLY[i.frequency] || 1);
  }, 0);
  const monthlyExpenses = pf.expenses.reduce((sum, e) => {
    if (e.type === "one-time" || !e.type) return sum + ((e.date || "").startsWith(ym) ? (e.amount || 0) : 0);
    return sum + (e.amount || 0) * (FREQ_TO_MONTHLY[e.frequency] || 1);
  }, 0);
  const savingsGoals = pf.savingsGoals || [];
  const totalSaved = savingsGoals.reduce((s, g) => s + (g.saved || 0), 0);
  const totalTarget = savingsGoals.reduce((s, g) => s + (g.target || 0), 0);
  const investments = Array.isArray(pf.investments) ? pf.investments : [];
  const totalInvested = investments.reduce((s, x) => s + (x.amount || 0), 0);

  // Card clear handlers
  const clearCard = (msg, mutator) => {
    if (!confirm(msg)) return;
    mutator();
  };
  const clearGoals = () => clearCard(t("Clear all personal goals?", lang), () => setData({ ...data, goals: (data.goals || []).filter(g => ["Business", "Income", "Sales", "Recruiting", "Production"].includes(g.category)) }));
  const clearHabits = () => clearCard(t("Clear all custom habits and today's habit toggles?", lang), () => {
    const planners = { ...(data.planners || {}) };
    if (planners[today]) planners[today] = { ...planners[today], customHabits: {}, morningRoutineDone: false, workoutDone: false, readingDone: false, waterGlasses: 0 };
    setData({ ...data, habitsCustom: [], planners });
  });
  const clearFinance = () => clearCard(t("Clear all personal finance entries (income, expenses, bills)?", lang), () => setData({ ...data, personalFinance: { ...(data.personalFinance || {}), income: [], expenses: [] } }));
  const clearSavings = () => clearCard(t("Clear all savings goals?", lang), () => setData({ ...data, personalFinance: { ...(data.personalFinance || {}), savingsGoals: [] } }));
  const clearInvestments = () => clearCard(t("Clear all investments?", lang), () => setData({ ...data, personalFinance: { ...(data.personalFinance || {}), investments: [] } }));
  const clearVision = () => clearCard(t("Clear the entire Vision Board?", lang), () => setData({ ...data, visionBoard: [] }));

  const goals = (data.goals || []).filter(g => !["Business", "Income", "Sales", "Recruiting", "Production"].includes(g.category));
  const activeGoals = goals.filter(g => g.progress < 100);
  const goalAvg = activeGoals.length ? Math.round(activeGoals.reduce((s, g) => s + g.progress, 0) / activeGoals.length) : 0;

  const visionItems = data.visionBoard || [];
  const visionAchieved = visionItems.filter(v => v.achieved).length;

  const dailyPlan = (data.planners || {})[today] || {};
  const todayPriorities = (dailyPlan.priorities || []).filter(p => (p || "").trim());
  const vitaminsList = Array.isArray(data.vitamins) ? data.vitamins : [];
  const vitaminsTakenToday = vitaminsList.filter(v => (v.taken || []).includes(today)).length;
  const habitsCustom = data.habitsCustom || [];
  const todaysHabits = (dailyPlan.customHabits || {});
  const habitDone = Object.values(todaysHabits).filter(Boolean).length + (dailyPlan.morningRoutineDone ? 1 : 0) + (dailyPlan.afternoonRoutineDone ? 1 : 0) + (dailyPlan.eveningRoutineDone ? 1 : 0) + (dailyPlan.workoutDone ? 1 : 0) + (dailyPlan.readingDone ? 1 : 0);
  const habitTotal = habitsCustom.length + 3;
  const water = dailyPlan.waterGlasses || 0;
  // Routines (morning / afternoon / evening) — for the new Summary stats
  const routinesDone = (dailyPlan.morningRoutineDone ? 1 : 0) + (dailyPlan.afternoonRoutineDone ? 1 : 0) + (dailyPlan.eveningRoutineDone ? 1 : 0);
  // Today's mood from cycle entries (drives "How I feel" stat)
  const todayCycle = ((data.cycle || {}).entries || []).find(e => e.date === today);
  const moodMap = { great: "✨", good: "😊", okay: "🙂", low: "😔", anxious: "😟", angry: "😤", tired: "😴", tearful: "🥺" };
  const moodLabel = { great: "great", good: "good", okay: "okay", low: "low", anxious: "anxious", angry: "angry", tired: "tired", tearful: "tearful" };
  const todayMoodEmoji = todayCycle && todayCycle.mood ? moodMap[todayCycle.mood] : null;
  const todayMoodLabel = todayCycle && todayCycle.mood ? moodLabel[todayCycle.mood] : null;
  // Cycle day (days since last flow start, if known)
  const cycleFlowDays = ((data.cycle || {}).entries || []).filter(e => e.flow && e.flow !== "none").map(e => e.date).sort();
  const periodStarts = [];
  for (let i = 0; i < cycleFlowDays.length; i++) {
    if (i === 0 || (new Date(cycleFlowDays[i]) - new Date(cycleFlowDays[i - 1])) > 7 * 24 * 60 * 60 * 1000) {
      periodStarts.push(cycleFlowDays[i]);
    }
  }
  const lastPeriodDate = periodStarts.at(-1);
  const cycleDay = lastPeriodDate ? Math.floor((new Date(today) - new Date(lastPeriodDate)) / (1000 * 60 * 60 * 24)) + 1 : null;

  const allAffs = data.affirmations || [];
  const affPicks = data.affirmationPicks || {}; // { "YYYY-MM-DD": affirmationId }
  const pickedToday = affPicks[today];
  const dailyAffirmation = (pickedToday && allAffs.find(a => a.id === pickedToday))
    || allAffs[new Date().getDate() % Math.max(1, allAffs.length)]
    || null;
  const [affPickerOpen, setAffPickerOpen] = useState(false);
  const [affPickerCategory, setAffPickerCategory] = useState("All");
  const [affPickerSearch, setAffPickerSearch] = useState("");
  const pickAffirmation = (id) => {
    setData({ ...data, affirmationPicks: { ...affPicks, [today]: id } });
    setAffPickerOpen(false);
  };
  const clearPick = () => {
    const next = { ...affPicks };
    delete next[today];
    setData({ ...data, affirmationPicks: next });
  };
  const affCategories = ["All", "Favorites", ...Array.from(new Set(allAffs.map(a => a.category).filter(Boolean)))];
  const filteredAffs = allAffs.filter(a => {
    if (affPickerCategory === "Favorites" && !a.favorite) return false;
    if (affPickerCategory !== "All" && affPickerCategory !== "Favorites" && a.category !== affPickerCategory) return false;
    if (affPickerSearch && !a.text.toLowerCase().includes(affPickerSearch.toLowerCase())) return false;
    return true;
  });

  const dateStr = fmtDate(todayISO());
  const hour = new Date().getHours();
  const timeGreeting = t(hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening", lang);
  const dayPhrase = t(
    hour < 12 ? "A quiet start. Let's set the tone."
    : hour < 17 ? "You're in the middle of it. Stay with yourself."
    : "Soft landing. Honor what you did today.",
    lang
  );
  const net = Math.round(monthlyIncome - monthlyExpenses);
  const firstName = (user.name || "").split(" ")[0];
  const serifStyle = { fontFamily: "'Playfair Display', Georgia, serif" };

  return (
    <div>
      {/* GREETING — softer hero, compact */}
      <div className="mb-6">
        <p className="text-[11px] italic tracking-wide text-[#7a9a6e] mb-1" style={serifStyle}>{dateStr}</p>
        <h1 className="font-serif text-2xl tracking-tight leading-tight" style={serifStyle}>
          {timeGreeting}, <span className="italic text-[#5b7351]">{firstName || t("love", lang)}</span>.
        </h1>
        <p className="text-sm italic text-stone-500 mt-1" style={serifStyle}>{dayPhrase}</p>
      </div>

      {/* AFFIRMATION HERO — pick your own for today */}
      {allAffs.length > 0 ? (
        <div className="rounded-2xl bg-gradient-to-br from-[#f4f7ee] via-white to-[#f4f7ee]/50 border border-[#d3e0c5] px-6 py-6 mb-6 text-center relative">
          <div className="text-[10px] italic tracking-[0.2em] text-[#7a9a6e] mb-3" style={serifStyle}>{t("a word for today", lang)}</div>
          <p className="font-serif text-2xl md:text-3xl italic leading-snug text-stone-800 max-w-2xl mx-auto" style={serifStyle}>"{dailyAffirmation.text}"</p>
          <div className="mt-3 flex items-center justify-center gap-4 text-[11px] italic" style={serifStyle}>
            <button onClick={() => { setAffPickerCategory("All"); setAffPickerSearch(""); setAffPickerOpen(true); }} className="text-[#5b7351] hover:underline">
              {pickedToday ? t("change today's word", lang) : t("pick today's word", lang)}
            </button>
            {pickedToday && (
              <button onClick={clearPick} className="text-stone-400 hover:text-stone-600">{t("clear pick", lang)}</button>
            )}
            <button onClick={() => setActive("affirmations")} className="text-stone-400 hover:text-[#5b7351]">{t("all affirmations →", lang)}</button>
          </div>
        </div>
      ) : (
        <div className="rounded-2xl border border-dashed border-[#d3e0c5] px-6 py-6 mb-6 text-center">
          <p className="text-sm italic text-stone-500" style={serifStyle}>{t("You don't have any affirmations saved yet.", lang)}</p>
          <button onClick={() => setActive("affirmations")} className="mt-2 text-xs italic text-[#5b7351] hover:underline" style={serifStyle}>{t("add your first →", lang)}</button>
        </div>
      )}

      {/* AFFIRMATION PICKER MODAL */}
      {affPickerOpen && (
        <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/40 p-6" onClick={() => setAffPickerOpen(false)}>
          <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl border border-stone-200 max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
            <div className="px-5 py-4 border-b border-stone-100 flex items-center justify-between">
              <div>
                <h3 className="font-serif text-xl italic text-stone-800" style={serifStyle}>{t("Pick today's word", lang)}</h3>
                <p className="text-xs italic text-stone-400" style={serifStyle}>{t("The one your soul needs to hear today.", lang)}</p>
              </div>
              <button onClick={() => setAffPickerOpen(false)} className="p-2 rounded hover:bg-stone-100"><X className="w-4 h-4" /></button>
            </div>
            <div className="px-5 py-3 border-b border-stone-100 space-y-2">
              <input
                value={affPickerSearch}
                onChange={e => setAffPickerSearch(e.target.value)}
                placeholder={t("Search…", lang)}
                className="w-full px-3 py-2 text-sm rounded border border-stone-200 focus:border-[#7a9a6e] outline-none bg-white"
              />
              <div className="flex flex-wrap gap-1.5">
                {affCategories.map(c => (
                  <button
                    key={c}
                    onClick={() => setAffPickerCategory(c)}
                    className={`px-2.5 py-1 text-[11px] rounded-full italic transition ${affPickerCategory === c ? "bg-[#7a9a6e] text-white" : "bg-stone-50 text-stone-500 hover:bg-[#f4f7ee]"}`}
                    style={serifStyle}
                  >{c}</button>
                ))}
              </div>
            </div>
            <div className="overflow-y-auto flex-1 px-5 py-3 space-y-2">
              {filteredAffs.length === 0 ? (
                <div className="py-8 text-center text-sm italic text-stone-400" style={serifStyle}>{t("Nothing matches — try a different filter.", lang)}</div>
              ) : filteredAffs.map(a => {
                const isPicked = a.id === dailyAffirmation?.id;
                return (
                  <button
                    key={a.id}
                    onClick={() => pickAffirmation(a.id)}
                    className={`w-full text-left rounded-lg border p-3 transition ${isPicked ? "border-[#7a9a6e] bg-[#f4f7ee]/60" : "border-stone-200 hover:border-[#7a9a6e] hover:bg-[#f4f7ee]/30"}`}
                  >
                    <p className="font-serif italic text-sm text-stone-800 leading-snug" style={serifStyle}>"{a.text}"</p>
                    <div className="flex items-center gap-2 mt-1.5">
                      {a.category && <span className="text-[10px] italic text-stone-400" style={serifStyle}>{a.category}</span>}
                      {a.favorite && <Heart className="w-3 h-3 fill-rose-300 text-rose-300" />}
                      {isPicked && <span className="text-[10px] italic text-[#5b7351] ml-auto" style={serifStyle}>{t("currently showing", lang)}</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* TODAY CHECKLIST — circles, not boxes */}
      {(() => {
        const tasksLeft = todayTotal - todayDone;
        const prioritiesSet = todayPriorities.length;
        const habitsLeft = habitTotal - habitDone;
        const vitaminsLeft = vitaminsList.length - vitaminsTakenToday;
        const waterLeft = Math.max(0, 8 - water);
        const moodLogged = !!todayMoodEmoji;
        const ProgressCircle = ({ done, total, valueLabel, doneIcon }) => {
          const size = 84, stroke = 5;
          const r = (size - stroke) / 2;
          const c = 2 * Math.PI * r;
          const pct = total > 0 ? Math.min(1, done / total) : 0;
          const offset = c - pct * c;
          return (
            <div className="relative flex-shrink-0" style={{ width: size, height: size }}>
              <svg width={size} height={size} className="-rotate-90">
                <circle cx={size / 2} cy={size / 2} r={r} stroke="#e7e5e4" strokeWidth={stroke} fill="none" />
                <circle cx={size / 2} cy={size / 2} r={r} stroke="#7a9a6e" strokeWidth={stroke} fill="none" strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round" style={{ transition: "stroke-dashoffset 0.6s ease" }} />
              </svg>
              <div className="absolute inset-0 flex items-center justify-center">
                <span className="font-serif text-xl text-[#5b7351]" style={serifStyle}>{pct === 1 && total > 0 ? (doneIcon || "✓") : valueLabel}</span>
              </div>
            </div>
          );
        };
        const items = [
          { onClick: () => setActive("planner"), label: "tasks left",    sub: todayTotal > 0 ? (tasksLeft > 0 ? t("of {n} today", lang, { n: todayTotal }) : t("all done — well done", lang)) : t("no tasks yet", lang),                       done: todayDone,                  total: todayTotal,            valueLabel: `${tasksLeft || 0}` },
          { onClick: () => setActive("planner"), label: "top 3",         sub: prioritiesSet === 3 ? t("you know your why", lang) : t("set today's priorities", lang),                                                          done: prioritiesSet,              total: 3,                     valueLabel: `${prioritiesSet}/3` },
          { onClick: () => setActive("habits"),  label: "habits",        sub: habitTotal > 0 ? (habitsLeft > 0 ? t("{n} of {m} left", lang, { n: habitsLeft, m: habitTotal }) : t("rhythm kept", lang)) : t("add habits to begin", lang),            done: habitDone,                  total: habitTotal,            valueLabel: `${habitDone}/${habitTotal}` },
          { onClick: () => setActive("planner"), label: "water",         sub: waterLeft > 0 ? t(waterLeft === 1 ? "{n} glass to go" : "{n} glasses to go", lang, { n: waterLeft }) : t("hydrated · 8/8", lang),                                  done: water,                      total: 8,                     valueLabel: `${water}/8` },
          { onClick: () => setActive("cycle"),   label: "vitamins",      sub: vitaminsList.length > 0 ? (vitaminsLeft > 0 ? t("left to take", lang) : t("{n}/{m} taken", lang, { n: vitaminsList.length, m: vitaminsList.length })) : t("add vitamins to begin", lang), done: vitaminsTakenToday, total: vitaminsList.length, valueLabel: vitaminsList.length > 0 ? `${vitaminsTakenToday}/${vitaminsList.length}` : "—" },
          { onClick: () => setActive("cycle"),   label: "mood",          sub: moodLogged ? t("feeling {mood}", lang, { mood: t(todayMoodLabel || "okay", lang) }) : t("how am I today?", lang),                                                                   done: moodLogged ? 1 : 0,         total: 1,                     valueLabel: moodLogged ? todayMoodEmoji : "?", doneIcon: todayMoodEmoji },
        ];
        return (
          <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-6">
            {items.map((c, i) => (
              <button
                key={i}
                onClick={c.onClick}
                className="flex flex-col items-center text-center rounded-2xl px-2 py-3 transition hover:bg-[#f4f7ee]/40"
              >
                <ProgressCircle done={c.done} total={c.total} valueLabel={c.valueLabel} doneIcon={c.doneIcon} />
                <div className="font-serif italic text-sm text-stone-800 mt-2 leading-tight" style={serifStyle}>{t(c.label, lang)}</div>
                <div className="text-[10px] text-stone-400 italic mt-0.5 leading-tight" style={serifStyle}>{c.sub}</div>
              </button>
            ))}
          </div>
        );
      })()}

      <div className="grid lg:grid-cols-3 gap-5">
        {/* TODAY — softer to-do */}
        <div className="lg:col-span-2">
          <div className={`rounded-2xl border ${themePanel} p-6`}>
            <div className="flex items-baseline justify-between mb-1">
              <h2 className="font-serif text-2xl text-stone-800" style={serifStyle}>{t("Today", lang)}</h2>
              <button onClick={() => setActive("planner")} className="text-xs italic text-stone-500 hover:text-[#5b7351]" style={serifStyle}>
                {t("{n} of {m} done →", lang, { n: todayDone, m: todayTotal })}
              </button>
            </div>
            <p className="text-xs italic text-stone-400 mb-4" style={serifStyle}>{t("The small things, in order.", lang)}</p>
            <div className="h-1 rounded-full bg-stone-100 mb-5 overflow-hidden">
              <div className="h-full bg-[#a8c090] transition-all duration-700" style={{ width: `${todayPct}%` }} />
            </div>
            <div className="divide-y divide-stone-100">
              {todaysTasks.length === 0 ? (
                <button onClick={() => setActive("planner")} className={`w-full py-10 text-center ${themeMuted} text-sm italic hover:text-[#5b7351] transition`} style={serifStyle}>{t("Nothing on the list yet — open your planner to add the first thing →", lang)}</button>
              ) : todaysTasks.slice(0, 9).map(task => (
                <div key={task.id} className="flex items-center gap-4 py-3 group">
                  <button onClick={() => toggle(task.id)} className={`w-7 h-7 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition ${task.done ? "bg-[#a8c090] border-[#a8c090]" : "border-[#a8c090]/40 hover:border-[#a8c090]"}`}>
                    {task.done && <Check className="w-3.5 h-3.5 text-white" />}
                  </button>
                  <div className="flex-1 min-w-0">
                    <div className={`text-base ${task.done ? "line-through text-stone-400" : "text-stone-900"} truncate`}>{task.title}</div>
                    {(task.time || task.priority === "critical" || task.priority === "high") && (
                      <div className="text-xs italic text-stone-400 mt-0.5" style={serifStyle}>
                        {task.time && <span>{task.time}</span>}
                        {task.time && (task.priority === "critical" || task.priority === "high") && <span> · </span>}
                        {(task.priority === "critical" || task.priority === "high") && <span>{t("a priority", lang)}</span>}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* MY WHY photo — softer, no harsh label */}
        <div className={`rounded-2xl border ${themePanel} overflow-hidden relative group`}>
          {inspirationImg ? (
            <>
              <img src={inspirationImg} alt="Inspiration" className="w-full h-full min-h-[420px] object-cover" />
              <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                <label className="p-1.5 rounded bg-white/95 backdrop-blur hover:bg-[#f4f7ee] text-stone-700 cursor-pointer shadow" title={t("Replace photo", lang)}>
                  <Edit2 className="w-3.5 h-3.5" />
                  <input type="file" accept="image/*" onChange={onPickInspiration} className="hidden" />
                </label>
                <button onClick={removeInspiration} className="p-1.5 rounded bg-white/95 backdrop-blur hover:bg-rose-50 hover:text-rose-600 text-stone-700 shadow" title={t("Remove", lang)}>
                  <Trash2 className="w-3.5 h-3.5" />
                </button>
              </div>
              <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/55 via-black/10 to-transparent px-4 py-3">
                <div className="text-[11px] italic text-white/90" style={serifStyle}>{t("my why", lang)}</div>
              </div>
            </>
          ) : (
            <label className="flex flex-col items-center justify-center text-center p-8 cursor-pointer hover:bg-[#f4f7ee]/50 transition min-h-[420px]">
              <div className="w-14 h-14 rounded-full bg-[#f4f7ee] flex items-center justify-center mb-4">
                <ImageIcon className="w-6 h-6 text-[#7a9a6e]" />
              </div>
              <div className="font-serif text-lg italic text-[#5b7351]" style={serifStyle}>{t("my why", lang)}</div>
              <p className={`text-xs italic mt-1 ${themeMuted}`} style={serifStyle}>{pickingImg ? t("uploading…", lang) : t("a photo of what you're building toward", lang)}</p>
              <input type="file" accept="image/*" onChange={onPickInspiration} className="hidden" />
            </label>
          )}
        </div>
      </div>

      {/* PRIORITIES + VITAMINS — soft headers */}
      <div className="grid lg:grid-cols-2 gap-5 mt-5">
        <button onClick={() => setActive("planner")} className={`text-left rounded-2xl border ${themePanel} p-6 hover:border-[#7a9a6e] transition`}>
          <div className="flex items-baseline justify-between mb-1">
            <h2 className="font-serif text-2xl text-stone-800" style={serifStyle}>{t("Three things that matter", lang)}</h2>
            <span className="text-xs italic text-stone-400" style={serifStyle}>{t("edit →", lang)}</span>
          </div>
          <p className="text-xs italic text-stone-400 mb-4" style={serifStyle}>{t("If only these get done, the day was a good one.", lang)}</p>
          <div className="space-y-3">
            {[0, 1, 2].map(i => {
              const text = ((dailyPlan.priorities || [])[i] || "").trim();
              return (
                <div key={i} className="flex items-start gap-3">
                  <div className="font-serif text-3xl italic text-[#a8c090] leading-none w-7 flex-shrink-0" style={serifStyle}>{i + 1}</div>
                  <div className={`flex-1 text-sm leading-relaxed ${text ? "text-stone-900" : "italic text-stone-400"}`} style={!text ? serifStyle : undefined}>{text || t("not set yet", lang)}</div>
                </div>
              );
            })}
          </div>
        </button>

        <div onClick={() => setActive("cycle")} className={`rounded-2xl border ${themePanel} p-6 hover:border-[#7a9a6e] transition cursor-pointer`}>
          <div className="flex items-baseline justify-between mb-1">
            <h2 className="font-serif text-2xl text-stone-800" style={serifStyle}>{t("Take care of you", lang)}</h2>
            <span className="text-xs italic text-stone-400" style={serifStyle}>{t("{n} of {m} today", lang, { n: vitaminsTakenToday, m: vitaminsList.length })}</span>
          </div>
          <p className="text-xs italic text-stone-400 mb-4" style={serifStyle}>{t("The body keeps the score. Be kind to it.", lang)}</p>
          {vitaminsList.length === 0 ? (
            <div className={`py-6 text-center ${themeMuted} text-sm italic`} style={serifStyle}>{t("nothing added yet — add a few in Cycle & Mood →", lang)}</div>
          ) : (
            <div className="space-y-1.5">
              {vitaminsList.slice(0, 6).map(v => {
                const taken = (v.taken || []).includes(today);
                return (
                  <div key={v.id} className="flex items-center gap-3 py-1.5">
                    <div className={`w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 border-2 transition ${taken ? "bg-[#7a9a6e] border-[#7a9a6e]" : "border-stone-200"}`}>
                      {taken && <Check className="w-3 h-3 text-white" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className={`text-sm truncate ${taken ? "line-through text-stone-400" : "text-stone-900"}`}>{v.name}</div>
                    </div>
                    {[v.dose, v.time].filter(Boolean).length > 0 && (
                      <div className="text-[11px] italic text-stone-400" style={serifStyle}>{[v.dose, v.time].filter(Boolean).join(" · ")}</div>
                    )}
                  </div>
                );
              })}
              {vitaminsList.length > 6 && (
                <div className="text-[11px] italic text-stone-400 pt-1" style={serifStyle}>+ {vitaminsList.length - 6} more</div>
              )}
            </div>
          )}
        </div>
      </div>

    </div>
  );
}

// ============================================================
// HABITS & SELF MODULE — strengths, weaknesses, what to improve, custom habit tracker
// ============================================================
// ============================================================
// HABITS VIEW — focused daily habits page (companion to Daily Planner)
// ============================================================
function HabitsViewModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const today = todayISO();
  const planners = data.planners || {};
  const todayPlan = planners[today] || {
    priorities: ["", "", ""], blocks: {}, wins: ["", "", ""], gratitude: "", journal: "", waterGlasses: 0,
    workoutDone: false, readingDone: false, morningRoutineDone: false, afternoonRoutineDone: false, eveningRoutineDone: false,
  };
  const update = (patch) => setData({ ...data, planners: { ...planners, [today]: { ...todayPlan, ...patch } } });

  // Built-in routines + custom habits
  const BUILT_IN_DEFAULTS = {
    morning: "Morning routine", afternoon: "Afternoon routine", evening: "Evening routine",
    workout: "Workout", reading: "Reading 30m",
  };
  const routineLabels = { ...BUILT_IN_DEFAULTS, ...(data.routineLabels || {}) };
  const routineHidden = data.routineHidden || {};
  const renameBuiltIn = (key, name) => setData({ ...data, routineLabels: { ...(data.routineLabels || {}), [key]: name } });
  const hideBuiltIn = (key) => setData({ ...data, routineHidden: { ...(data.routineHidden || {}), [key]: true } });
  const restoreBuiltIn = (key) => {
    const next = { ...(data.routineHidden || {}) }; delete next[key];
    setData({ ...data, routineHidden: next });
  };
  const builtIns = [
    { key: "morning",   doneKey: "morningRoutineDone" },
    { key: "afternoon", doneKey: "afternoonRoutineDone" },
    { key: "evening",   doneKey: "eveningRoutineDone" },
    { key: "workout",   doneKey: "workoutDone" },
    { key: "reading",   doneKey: "readingDone" },
  ];
  const hiddenList = Object.keys(routineHidden).filter(k => routineHidden[k] && BUILT_IN_DEFAULTS[k]);
  const habitsCustom = Array.isArray(data.habitsCustom) ? data.habitsCustom : [];
  const [habitDraft, setHabitDraft] = useState("");

  const addCustomHabit = () => {
    const name = (habitDraft || "").trim();
    if (!name) return;
    const existingIds = habitsCustom.map(h => Number(h && h.id)).filter(n => !isNaN(n));
    const id = (existingIds.length ? Math.max(...existingIds) : 0) + 1;
    setData({ ...data, habitsCustom: [...habitsCustom, { id, name }] });
    setHabitDraft("");
  };
  const renameCustomHabit = (id, name) => setData({ ...data, habitsCustom: habitsCustom.map(h => h.id === id ? { ...h, name } : h) });
  const removeCustomHabit = (id) => setData({ ...data, habitsCustom: habitsCustom.filter(h => h.id !== id) });

  const totalCount = builtIns.filter(b => !routineHidden[b.key]).length + habitsCustom.length;
  const doneCount = builtIns.filter(b => !routineHidden[b.key] && todayPlan[b.doneKey]).length
    + habitsCustom.filter(h => (todayPlan.customHabits || {})[h.id]).length;
  const water = todayPlan.waterGlasses || 0;

  return (
    <div>
      <PageHeader title={t("Habits", lang)} subtitle={fmtDate(today) + " — " + t("your rhythm for today", lang)} dark={dark} />

      {/* Top row: completion ring + water */}
      <div className={`rounded-lg border ${themePanel} p-5 mb-5 flex flex-wrap items-center justify-between gap-6`}>
        <div className="flex items-center gap-5">
          <ProgressRing value={totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0} size={90} stroke={8} dark={dark} label="done" />
          <div>
            <div className="text-xs tracking-[0.2em] text-[#7a9a6e]">{t("TODAY", lang)}</div>
            <div className="font-serif text-lg" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("{n} of {m} habits", lang, { n: doneCount, m: totalCount })}</div>
          </div>
        </div>
        <div className="flex flex-col items-center">
          <div className="text-xs tracking-[0.2em] text-[#7a9a6e] mb-2">{t("WATER (8 glasses)", lang)}</div>
          <div className="flex gap-1">
            {[1, 2, 3, 4, 5, 6, 7, 8].map(n => (
              <button key={n} onClick={() => update({ waterGlasses: n === todayPlan.waterGlasses ? n - 1 : n })} className={`w-5 h-7 rounded-b-md border-2 ${n <= (todayPlan.waterGlasses || 0) ? "bg-[#a8c090] border-[#7a9a6e]" : "border-stone-300 bg-white"}`} title={t("Glass {n}", lang, { n })} />
            ))}
          </div>
        </div>
      </div>

      <Panel title={t("Daily habits I'm tracking", lang)} dark={dark} className="mb-5" action={
        <span className="text-[10px] text-stone-500">{t(totalCount === 1 ? "{n} habit" : "{n} habits", lang, { n: totalCount })}</span>
      }>
        <p className={`text-xs ${themeMuted} mb-3 italic`}>{t("Tap the circle to mark a habit done today. Click any name to rename.", lang)}</p>
        <div className="grid sm:grid-cols-2 gap-2 mb-3">
          {builtIns.filter(b => !routineHidden[b.key]).map(b => {
            const done = !!todayPlan[b.doneKey];
            return (
              <div key={b.key} className={`flex items-center gap-2 p-3 rounded border group transition ${done ? "bg-[#f4f7ee] border-[#a8c090]" : "bg-white border-stone-200 hover:border-[#7a9a6e]"}`}>
                <button onClick={() => update({ [b.doneKey]: !done })} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition ${done ? "bg-[#7a9a6e] border-[#7a9a6e] text-white" : "border-[#9cb88f] hover:bg-[#f4f7ee]"}`}>
                  {done && <Check className="w-3.5 h-3.5" />}
                </button>
                <input
                  value={routineLabels[b.key]}
                  onChange={e => renameBuiltIn(b.key, e.target.value)}
                  className={`flex-1 text-sm bg-transparent border-0 outline-none focus:bg-white focus:px-2 focus:py-1 focus:rounded transition-all ${done ? "line-through text-stone-500" : ""}`}
                />
                <button onClick={() => hideBuiltIn(b.key)} className="p-1 text-stone-400 hover:text-rose-500 opacity-50 group-hover:opacity-100 transition" title={t("Remove", lang)}><Trash2 className="w-3.5 h-3.5" /></button>
              </div>
            );
          })}
          {habitsCustom.map(h => {
            const done = !!(todayPlan.customHabits || {})[h.id];
            return (
              <div key={h.id} className={`flex items-center gap-2 p-3 rounded border group transition ${done ? "bg-[#f4f7ee] border-[#a8c090]" : "bg-white border-stone-200 hover:border-[#7a9a6e]"}`}>
                <button onClick={() => update({ customHabits: { ...(todayPlan.customHabits || {}), [h.id]: !done } })} className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition ${done ? "bg-[#7a9a6e] border-[#7a9a6e] text-white" : "border-[#9cb88f] hover:bg-[#f4f7ee]"}`}>
                  {done && <Check className="w-3.5 h-3.5" />}
                </button>
                <input
                  value={h.name}
                  onChange={e => renameCustomHabit(h.id, e.target.value)}
                  className={`flex-1 text-sm bg-transparent border-0 outline-none focus:bg-white focus:px-2 focus:py-1 focus:rounded transition-all ${done ? "line-through text-stone-500" : ""}`}
                />
                <button onClick={() => removeCustomHabit(h.id)} className="p-1 text-stone-400 hover:text-rose-500 opacity-50 group-hover:opacity-100 transition" title={t("Delete", lang)}><Trash2 className="w-3.5 h-3.5" /></button>
              </div>
            );
          })}
        </div>
        <div className="flex gap-2">
          <input value={habitDraft} onChange={e => setHabitDraft(e.target.value)} onKeyDown={e => { if (e.key === "Enter") addCustomHabit(); }} placeholder={t("e.g., Pilates 30 min, journaling, no sugar…", lang)} className="flex-1 px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
          <button onClick={addCustomHabit} className="px-4 py-2 bg-[#7a9a6e] text-white text-sm rounded font-medium hover:bg-[#5b7351] flex items-center gap-1"><Plus className="w-3.5 h-3.5" /> {t("Add habit", lang)}</button>
        </div>
        {hiddenList.length > 0 && (
          <div className="mt-3 flex flex-wrap items-center gap-2 pt-3 border-t border-stone-100">
            <span className="text-[10px] text-stone-400 tracking-[0.18em] uppercase">{t("Removed:", lang)}</span>
            {hiddenList.map(k => (
              <button key={k} onClick={() => restoreBuiltIn(k)} className="text-[10px] px-2 py-0.5 rounded-full border border-dashed border-stone-300 text-stone-500 hover:border-[#7a9a6e] hover:text-[#5b7351] flex items-center gap-1" title={t("Restore", lang)}>
                <RefreshCw className="w-3 h-3" /> {routineLabels[k]}
              </button>
            ))}
          </div>
        )}
      </Panel>
    </div>
  );
}

function HabitsSelfModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const habitsList = Array.isArray(data.habitsCustom) ? data.habitsCustom : [];
  const reflection = data.selfReflection || { strengths: [], weaknesses: [], improvements: [] };
  const customPanels = Array.isArray(data.customReflections) ? data.customReflections : [];

  const updateList = (key, list) => setData({ ...data, selfReflection: { ...reflection, [key]: list } });

  // Custom user-created panels
  const addCustomPanel = () => {
    const id = (customPanels.length ? Math.max(0, ...customPanels.map(p => p.id || 0)) : 0) + 1;
    setData({
      ...data,
      customReflections: [...customPanels, { id, title: t("New section", lang), hint: t("What's on your heart in this area?", lang), list: [] }],
    });
  };
  const updateCustomPanel = (id, patch) => {
    setData({ ...data, customReflections: customPanels.map(p => p.id === id ? { ...p, ...patch } : p) });
  };
  const removeCustomPanel = (id) => {
    if (!confirm(t("Delete this section and everything in it?", lang))) return;
    setData({ ...data, customReflections: customPanels.filter(p => p.id !== id) });
  };

  // Inline editable Reflection panel — used for both built-in and custom
  const ReflectionPanel = ({ title, hint, list, onSave, accent, editableTitle, onTitleChange, onHintChange, onDelete }) => {
    const [text, setText] = useState("");
    const add = () => {
      if (!text.trim()) return;
      onSave([...list, text.trim()]);
      setText("");
    };
    const remove = (i) => onSave(list.filter((_, k) => k !== i));
    return (
      <div className={`rounded-lg border ${themePanel} p-5 group`}>
        <div className="flex items-baseline justify-between gap-2 mb-2">
          {editableTitle ? (
            <input
              value={title}
              onChange={e => onTitleChange(e.target.value)}
              placeholder={t("Section title…", lang)}
              className="flex-1 font-serif text-base font-semibold bg-transparent border-0 outline-none focus:bg-[#f4f7ee] focus:px-2 focus:py-1 focus:rounded transition-all"
              style={{ fontFamily: "'Playfair Display', Georgia, serif" }}
            />
          ) : (
            <h3 className="font-serif text-base font-semibold" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{title}</h3>
          )}
          <div className="flex items-center gap-1 flex-shrink-0">
            <span className="text-[10px] text-stone-500">{t(list.length === 1 ? "{n} item" : "{n} items", lang, { n: list.length })}</span>
            {onDelete && (
              <button onClick={onDelete} className="p-1 text-stone-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition" title={t("Delete this section", lang)}>
                <Trash2 className="w-3.5 h-3.5" />
              </button>
            )}
          </div>
        </div>
        {onHintChange ? (
          <input
            value={hint}
            onChange={e => onHintChange(e.target.value)}
            placeholder={t("Short hint…", lang)}
            className={`block w-full text-xs ${themeMuted} italic mb-3 bg-transparent border-0 outline-none focus:bg-[#f4f7ee] focus:px-2 focus:py-1 focus:rounded transition-all`}
          />
        ) : (
          <p className={`text-xs ${themeMuted} mb-3 italic`}>{hint}</p>
        )}
        <div className="space-y-2 mb-3">
          {list.length === 0 ? (
            <div className={`text-xs ${themeMuted} py-4 text-center italic`}>{t("Nothing yet — add your first below.", lang)}</div>
          ) : list.map((item, i) => (
            <div key={i} className={`flex items-center gap-2 p-2.5 rounded border ${accent}`}>
              <span className="flex-1 text-sm">{item}</span>
              <button onClick={() => remove(i)} className="p-1 text-stone-400 hover:text-rose-500"><X className="w-3.5 h-3.5" /></button>
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => { if (e.key === "Enter") add(); }} placeholder={t("Add one…", lang)} className="flex-1 px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
          <button onClick={add} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm rounded font-medium hover:bg-[#5b7351] flex items-center gap-1"><Plus className="w-3.5 h-3.5" /></button>
        </div>
      </div>
    );
  };

  return (
    <div>
      <PageHeader title={t("Growth & Self", lang)} subtitle={t("Know your strengths. Own your growth. Manage habits on the Daily Planner.", lang)} dark={dark}
        action={
          <button onClick={addCustomPanel} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm font-medium rounded hover:bg-[#5b7351] flex items-center gap-1.5">
            <Plus className="w-4 h-4" /> {t("New section", lang)}
          </button>
        } />

      <div className="grid lg:grid-cols-3 gap-5">
        <ReflectionPanel
          title={t("My strengths", lang)}
          hint={t("What you do well. Lean into these.", lang)}
          list={reflection.strengths}
          onSave={(list) => updateList("strengths", list)}
          accent="border-[#d3e0c5] bg-[#f4f7ee]"
        />
        <ReflectionPanel
          title={t("My weaknesses", lang)}
          hint={t("What trips you up. Awareness is the first step.", lang)}
          list={reflection.weaknesses}
          onSave={(list) => updateList("weaknesses", list)}
          accent="border-stone-200 bg-stone-50"
        />
        <ReflectionPanel
          title={t("What I need to improve", lang)}
          hint={t("Where you're focusing your growth this season.", lang)}
          list={reflection.improvements}
          onSave={(list) => updateList("improvements", list)}
          accent="border-amber-200 bg-amber-50/50"
        />
        {customPanels.map(p => (
          <ReflectionPanel
            key={p.id}
            title={p.title}
            hint={p.hint}
            list={Array.isArray(p.list) ? p.list : []}
            onSave={(list) => updateCustomPanel(p.id, { list })}
            onTitleChange={(title) => updateCustomPanel(p.id, { title })}
            onHintChange={(hint) => updateCustomPanel(p.id, { hint })}
            onDelete={() => removeCustomPanel(p.id)}
            editableTitle={true}
            accent="border-[#d3e0c5] bg-[#f4f7ee]/40"
          />
        ))}
        {/* Add-new tile when zero customs and at the end always */}
        <button
          onClick={addCustomPanel}
          className="rounded-lg border-2 border-dashed border-[#a8c090] p-5 hover:bg-[#f4f7ee]/40 transition flex flex-col items-center justify-center text-center min-h-[200px] group"
        >
          <div className="w-12 h-12 rounded-full bg-[#f4f7ee] flex items-center justify-center mb-3 group-hover:bg-[#a8c090]/30">
            <Plus className="w-6 h-6 text-[#5b7351]" />
          </div>
          <div className="font-serif text-base text-[#5b7351]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("Add another section", lang)}</div>
          <p className="text-xs italic text-stone-500 mt-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("any list you want to keep track of", lang)}</p>
        </button>
      </div>
    </div>
  );
}

// ============================================================
// CYCLE & MOOD TRACKER
// ============================================================
const FLOW_OPTIONS = [
  { id: "none", label: "No flow", color: "transparent", border: "border-stone-200" },
  { id: "spotting", label: "Spotting", color: "#fde2e4", border: "border-rose-200" },
  { id: "light", label: "Light", color: "#f9b3b8", border: "border-rose-300" },
  { id: "medium", label: "Medium", color: "#e07a82", border: "border-rose-400" },
  { id: "heavy", label: "Heavy", color: "#a83248", border: "border-rose-600" },
];
const MOOD_OPTIONS = [
  { id: "great", label: "Great", emoji: "✨" },
  { id: "good", label: "Good", emoji: "😊" },
  { id: "okay", label: "Okay", emoji: "🙂" },
  { id: "low", label: "Low", emoji: "😔" },
  { id: "anxious", label: "Anxious", emoji: "😟" },
  { id: "angry", label: "Angry", emoji: "😤" },
  { id: "tired", label: "Tired", emoji: "😴" },
  { id: "tearful", label: "Tearful", emoji: "🥺" },
];
const SYMPTOM_OPTIONS = ["Cramps", "Headache", "Bloating", "Tender breasts", "Back pain", "Acne", "Cravings", "Fatigue", "Nausea", "Insomnia", "High energy", "Focused"];

function CycleModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const cycle = data.cycle || { entries: [] };
  const entries = Array.isArray(cycle.entries) ? cycle.entries : [];
  const today = todayISO();
  const [selectedDate, setSelectedDate] = useState(today);
  const [viewMonth, setViewMonth] = useState(() => new Date());
  const shiftMonth = (n) => {
    const d = new Date(viewMonth);
    d.setMonth(d.getMonth() + n);
    setViewMonth(d);
  };

  // Vitamin tracking
  const vitamins = Array.isArray(data.vitamins) ? data.vitamins : [];
  const [vitForm, setVitForm] = useState({ name: "", dose: "", time: "" });
  const [editingVitaminId, setEditingVitaminId] = useState(null);
  const [vitEdit, setVitEdit] = useState({ name: "", dose: "", time: "" });
  const addVitamin = () => {
    const name = (vitForm.name || "").trim();
    if (!name) return;
    const id = vitamins.length ? Math.max(0, ...vitamins.map(v => Number(v.id) || 0)) + 1 : 1;
    setData({ ...data, vitamins: [...vitamins, { id, name, dose: vitForm.dose || "", time: vitForm.time || "", taken: [] }] });
    setVitForm({ name: "", dose: "", time: "" });
  };
  const toggleVitamin = (id) => {
    setData({
      ...data,
      vitamins: vitamins.map(v => {
        if (v.id !== id) return v;
        const taken = Array.isArray(v.taken) ? v.taken : [];
        return taken.includes(today) ? { ...v, taken: taken.filter(d => d !== today) } : { ...v, taken: [...taken, today] };
      }),
    });
  };
  const startEditVitamin = (v) => {
    setEditingVitaminId(v.id);
    setVitEdit({ name: v.name || "", dose: v.dose || "", time: v.time || "" });
  };
  const cancelEditVitamin = () => {
    setEditingVitaminId(null);
    setVitEdit({ name: "", dose: "", time: "" });
  };
  const saveEditVitamin = () => {
    const name = (vitEdit.name || "").trim();
    if (!name) { cancelEditVitamin(); return; }
    setData({
      ...data,
      vitamins: vitamins.map(v => v.id === editingVitaminId ? { ...v, name, dose: vitEdit.dose || "", time: vitEdit.time || "" } : v),
    });
    cancelEditVitamin();
  };
  const removeVitamin = (id) => {
    if (!confirm(t("Remove this vitamin?", lang))) return;
    setData({ ...data, vitamins: vitamins.filter(v => v.id !== id) });
    if (editingVitaminId === id) cancelEditVitamin();
  };
  const calcStreak = (taken) => {
    const set = new Set(taken || []);
    let streak = 0;
    const d = new Date();
    while (set.has(toLocalISO(d))) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  };

  const buildBlank = (dateStr) => ({ date: dateStr, flow: "none", mood: "", symptoms: [], notes: "" });
  const selectedEntry = entries.find(e => e.date === selectedDate) || buildBlank(selectedDate);
  const [draft, setDraft] = useState(selectedEntry);

  // Re-sync when selected date or stored entries change
  useEffect(() => {
    const t = entries.find(e => e.date === selectedDate) || buildBlank(selectedDate);
    setDraft(t);
  }, [selectedDate, entries.length]);

  const saveEntry = (next) => {
    const exists = entries.some(e => e.date === next.date);
    const updated = exists ? entries.map(e => e.date === next.date ? next : e) : [...entries, next];
    setData({ ...data, cycle: { ...cycle, entries: updated } });
    setDraft(next);
  };
  const setFlow = (flow) => saveEntry({ ...draft, flow });
  const setMood = (mood) => saveEntry({ ...draft, mood });
  const toggleSymptom = (s) => {
    const has = (draft.symptoms || []).includes(s);
    saveEntry({ ...draft, symptoms: has ? draft.symptoms.filter(x => x !== s) : [...(draft.symptoms || []), s] });
  };
  const setNotes = (notes) => saveEntry({ ...draft, notes });

  // Calendar — viewMonth-driven (Monday start)
  const monthLabel = viewMonth.toLocaleString("en-US", { month: "long", year: "numeric" });
  const monthYear = viewMonth.getFullYear();
  const monthMonth = viewMonth.getMonth();
  const firstDay = new Date(monthYear, monthMonth, 1);
  const lastDay = new Date(monthYear, monthMonth + 1, 0).getDate();
  const offset = (firstDay.getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= lastDay; d++) {
    const dateStr = `${monthYear}-${String(monthMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const e = entries.find(x => x.date === dateStr);
    cells.push({ day: d, dateStr, entry: e });
  }

  // Cycle stats — find period start days, calculate avg cycle length
  const flowDays = entries.filter(e => e.flow && e.flow !== "none").map(e => e.date).sort();
  const periodStarts = [];
  for (let i = 0; i < flowDays.length; i++) {
    if (i === 0 || (new Date(flowDays[i]) - new Date(flowDays[i - 1])) > 7 * 24 * 60 * 60 * 1000) {
      periodStarts.push(flowDays[i]);
    }
  }
  const cycleLengths = [];
  for (let i = 1; i < periodStarts.length; i++) {
    cycleLengths.push((new Date(periodStarts[i]) - new Date(periodStarts[i - 1])) / (1000 * 60 * 60 * 24));
  }
  const avgCycle = cycleLengths.length ? Math.round(cycleLengths.reduce((s, n) => s + n, 0) / cycleLengths.length) : null;
  const lastPeriod = periodStarts.at(-1);
  const nextEstimate = lastPeriod && avgCycle ? (() => { const d = new Date(lastPeriod); d.setDate(d.getDate() + avgCycle); return toLocalISO(d); })() : null;

  const clearAll = () => {
    if (!confirm(t("Clear all cycle and mood entries?", lang))) return;
    setData({ ...data, cycle: { entries: [] } });
  };

  const deleteEntry = (date) => {
    if (!confirm(t("Delete the entry from {date}?", lang, { date: fmtDate(date) }))) return;
    setData({ ...data, cycle: { ...cycle, entries: entries.filter(e => e.date !== date) } });
  };

  const editEntry = (date) => {
    setSelectedDate(date);
    // Scroll the page to the top so the editor panel is visible
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <div>
      <PageHeader title={t("Cycle & Mood", lang)} subtitle={t("Track your flow. Honor how you feel. Notice the patterns.", lang)} dark={dark}
        action={
          <button onClick={clearAll} className="px-3 py-2 border border-stone-300 hover:border-rose-400 hover:text-rose-600 hover:bg-rose-50 text-sm rounded flex items-center gap-1.5"><RefreshCw className="w-4 h-4" /> {t("Clear all", lang)}</button>
        } />

      {/* TOP STATS */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <div className={`rounded-lg border ${themePanel} p-4`}>
          <div className="text-[10px] tracking-[0.2em] text-stone-500">{t("LAST PERIOD", lang)}</div>
          <div className="font-serif text-2xl text-[#5b7351] mt-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{lastPeriod ? fmtDate(lastPeriod) : "—"}</div>
        </div>
        <div className={`rounded-lg border ${themePanel} p-4`}>
          <div className="text-[10px] tracking-[0.2em] text-stone-500">{t("AVG CYCLE", lang)}</div>
          <div className="font-serif text-2xl text-[#5b7351] mt-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{avgCycle ? t("{n} days", lang, { n: avgCycle }) : "—"}</div>
        </div>
        <div className={`rounded-lg border ${themePanel} p-4`}>
          <div className="text-[10px] tracking-[0.2em] text-stone-500">{t("NEXT ESTIMATE", lang)}</div>
          <div className="font-serif text-2xl text-[#5b7351] mt-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{nextEstimate ? fmtDate(nextEstimate) : "—"}</div>
        </div>
        <div className={`rounded-lg border ${themePanel} p-4`}>
          <div className="text-[10px] tracking-[0.2em] text-stone-500">{t("DAYS LOGGED", lang)}</div>
          <div className="font-serif text-2xl text-[#5b7351] mt-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{entries.length}</div>
        </div>
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        {/* TODAY'S LOG */}
        <div className="lg:col-span-2 space-y-5">
          <Panel title={`${selectedDate === today ? "Today" : "Selected day"} · ${fmtDate(selectedDate)}`} dark={dark} action={
            selectedDate !== today ? (
              <button onClick={() => setSelectedDate(today)} className="text-xs text-[#5b7351] hover:underline flex items-center gap-1"><RefreshCw className="w-3 h-3" /> {t("Back to today", lang)}</button>
            ) : null
          }>
            <div className="mb-4">
              <div className="text-[10px] tracking-wider text-stone-500 mb-2">{t("FLOW", lang)}</div>
              <div className="flex flex-wrap gap-2">
                {FLOW_OPTIONS.map(f => (
                  <button key={f.id} onClick={() => setFlow(f.id)} className={`px-3 py-2 rounded-full text-xs font-medium border-2 transition ${draft.flow === f.id ? "ring-2 ring-offset-1 ring-[#7a9a6e]" : ""} ${f.border}`} style={{ background: draft.flow === f.id ? f.color : "white" }}>
                    {f.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="mb-4">
              <div className="text-[10px] tracking-wider text-stone-500 mb-2">{t("HOW DO YOU FEEL?", lang)}</div>
              <div className="grid grid-cols-4 gap-2">
                {MOOD_OPTIONS.map(m => (
                  <button key={m.id} onClick={() => setMood(m.id)} className={`p-3 rounded-lg border-2 text-center transition ${draft.mood === m.id ? "border-[#7a9a6e] bg-[#f4f7ee]" : "border-stone-200 hover:border-[#7a9a6e]/50"}`}>
                    <div className="text-2xl">{m.emoji}</div>
                    <div className="text-[10px] mt-1 text-stone-600">{t(m.label, lang)}</div>
                  </button>
                ))}
              </div>
            </div>

            <div className="mb-4">
              <div className="text-[10px] tracking-wider text-stone-500 mb-2">{t("SYMPTOMS", lang)}</div>
              <div className="flex flex-wrap gap-2">
                {SYMPTOM_OPTIONS.map(s => {
                  const active = (draft.symptoms || []).includes(s);
                  return (
                    <button key={s} onClick={() => toggleSymptom(s)} className={`px-3 py-1.5 rounded-full text-xs border transition ${active ? "bg-[#7a9a6e] text-white border-[#7a9a6e]" : "border-stone-200 text-stone-600 hover:border-[#7a9a6e]"}`}>
                      {s}
                    </button>
                  );
                })}
              </div>
            </div>

            <div>
              <div className="text-[10px] tracking-wider text-stone-500 mb-2">NOTES</div>
              <textarea
                value={draft.notes || ""}
                onChange={e => setNotes(e.target.value)}
                placeholder="What's coming up for you today? Anything you want to remember…"
                rows={3}
                className="w-full px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white leading-relaxed"
                style={{ fontFamily: "Georgia, serif" }}
              />
            </div>
          </Panel>

          <Panel title="Vitamins & Supplements" dark={dark}>
            <p className={`text-xs ${themeMuted} mb-3`}>Add what you take daily. Tap the circle to mark today done.</p>
            <div className="grid grid-cols-1 sm:grid-cols-[1.5fr_1fr_1fr_auto] gap-2 mb-3">
              <input value={vitForm.name} onChange={e => setVitForm({ ...vitForm, name: e.target.value })} onKeyDown={e => e.key === "Enter" && addVitamin()} placeholder="Vitamin / supplement" className="px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
              <input value={vitForm.dose} onChange={e => setVitForm({ ...vitForm, dose: e.target.value })} onKeyDown={e => e.key === "Enter" && addVitamin()} placeholder="Dose (e.g., 1000mg)" className="px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
              <input value={vitForm.time} onChange={e => setVitForm({ ...vitForm, time: e.target.value })} onKeyDown={e => e.key === "Enter" && addVitamin()} placeholder="When (e.g., AM)" className="px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
              <button onClick={addVitamin} className="px-4 py-2 rounded text-white text-sm font-medium" style={{ background: "#3d5c34" }} title="Add"><Plus className="w-4 h-4" /></button>
            </div>
            {vitamins.length === 0 ? (
              <div className={`p-6 text-center italic ${themeMuted} text-sm`}>No vitamins added yet. Add one above.</div>
            ) : (
              <div className="space-y-2">
                {vitamins.map(v => {
                  const takenToday = (v.taken || []).includes(today);
                  const streak = calcStreak(v.taken);
                  const isEditing = editingVitaminId === v.id;
                  if (isEditing) {
                    return (
                      <div key={v.id} className="p-3 rounded border-2 border-[#7a9a6e] bg-[#f4f7ee]/40 space-y-2">
                        <div className="grid grid-cols-1 sm:grid-cols-[1.5fr_1fr_1fr] gap-2">
                          <input
                            autoFocus
                            value={vitEdit.name}
                            onChange={e => setVitEdit({ ...vitEdit, name: e.target.value })}
                            onKeyDown={e => { if (e.key === "Enter") saveEditVitamin(); if (e.key === "Escape") cancelEditVitamin(); }}
                            placeholder="Name"
                            className="px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
                          />
                          <input
                            value={vitEdit.dose}
                            onChange={e => setVitEdit({ ...vitEdit, dose: e.target.value })}
                            onKeyDown={e => { if (e.key === "Enter") saveEditVitamin(); if (e.key === "Escape") cancelEditVitamin(); }}
                            placeholder="Dose (e.g., 1000mg)"
                            className="px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
                          />
                          <input
                            value={vitEdit.time}
                            onChange={e => setVitEdit({ ...vitEdit, time: e.target.value })}
                            onKeyDown={e => { if (e.key === "Enter") saveEditVitamin(); if (e.key === "Escape") cancelEditVitamin(); }}
                            placeholder="When (e.g., AM)"
                            className="px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
                          />
                        </div>
                        <div className="flex gap-2">
                          <button onClick={saveEditVitamin} className="flex-1 py-2 bg-[#7a9a6e] text-white text-sm font-medium rounded hover:bg-[#5b7351]">Save</button>
                          <button onClick={cancelEditVitamin} className="px-4 py-2 border border-stone-200 text-stone-600 text-sm rounded hover:bg-stone-50">Cancel</button>
                          <button onClick={() => removeVitamin(v.id)} className="px-3 py-2 border border-stone-200 text-rose-500 text-sm rounded hover:bg-rose-50 hover:border-rose-300" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>
                        </div>
                      </div>
                    );
                  }
                  return (
                    <div key={v.id} className="flex items-center gap-3 p-3 rounded border border-stone-200 group hover:border-[#7a9a6e] transition">
                      <button onClick={() => toggleVitamin(v.id)} className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 border-2 transition ${takenToday ? "bg-[#7a9a6e] border-[#7a9a6e] text-white" : "bg-white border-stone-200 hover:border-[#7a9a6e]"}`} title={takenToday ? "Taken today — tap to undo" : "Mark as taken today"}>
                        {takenToday && <Check className="w-5 h-5" />}
                      </button>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-medium truncate">{v.name}</div>
                        <div className="text-xs text-stone-500 truncate">{[v.dose, v.time].filter(Boolean).join(" · ") || <span className="italic text-stone-400">no dose/time set</span>}</div>
                      </div>
                      {streak > 0 && (
                        <div className="flex items-center gap-1 text-xs font-mono text-[#5b7351] flex-shrink-0" title={`${streak}-day streak`}><Flame className="w-3.5 h-3.5" /> {streak}d</div>
                      )}
                      <div className="flex items-center gap-1 flex-shrink-0">
                        <button onClick={() => startEditVitamin(v)} className="p-2 text-stone-500 hover:text-[#5b7351] hover:bg-stone-50 rounded" title="Edit"><Edit2 className="w-4 h-4" /></button>
                        <button onClick={() => removeVitamin(v.id)} className="p-2 text-stone-400 hover:text-rose-500 hover:bg-rose-50 rounded" title="Delete"><Trash2 className="w-4 h-4" /></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </Panel>

          <Panel title="Recent log" dark={dark}>
            {entries.length === 0 ? (
              <div className={`p-8 text-center italic ${themeMuted} text-sm`}>No entries yet. Start with today above.</div>
            ) : (
              <div className="divide-y divide-stone-100">
                {[...entries].sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 14).map(e => {
                  const flow = FLOW_OPTIONS.find(f => f.id === e.flow);
                  const mood = MOOD_OPTIONS.find(m => m.id === e.mood);
                  const isSelected = e.date === selectedDate;
                  return (
                    <div key={e.date} className={`flex items-start gap-3 py-2.5 group ${isSelected ? "bg-[#f4f7ee]/40" : ""}`}>
                      <button
                        onClick={() => editEntry(e.date)}
                        className="flex-1 flex items-start gap-3 text-left min-w-0 -mx-2 px-2 py-1 rounded hover:bg-[#f4f7ee]/60 transition"
                        title="Tap to edit this entry"
                      >
                        <div className="w-3 h-3 rounded-full flex-shrink-0 mt-1.5" style={{ background: flow?.color || "transparent", border: flow && flow.id !== "none" ? "none" : "1px solid #d6d3d1" }} />
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium">{fmtDate(e.date)} {mood && <span className="ml-1">{mood.emoji} {mood.label}</span>}</div>
                          {(e.symptoms || []).length > 0 && <div className="text-xs text-stone-500 mt-0.5">{e.symptoms.join(" · ")}</div>}
                          {e.notes && <div className="text-xs text-stone-600 italic mt-1" style={{ fontFamily: "Georgia, serif" }}>"{e.notes}"</div>}
                        </div>
                        {flow && flow.id !== "none" && <span className="text-[10px] tracking-wider text-stone-400 flex-shrink-0">{flow.label.toUpperCase()}</span>}
                      </button>
                      <div className="flex items-center gap-1 flex-shrink-0 mt-1">
                        <button onClick={() => editEntry(e.date)} className="p-1.5 rounded text-stone-400 hover:text-[#5b7351] hover:bg-stone-50" title="Edit"><Edit2 className="w-3.5 h-3.5" /></button>
                        <button onClick={() => deleteEntry(e.date)} className="p-1.5 rounded text-stone-400 hover:text-rose-500 hover:bg-rose-50" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            <p className="text-[11px] italic text-stone-400 mt-3" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("Tap any entry to edit it — your changes save to that date.", lang)}</p>
          </Panel>
        </div>

        {/* CALENDAR */}
        <Panel title={monthLabel} dark={dark} action={
          <div className="flex items-center gap-1">
            <button onClick={() => shiftMonth(-1)} className="p-1.5 rounded hover:bg-stone-100" title={t("Previous month", lang)}><ArrowRight className="w-3.5 h-3.5 rotate-180" /></button>
            <button onClick={() => { setViewMonth(new Date()); setSelectedDate(today); }} className="px-2 py-1 text-[10px] tracking-wider rounded bg-[#7a9a6e] text-white hover:bg-[#5b7351]" title={t("Back to this month", lang)}>{t("TODAY", lang)}</button>
            <button onClick={() => shiftMonth(1)} className="p-1.5 rounded hover:bg-stone-100" title={t("Next month", lang)}><ArrowRight className="w-3.5 h-3.5" /></button>
          </div>
        }>
          <div className="grid grid-cols-7 gap-1 text-[10px] text-stone-400 mb-1">
            {["M", "T", "W", "T", "F", "S", "S"].map((d, i) => <div key={i} className="text-center">{d}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((c, i) => {
              if (!c) return <div key={i} />;
              const flow = c.entry && FLOW_OPTIONS.find(f => f.id === c.entry.flow);
              const mood = c.entry && MOOD_OPTIONS.find(m => m.id === c.entry.mood);
              const isToday = c.dateStr === today;
              const isSelected = c.dateStr === selectedDate;
              return (
                <button
                  key={i}
                  onClick={() => setSelectedDate(c.dateStr)}
                  className={`aspect-square rounded-lg flex flex-col items-center justify-center text-[11px] border transition hover:ring-2 hover:ring-[#7a9a6e]/40 ${isSelected ? "ring-2 ring-[#5b7351] border-[#5b7351]" : isToday ? "border-[#7a9a6e] ring-1 ring-[#7a9a6e]" : "border-stone-100"}`}
                  style={{ background: flow && flow.id !== "none" ? flow.color : "white" }}
                  title={c.entry ? `${fmtDate(c.dateStr)}${flow && flow.id !== "none" ? ` · ${flow.label}` : ""}${mood ? ` · ${mood.label}` : ""}` : c.dateStr}
                >
                  <span className={flow && (flow.id === "medium" || flow.id === "heavy") ? "text-white font-medium" : "text-stone-700"}>{c.day}</span>
                  {mood && <span className="text-[10px] leading-none">{mood.emoji}</span>}
                </button>
              );
            })}
          </div>
          <div className="mt-3 space-y-1">
            <div className="text-[10px] tracking-wider text-stone-400">{t("FLOW LEGEND", lang)}</div>
            <div className="flex flex-wrap gap-1.5">
              {FLOW_OPTIONS.filter(f => f.id !== "none").map(f => (
                <div key={f.id} className="flex items-center gap-1 text-[10px] text-stone-500">
                  <div className="w-3 h-3 rounded-full" style={{ background: f.color }} />
                  {t(f.label, lang)}
                </div>
              ))}
            </div>
          </div>
        </Panel>
      </div>
    </div>
  );
}
