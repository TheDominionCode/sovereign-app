function SpeakElegantlyModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const customList = Array.isArray(data.elegantPhrasesCustom) ? data.elegantPhrasesCustom : [];
  const phrasesBase = lang === "es" ? ELEGANT_PHRASES_ES : ELEGANT_PHRASES;
  const allPhrases = [...phrasesBase, ...customList];
  const [filter, setFilter] = useState("All");
  // Reset the category filter when the language toggles so we don't keep an
  // English filter value that no longer matches any Spanish category.
  useEffect(() => { setFilter("All"); }, [lang]);
  const [search, setSearch] = useState("");
  const [open, setOpen] = useState(false);
  const [form, setForm] = useState({ cat: "Saying No", from: "", to: "", why: "" });

  const cats = ["All", ...Array.from(new Set(allPhrases.map(p => p.cat)))];
  const filtered = allPhrases.filter(p => {
    if (filter !== "All" && p.cat !== filter) return false;
    if (search && !(p.from + p.to + (p.why || "")).toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const addPhrase = () => {
    const from = (form.from || "").trim();
    const to = (form.to || "").trim();
    if (!from || !to) return;
    const id = customList.length ? Math.max(0, ...customList.map(p => Number(p.id) || 0)) + 1 : 1000;
    setData({ ...data, elegantPhrasesCustom: [...customList, { ...form, id, from, to, custom: true }] });
    setOpen(false);
    setForm({ cat: form.cat, from: "", to: "", why: "" });
  };
  const removeCustom = (id) => {
    if (!confirm(t("Delete this phrase?", lang))) return;
    setData({ ...data, elegantPhrasesCustom: customList.filter(p => p.id !== id) });
  };

  return (
    <div>
      <PageHeader title={t("Speak Eloquently", lang)} subtitle={t("Refine your language. Grow your authority. The way you speak becomes the woman you are.", lang)} dark={dark}
        action={<button onClick={() => setOpen(true)} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm font-medium rounded hover:bg-[#5b7351] flex items-center gap-1.5"><Plus className="w-4 h-4" /> {t("Add phrase", lang)}</button>} />

      <div className="mb-5">
        <input
          value={search}
          onChange={e => setSearch(e.target.value)}
          placeholder={t("Search… (e.g., 'sorry', 'busy', 'angry')", lang)}
          className="w-full px-4 py-2.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
        />
      </div>

      <div className="flex flex-wrap gap-2 mb-5">
        {cats.map(c => (
          <button key={c} onClick={() => setFilter(c)} className={`px-3 py-1.5 text-[10px] tracking-[0.18em] rounded-full transition uppercase ${filter === c ? "bg-[#7a9a6e] text-white" : "border border-stone-200 text-stone-500 hover:border-[#7a9a6e]"}`}>{c}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div className={`p-12 text-center italic ${themeMuted} text-sm`}>{t("No phrases match. Try a different search.", lang)}</div>
      ) : (
        <div className="space-y-3">
          {filtered.map(p => (
            <div key={p.id} className={`rounded-lg border ${themePanel} p-5 group`}>
              <div className="grid lg:grid-cols-2 gap-5">
                <div>
                  <div className="text-[10px] tracking-[0.2em] text-stone-400 mb-2">{t("INSTEAD OF", lang)}</div>
                  <div className="text-sm text-stone-500 italic font-serif" style={{ fontFamily: "Georgia, serif" }}>"{p.from}"</div>
                </div>
                <div className="border-l-2 border-[#a8c090] pl-5">
                  <div className="text-[10px] tracking-[0.2em] text-[#5b7351] mb-2">{t("SAY THIS", lang)}</div>
                  <div className="font-serif text-base text-stone-900" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>"{p.to}"</div>
                </div>
              </div>
              <div className="flex items-end justify-between gap-3 mt-4 pt-3 border-t border-stone-100">
                <div className="flex-1 min-w-0">
                  {p.why && <div className="text-xs text-stone-500 italic">{p.why}</div>}
                  <div className="text-[10px] tracking-wider text-[#7a9a6e] mt-1">{p.cat.toUpperCase()}{p.custom && " · " + t("YOURS", lang)}</div>
                </div>
                {p.custom && (
                  <button onClick={() => removeCustom(p.id)} className="p-1.5 text-stone-400 hover:text-rose-500 opacity-0 group-hover:opacity-100" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      <Modal open={open} onClose={() => setOpen(false)} title={t("Add your own phrase", lang)} dark={dark}>
        <p className={`text-xs ${themeMuted} mb-3`}>{t("The reframes you're working on. The way you'd rather say it.", lang)}</p>
        <div className="space-y-3">
          <SelectField label="Category" value={form.cat} onChange={v => setForm({ ...form, cat: v })} options={cats.filter(c => c !== "All")} dark={dark} />
          <TextField label={t("What you'd usually say", lang)} value={form.from} onChange={v => setForm({ ...form, from: v })} dark={dark} placeholder="I'm so swamped right now" />
          <TextField label={t("The refined version", lang)} value={form.to} onChange={v => setForm({ ...form, to: v })} dark={dark} placeholder="My calendar is full this week — let's reconnect Friday" />
          <div>
            <label className={`text-xs ${themeMuted}`}>{t("Why it works (optional)", lang)}</label>
            <textarea value={form.why} onChange={e => setForm({ ...form, why: e.target.value })} rows={2} className="mt-1 w-full px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
          </div>
          <button onClick={addPhrase} className="w-full py-2 bg-[#7a9a6e] text-white font-medium rounded hover:bg-[#5b7351]">{t("Save phrase", lang)}</button>
        </div>
      </Modal>
    </div>
  );
}

// BOUNDARIES MODULE — expectations, deal breakers, non-negotiables
// ============================================================
function BoundariesModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const b = data.boundaries || { expectations: [], dealBreakers: [], nonNegotiables: [] };
  const customBoundaries = Array.isArray(data.customBoundaries) ? data.customBoundaries : [];

  const update = (key, list) => setData({ ...data, boundaries: { ...b, [key]: list } });

  // Custom user-created boundary panels
  const addCustomBoundary = () => {
    const id = (customBoundaries.length ? Math.max(0, ...customBoundaries.map(p => p.id || 0)) : 0) + 1;
    setData({
      ...data,
      customBoundaries: [...customBoundaries, {
        id,
        title: t("New boundary", lang),
        subtitle: t("What this line is about.", lang),
        color: "#7a9a6e",
        list: [],
      }],
    });
  };
  const updateCustomBoundary = (id, patch) => {
    setData({ ...data, customBoundaries: customBoundaries.map(p => p.id === id ? { ...p, ...patch } : p) });
  };
  const removeCustomBoundary = (id) => {
    if (!confirm(t("Delete this section and everything in it?", lang))) return;
    setData({ ...data, customBoundaries: customBoundaries.filter(p => p.id !== id) });
  };

  const ListPanel = ({ title, subtitle, list, onSave, color, icon: Icon, editableTitle, onTitleChange, onSubtitleChange, onDelete }) => {
    const [text, setText] = useState("");
    const add = () => {
      if (!text.trim()) return;
      onSave([...list, { id: Date.now(), text: text.trim() }]);
      setText("");
    };
    const remove = (id) => onSave(list.filter(i => i.id !== id));
    return (
      <div className={`rounded-2xl border ${themePanel} p-5 group`}>
        <div className="flex items-start gap-3 mb-4">
          <div className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: color + "20" }}>
            <Icon className="w-5 h-5" style={{ color }} />
          </div>
          <div className="flex-1 min-w-0">
            {editableTitle ? (
              <input
                value={title}
                onChange={e => onTitleChange(e.target.value)}
                placeholder={t("Title…", lang)}
                className="w-full font-serif text-xl bg-transparent border-0 outline-none focus:bg-[#f4f7ee] focus:px-2 focus:py-1 focus:rounded transition-all"
                style={{ fontFamily: "'Playfair Display', Georgia, serif", color }}
              />
            ) : (
              <h3 className="font-serif text-xl" style={{ fontFamily: "'Playfair Display', Georgia, serif", color }}>{title}</h3>
            )}
            {onSubtitleChange ? (
              <input
                value={subtitle}
                onChange={e => onSubtitleChange(e.target.value)}
                placeholder={t("Short hint…", lang)}
                className={`w-full text-xs ${themeMuted} italic bg-transparent border-0 outline-none focus:bg-[#f4f7ee] focus:px-2 focus:py-1 focus:rounded transition-all`}
              />
            ) : (
              <p className={`text-xs ${themeMuted} italic`}>{subtitle}</p>
            )}
          </div>
          {onDelete && (
            <button onClick={onDelete} className="p-1 text-stone-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition" title={t("Delete this section", lang)}>
              <Trash2 className="w-4 h-4" />
            </button>
          )}
        </div>
        <div className="space-y-2 mb-3">
          {list.length === 0 ? (
            <div className={`text-xs ${themeMuted} py-6 text-center border border-dashed border-stone-200 rounded italic`}>{t("Add your first one below.", lang)}</div>
          ) : list.map(item => (
            <div key={item.id} className="flex items-start gap-2 p-3 rounded border border-stone-200 bg-white group/item">
              <div className="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style={{ background: color }} />
              <span className="flex-1 text-sm leading-relaxed">{item.text}</span>
              <button onClick={() => remove(item.id)} className="p-1 text-stone-400 hover:text-rose-500 opacity-0 group-hover/item:opacity-100"><X className="w-3.5 h-3.5" /></button>
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={text} onChange={e => setText(e.target.value)} onKeyDown={e => { if (e.key === "Enter") add(); }} placeholder={t("Type and press Enter…", lang)} className="flex-1 px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
          <button onClick={add} className="px-3 py-2 text-white text-sm rounded font-medium" style={{ background: color }}><Plus className="w-3.5 h-3.5" /></button>
        </div>
      </div>
    );
  };

  return (
    <div>
      <PageHeader title={t("Boundaries", lang)} subtitle={t("What you accept. What you don't. The line you don't cross.", lang)} dark={dark}
        action={
          <button onClick={addCustomBoundary} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm font-medium rounded hover:bg-[#5b7351] flex items-center gap-1.5">
            <Plus className="w-4 h-4" /> {t("New section", lang)}
          </button>
        } />

      <div className="grid lg:grid-cols-3 gap-5">
        <ListPanel
          title={t("Expectations", lang)}
          subtitle={t("What you expect of yourself and others.", lang)}
          list={b.expectations}
          onSave={(list) => update("expectations", list)}
          color="#7a9a6e"
          icon={Target}
        />
        <ListPanel
          title={t("Deal Breakers", lang)}
          subtitle={t("Behaviors that end the conversation. Period.", lang)}
          list={b.dealBreakers}
          onSave={(list) => update("dealBreakers", list)}
          color="#3f3f46"
          icon={X}
        />
        <ListPanel
          title={t("Non-Negotiables", lang)}
          subtitle={t("Things you don't compromise on. Ever.", lang)}
          list={b.nonNegotiables}
          onSave={(list) => update("nonNegotiables", list)}
          color="#a16207"
          icon={Lock}
        />
        {customBoundaries.map(p => (
          <ListPanel
            key={p.id}
            title={p.title}
            subtitle={p.subtitle}
            list={Array.isArray(p.list) ? p.list : []}
            onSave={(list) => updateCustomBoundary(p.id, { list })}
            color={p.color || "#7a9a6e"}
            icon={Sparkles}
            editableTitle={true}
            onTitleChange={(title) => updateCustomBoundary(p.id, { title })}
            onSubtitleChange={(subtitle) => updateCustomBoundary(p.id, { subtitle })}
            onDelete={() => removeCustomBoundary(p.id)}
          />
        ))}
        {/* Add-another tile */}
        <button
          onClick={addCustomBoundary}
          className="rounded-2xl border-2 border-dashed border-[#a8c090] p-5 hover:bg-[#f4f7ee]/40 transition flex flex-col items-center justify-center text-center min-h-[240px] group"
        >
          <div className="w-12 h-12 rounded-full bg-[#f4f7ee] flex items-center justify-center mb-3 group-hover:bg-[#a8c090]/30">
            <Plus className="w-6 h-6 text-[#5b7351]" />
          </div>
          <div className="font-serif text-base text-[#5b7351]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("Add another section", lang)}</div>
          <p className="text-xs italic text-stone-500 mt-1" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{t("any line you want to hold", lang)}</p>
        </button>
      </div>
    </div>
  );
}

const CRED_CATEGORIES = ["Personal", "Banking", "Social", "Work", "Shopping", "Streaming", "Insurance", "Other"];

function CredentialsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const creds = data.credentials || [];
  const [open, setOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("All");
  // Reset the category filter when the language toggles so we don't keep an
  // English filter value that no longer matches any Spanish category.
  useEffect(() => { setFilter("All"); }, [lang]);
  const [showId, setShowId] = useState(null); // which item's password is shown
  const blank = { site: "", url: "", username: "", password: "", category: "Personal", notes: "" };
  const [form, setForm] = useState(blank);

  const filtered = creds.filter(c => {
    const m = (c.site + c.username + c.url + c.notes).toLowerCase().includes(search.toLowerCase());
    const f = filter === "All" || c.category === filter;
    return m && f;
  });

  const save = () => {
    if (!form.site) return;
    if (editing) setData({ ...data, credentials: creds.map(c => c.id === editing ? { ...form, id: editing } : c) });
    else { const id = Math.max(0, ...creds.map(c => c.id || 0)) + 1; setData({ ...data, credentials: [...creds, { ...form, id }] }); triggerConfetti(t("Saved", lang)); }
    setOpen(false); setEditing(null); setForm(blank);
  };
  const del = (id) => {
    if (!confirm(t("Delete this credential?", lang))) return;
    setData({ ...data, credentials: creds.filter(c => c.id !== id) });
  };
  const copy = (text, label) => {
    navigator.clipboard?.writeText(text || "").then(() => triggerConfetti(t(label === t("Username", lang) ? "Username copied" : "Password copied", lang)));
  };
  const generatePassword = (len = 16) => {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";
    let p = "";
    for (let i = 0; i < len; i++) p += chars[Math.floor(Math.random() * chars.length)];
    setForm({ ...form, password: p });
  };

  const cats = ["All", ...CRED_CATEGORIES];
  const hostInitial = (s) => (s || "?")[0]?.toUpperCase() || "?";

  return (
    <div>
      <PageHeader title={t("Logins & Passwords", lang)} subtitle={t("A private vault for the credentials you actually use", lang)} dark={dark}
        action={<AddButton onClick={() => { setForm(blank); setEditing(null); setOpen(true); }} label={t("Add login", lang)} dark={dark} />} />

      {/* Privacy notice */}
      <div className="mb-5 p-3 rounded-lg border border-amber-200 bg-amber-50/50 text-xs text-amber-900 flex items-start gap-2">
        <Shield className="w-4 h-4 flex-shrink-0 mt-0.5" />
        <div>
          {t("Stored locally on this device only — never sent to a server. For sensitive accounts (banking, email recovery) consider a dedicated password manager. This vault is great for keeping things organized.", lang)}
        </div>
      </div>

      <div className="flex flex-wrap gap-2 mb-4">
        <div className="flex items-center gap-2 px-3 py-1.5 rounded border border-stone-300 bg-white text-sm flex-1 min-w-[200px]">
          <Search className="w-4 h-4 text-stone-500" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder={t("Search sites, usernames…", lang)} className="bg-transparent outline-none flex-1" />
        </div>
        {cats.map(c => (
          <button key={c} onClick={() => setFilter(c)} className={`px-3 py-1.5 text-xs rounded border ${filter === c ? "bg-[#7a9a6e] text-white border-[#7a9a6e] font-medium" : "border-stone-300 text-stone-600 hover:border-[#7a9a6e]"}`}>{c}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div className={`p-12 text-center rounded-lg border ${themePanel} ${themeMuted}`}>
          <Lock className="w-10 h-10 mx-auto mb-2 opacity-50" />
          <div className="text-sm">{creds.length === 0 ? t("No logins saved yet. Add your first one.", lang) : t("No logins match your filter.", lang)}</div>
        </div>
      ) : (
        <div className="grid md:grid-cols-2 gap-3">
          {filtered.map(c => {
            const isShown = showId === c.id;
            return (
              <div key={c.id} className={`p-4 rounded-lg border ${themePanel} group`}>
                <div className="flex items-center gap-3 mb-3">
                  <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-[#a8c090] to-[#5b7351] flex items-center justify-center text-white font-bold flex-shrink-0">
                    {hostInitial(c.site)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-medium truncate">{c.site}</div>
                    {c.url && <a href={c.url.startsWith("http") ? c.url : `https://${c.url}`} target="_blank" rel="noreferrer" className="text-xs text-stone-500 truncate hover:text-[#5b7351] block">{c.url}</a>}
                  </div>
                  <span className="text-[10px] tracking-wider px-1.5 py-0.5 rounded bg-[#f4f7ee] text-[#5b7351] flex-shrink-0">{t(c.category, lang)}</span>
                </div>

                <div className="space-y-2 mb-3">
                  <div className="flex items-center gap-2 p-2 rounded bg-stone-50 border border-stone-200">

function VisionImagePicker({ form, setForm, themeMuted, lang }) {
  const [urlInput, setUrlInput] = useState(form.img && !form.img.startsWith("data:") ? form.img : "");
  const [imgError, setImgError] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(() => { setImgError(false); }, [form.img]);

  const onPick = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      alert(t("Pick an image under 10MB please.", lang));
      return;
    }
    setBusy(true);
    try {
      const compressed = await compressImage(file, { maxWidth: 800, quality: 0.82 });
      setForm({ ...form, img: compressed });
      setUrlInput("");
    } catch (err) {
      alert(t("Could not process that image.", lang));
    } finally {
      setBusy(false);
    }
  };

  const useUrl = () => {
    if (urlInput.trim()) {
      setForm({ ...form, img: urlInput.trim() });
      setImgError(false);
    }
  };

  return (
    <div>
      <label className={`text-xs ${themeMuted}`}>{t("Picture", lang)}</label>
      <div className="mt-1 space-y-2">
        {form.img && !imgError ? (
          <div className="relative group">
            <img
              src={form.img}
              alt="preview"
              className="w-full h-48 object-cover rounded border border-stone-200"
              onError={() => setImgError(true)}
            />
            <button onClick={() => { setForm({ ...form, img: "" }); setUrlInput(""); }} className="absolute top-2 right-2 px-2 py-1 bg-white/90 backdrop-blur text-xs rounded border border-stone-200 hover:bg-rose-50 hover:border-rose-300 hover:text-rose-600 transition flex items-center gap-1">
              <X className="w-3 h-3" /> {t("Remove", lang)}
            </button>
          </div>
        ) : (
          <label className={`flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded cursor-pointer transition ${busy ? "border-[#7a9a6e] bg-[#f4f7ee]" : "border-stone-300 hover:border-[#7a9a6e] hover:bg-[#f4f7ee]"}`}>
            <ImageIcon className={`w-7 h-7 mb-2 ${busy ? "text-[#7a9a6e] animate-pulse" : "text-stone-400"}`} />
            <span className="text-sm text-stone-600 font-medium">{busy ? t("Compressing…", lang) : t("Click to upload picture", lang)}</span>
            <span className="text-[10px] text-stone-500 mt-1">{t("Auto-compressed to ~800px wide so storage stays light", lang)}</span>
            <input type="file" accept="image/*" className="hidden" onChange={onPick} disabled={busy} />
          </label>
        )}

        {imgError && form.img && (
          <div className="p-2 rounded bg-rose-50 border border-rose-200 text-xs text-rose-700">
            {t("That URL didn't load. Try a different link or upload a file.", lang)}
          </div>
        )}

        <details className="text-xs" open={!form.img}>
          <summary className={`cursor-pointer ${themeMuted} hover:text-[#5b7351]`}>{t("Or paste an image URL", lang)}</summary>
          <div className="mt-2 flex gap-2">
            <input
              value={urlInput}
              onChange={e => setUrlInput(e.target.value)}
              placeholder="https://…"
              className="flex-1 px-3 py-2 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
            />
            <button onClick={useUrl} disabled={!urlInput.trim()} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm rounded hover:bg-[#5b7351] disabled:opacity-40">{t("Use URL", lang)}</button>
          </div>
          <p className="text-[10px] text-stone-500 mt-1">{t("Tip: right-click an image online, \"Copy image address,\" then paste here.", lang)}</p>
        </details>
      </div>
    </div>
  );
}

function AnimatedNumber({ value, prefix = "", suffix = "" }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    let raf; const start = performance.now(); const dur = 1000;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / dur);
      setN(value * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <>{prefix}{Math.round(n).toLocaleString()}{suffix}</>;
}

// PERSONAL EFFORT LEADERBOARD — contact-tracker style

function LeaderboardModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const acts = data.activities || [];
  const contacts = Array.isArray(data.leaderboardContacts) ? data.leaderboardContacts : [];

  const today = todayISO();
  const now = new Date();
  // Start of current ISO week (Monday)
  const weekStart = (() => { const d = new Date(); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return toLocalISO(d); })();
  const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-01`;
  const yearStart = `${now.getFullYear()}-01-01`;

  const inRange = (date, start) => (date || "") >= start;
  const countByType = (typeId, start, contactId = null) =>
    acts.filter(a => a.type === typeId && inRange(a.date, start) && (contactId == null || a.contactId === contactId))
        .reduce((s, a) => s + (a.count || 1), 0);

  const blankContactForm = { name: "", phone: "", category: ACTIVITY_TYPES[0].id, contactDate: today, note: "" };
  const [contactForm, setContactForm] = useState(blankContactForm);
  const [editingContactId, setEditingContactId] = useState(null);
  const [contactEditForm, setContactEditForm] = useState({ name: "", phone: "", contactDate: "", note: "" });

  const addContact = () => {
    const name = (contactForm.name || "").trim();
    const phone = (contactForm.phone || "").trim();
    const note = (contactForm.note || "").trim();
    const contactDate = contactForm.contactDate || today;
    const category = contactForm.category || ACTIVITY_TYPES[0].id;
    if (!name) return;
    const contactId = (contacts.length ? Math.max(0, ...contacts.map(c => Number(c.id) || 0)) : 0) + 1;
    const t = ACTIVITY_TYPES.find(x => x.id === category) || ACTIVITY_TYPES[0];
    const actId = (acts.length ? Math.max(0, ...acts.map(a => Number(a.id) || 0)) : 0) + 1;
    setData({
      ...data,
      leaderboardContacts: [...contacts, { id: contactId, name, phone, contactDate, note }],
      activities: [...acts, { id: actId, type: category, count: 1, date: contactDate, points: t.points, contactId }],
    });
    setContactForm({ ...blankContactForm, contactDate: today });
  };
  const removeContact = (id) => {
    if (!confirm("Delete this contact and all their tracked activities?")) return;
    setData({ ...data, leaderboardContacts: contacts.filter(c => c.id !== id), activities: acts.filter(a => a.contactId !== id) });
  };
  const startEditContact = (c) => { setEditingContactId(c.id); setContactEditForm({ name: c.name || "", phone: c.phone || "", contactDate: c.contactDate || today, note: c.note || "" }); };
  const saveEditContact = () => {
    const name = (contactEditForm.name || "").trim();
    const phone = (contactEditForm.phone || "").trim();
    const contactDate = contactEditForm.contactDate || "";
    const note = (contactEditForm.note || "").trim();
    if (!name) return;
    setData({ ...data, leaderboardContacts: contacts.map(c => c.id === editingContactId ? { ...c, name, phone, contactDate, note } : c) });
    setEditingContactId(null);
    setContactEditForm({ name: "", phone: "", contactDate: "", note: "" });
  };

  const bumpActivity = (contactId, typeId, delta) => {
    const t = ACTIVITY_TYPES.find(x => x.id === typeId);
    if (!t) return;
    const todaysForContact = acts.find(a => a.date === today && a.type === typeId && a.contactId === contactId);
    if (todaysForContact) {
      const newCount = Math.max(0, (todaysForContact.count || 0) + delta);
      if (newCount === 0) {
        setData({ ...data, activities: acts.filter(a => a.id !== todaysForContact.id) });
      } else {
        setData({ ...data, activities: acts.map(a => a.id === todaysForContact.id ? { ...a, count: newCount } : a) });
      }
    } else if (delta > 0) {
      const id = (acts.length ? Math.max(0, ...acts.map(a => Number(a.id) || 0)) : 0) + 1;
      setData({ ...data, activities: [...acts, { id, type: typeId, count: delta, date: today, points: t.points, contactId }] });
    }
  };

  const clearAllMetrics = () => {
    if (!confirm("Reset ALL metrics — every activity, every contact, every count back to zero?")) return;
    if (!confirm("Last chance — this can't be undone.")) return;
    setData({ ...data, activities: [], leaderboardContacts: [] });
  };

  return (
    <div>
      <PageHeader title="Personal Effort Leaderboard" subtitle="Track every action. Compound the wins." dark={dark}
        action={
          <button onClick={clearAllMetrics} className="px-3 py-2 border border-stone-300 hover:border-rose-400 hover:text-rose-600 hover:bg-rose-50 text-sm rounded flex items-center gap-1.5" title="Reset all activities and contacts to zero">
            <RefreshCw className="w-4 h-4" /> Clear all
          </button>
        } />

      {/* LINE 1 — period totals */}
      <div className="grid grid-cols-3 gap-3 mb-3">
        {[
          { id: "week", label: "WEEK", start: weekStart },
          { id: "mtd", label: "MONTH TO DATE", start: monthStart },
          { id: "ytd", label: "YEAR TO DATE", start: yearStart },
        ].map(p => {
          const totalAll = ACTIVITY_TYPES.reduce((s, t) => s + countByType(t.id, p.start), 0);
          return (
            <div key={p.id} className="rounded-lg p-3 text-center" style={{ background: "#3d5c34", color: "#f1ebda" }}>
              <div className="text-[10px] tracking-[0.18em]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{p.label}</div>
              <div className="font-serif text-2xl mt-0.5" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{totalAll}</div>
            </div>
          );
        })}
      </div>

      {/* LINE 2 — activity totals (all-time) */}
      <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2 mb-6">
        {ACTIVITY_TYPES.map(t => {
          const Icon = t.icon;
          const count = acts.filter(a => a.type === t.id).reduce((s, a) => s + (a.count || 1), 0);
          return (
            <div key={t.id} className="rounded-lg p-3 text-center border border-stone-200 bg-white">
              <Icon className={`w-4 h-4 mx-auto mb-1 ${t.color}`} />
              <div className="text-[9px] tracking-wider text-stone-500">{t.label.toUpperCase()}</div>
              <div className="font-serif text-xl text-[#5b7351] mt-0.5" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{count}</div>
            </div>
          );
        })}
      </div>

      {/* CONTACT TRACKER — add contact, then check off activities per contact */}
      <Panel title="Contacts — check off what you did with each person" dark={dark}>
        <div className="space-y-2 mb-4">
          <div className="grid grid-cols-[1.5fr_1fr_1.2fr_140px] gap-2">
            <input
              value={contactForm.name}
              onChange={e => setContactForm({ ...contactForm, name: e.target.value })}
              onKeyDown={e => e.key === "Enter" && addContact()}
              placeholder="Name"
              className="px-3 py-2.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
            />
            <input
              value={contactForm.phone}
              onChange={e => setContactForm({ ...contactForm, phone: e.target.value })}
              onKeyDown={e => e.key === "Enter" && addContact()}
              placeholder="Phone (optional)"
              className="px-3 py-2.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
            />
            <select
              value={contactForm.category}
              onChange={e => setContactForm({ ...contactForm, category: e.target.value })}
              className="px-3 py-2.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
              title="What did you do with this person?"
            >
              {ACTIVITY_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
            <input
              type="date"
              value={contactForm.contactDate}
              onChange={e => setContactForm({ ...contactForm, contactDate: e.target.value })}
              className="px-3 py-2.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white font-mono"
              title="Date of contact"
            />
          </div>
          <div className="grid grid-cols-[1fr_auto] gap-2">
            <input
              value={contactForm.note}
              onChange={e => setContactForm({ ...contactForm, note: e.target.value })}
              onKeyDown={e => e.key === "Enter" && addContact()}
              placeholder="How did you meet them? (e.g., referral from Marcus, IG DM, networking event…)"
              className="px-3 py-2.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white"
            />
            <button onClick={addContact} className="px-6 py-2.5 rounded text-white font-medium flex items-center justify-center gap-1" style={{ background: "#3d5c34" }} title="Add contact + log one of that type">
              <Plus className="w-4 h-4" /> Add
            </button>
          </div>
        </div>

        {contacts.length === 0 ? (
          <div className={`p-8 text-center italic ${themeMuted} text-sm`}>No contacts yet. Add a name above to start tracking.</div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-[10px] tracking-wider text-stone-500">
                  <th className="text-left p-2 sticky left-0 bg-white">NAME</th>
                  <th className="text-left p-2">PHONE</th>
                  {ACTIVITY_TYPES.map(t => (
                    <th key={t.id} className="text-center p-2 whitespace-nowrap" title={t.label}>
                      <div className="flex flex-col items-center">
                        <t.icon className={`w-4 h-4 ${t.color}`} />
                        <span className="text-[9px] mt-0.5">{t.label.split(" ")[0].toUpperCase()}</span>
                      </div>
                    </th>
                  ))}
                  <th className="p-2"></th>
                </tr>
              </thead>
              <tbody>
                {[...contacts].sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0)).map(c => (
                  <tr key={c.id} className="border-t border-stone-100 group">
                    {editingContactId === c.id ? (
                      <>
                        <td className="p-2" colSpan={2 + ACTIVITY_TYPES.length + 1}>
                          <div className="grid grid-cols-[1.5fr_1fr_1fr] gap-2 mb-2">
                            <input value={contactEditForm.name} onChange={e => setContactEditForm({ ...contactEditForm, name: e.target.value })} onKeyDown={e => { if (e.key === "Enter") saveEditContact(); if (e.key === "Escape") setEditingContactId(null); }} placeholder="Name" className="px-2 py-1.5 rounded border border-[#7a9a6e] text-sm bg-white" autoFocus />
                            <input value={contactEditForm.phone} onChange={e => setContactEditForm({ ...contactEditForm, phone: e.target.value })} placeholder="Phone" className="px-2 py-1.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white" />
                            <input type="date" value={contactEditForm.contactDate} onChange={e => setContactEditForm({ ...contactEditForm, contactDate: e.target.value })} className="px-2 py-1.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white font-mono" />
                          </div>
                          <input value={contactEditForm.note} onChange={e => setContactEditForm({ ...contactEditForm, note: e.target.value })} onKeyDown={e => { if (e.key === "Enter") saveEditContact(); if (e.key === "Escape") setEditingContactId(null); }} placeholder="How you met them…" className="w-full px-2 py-1.5 rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm bg-white mb-2" />
                          <div className="text-right">
                            <button onClick={saveEditContact} className="px-3 py-1 bg-[#7a9a6e] text-white text-xs rounded mr-1">Save</button>
                            <button onClick={() => setEditingContactId(null)} className="px-3 py-1 border border-stone-200 text-xs rounded">Cancel</button>
                          </div>
                        </td>
                      </>
                    ) : (
                      <>
                        <td className="p-2 font-medium text-sm sticky left-0 bg-white group-hover:bg-[#f4f7ee]/40 min-w-[160px]">
                          <div>{c.name}</div>
                          {c.contactDate && <div className="text-[10px] text-stone-400 font-mono font-normal">{fmtDate(c.contactDate)}</div>}
                        </td>
                        <td className="p-2 text-xs text-stone-500 whitespace-nowrap min-w-[140px]">
                          <div className="font-mono">{c.phone}</div>
                          {c.note && <div className="text-[10px] text-stone-400 italic max-w-[180px] truncate" title={c.note}>{c.note}</div>}
                        </td>
                        {ACTIVITY_TYPES.map(t => {
                          const total = countByType(t.id, "0000-00-00", c.id); // all-time count
                          const done = total > 0;
                          return (
                            <td key={t.id} className="p-1 text-center align-middle">
                              <button
                                onClick={() => bumpActivity(c.id, t.id, 1)}
                                onContextMenu={(e) => { e.preventDefault(); bumpActivity(c.id, t.id, -1); }}
                                title={`Click to add · right-click to undo · ${total} so far`}
                                className={`w-9 h-9 rounded-full mx-auto inline-flex items-center justify-center text-xs font-bold leading-none transition border-2 ${done ? "bg-[#7a9a6e] border-[#7a9a6e] text-white hover:bg-[#5b7351] hover:border-[#5b7351]" : "bg-white border-stone-200 text-stone-300 hover:border-[#7a9a6e] hover:text-[#7a9a6e] hover:bg-[#f4f7ee]"}`}
                              >
                                {done ? total : ""}
                              </button>
                            </td>
                          );
                        })}
                        <td className="p-2 text-right whitespace-nowrap opacity-0 group-hover:opacity-100">
                          <button onClick={() => startEditContact(c)} className="p-1 text-stone-400 hover:text-[#5b7351]" title="Edit"><Edit2 className="w-3.5 h-3.5" /></button>
                          <button onClick={() => removeContact(c.id)} className="p-1 text-stone-400 hover:text-rose-500" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>
                        </td>
                      </>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
            <p className="text-[10px] text-stone-400 italic mt-2">Click a circle to log one. Right-click to undo. The number is the total times you've done it with that person.</p>
          </div>
        )}
      </Panel>
    </div>
  );
}

// HOME / DASHBOARD MODULE
// ============================================================
const ACTIVITY_TYPES = [
  { id: "call", label: "Call made", points: 5, icon: Phone, color: "text-sky-400" },
  { id: "appt", label: "Appointment set", points: 15, icon: Calendar, color: "text-[#9cb88f]" },
  { id: "quote", label: "Quote sent", points: 10, icon: FileText, color: "text-[#9cb88f]" },
  { id: "policy", label: "Policy sold", points: 100, icon: Trophy, color: "text-[#9cb88f]" },
  { id: "prospect", label: "Prospect", points: 5, icon: UserPlus, color: "text-sky-400" },
  { id: "recruit", label: "Recruits", points: 25, icon: UserPlus, color: "text-[#9cb88f]" },
  { id: "post", label: "Social post", points: 8, icon: Share2, color: "text-rose-400" },
  { id: "followup", label: "Follow-up done", points: 5, icon: RefreshCw, color: "text-sky-400" },
];

function HomeModule({ data, setData, user, dark, triggerConfetti, themePanel, themeMuted, setActive }) {
  const [logOpen, setLogOpen] = useState(false);
  // Counts for each activity type during a single batch log
  const [logCounts, setLogCounts] = useState(() =>
    Object.fromEntries(ACTIVITY_TYPES.map(t => [t.id, 0]))
  );

  const today = todayISO();
  const week = (() => { const d = new Date(); d.setDate(d.getDate() - 7); return toLocalISO(d); })();
  const month = (() => { const d = new Date(); d.setDate(d.getDate() - 30); return toLocalISO(d); })();

  const acts = data.activities || [];
  const todayActs = acts.filter(a => a.date === today);
  const weekActs = acts.filter(a => a.date >= week);
  const monthActs = acts.filter(a => a.date >= month);
  const todayPts = todayActs.reduce((s, a) => s + a.points * a.count, 0);
  const weekPts = weekActs.reduce((s, a) => s + a.points * a.count, 0);

  // Streak: consecutive days with activity, ending today or yesterday
  const streak = (() => {
    const dates = new Set(acts.map(a => a.date));
    let s = 0; const d = new Date();
    while (dates.has(toLocalISO(d))) { s++; d.setDate(d.getDate() - 1); }
    return s;
  })();

  const mtdRevenue = data.revenueData.at(-1)?.revenue || 0;
  const ytdRevenue = data.revenueData.reduce((s, r) => s + (r.revenue || 0), 0);
  const activeClients = data.clients.filter(c => c.status === "active").length;
  const pendingTasks = data.tasks.filter(t => !t.done).length;
  const pipeline = data.clients.filter(c => ["lead", "quoted"].includes(c.status)).reduce((s, c) => s + (c.coverage || 0) * 0.001, 0);
  const socialReach = Object.values(data.social).reduce((s, p) => s + p.reach, 0);
  const teamProd = data.team.reduce((s, t) => s + t.mtd, 0);

  const weeklyData = (() => {
    const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    return days.map((d, i) => {
      const date = (() => { const x = new Date(); x.setDate(x.getDate() - (6 - i)); return toLocalISO(x); })();
      const pts = acts.filter(a => a.date === date).reduce((s, a) => s + a.points * a.count, 0);
      return { day: d, points: pts };
    });
  })();

  const logBatch = () => {
    const newEntries = [];
    let nextId = Math.max(0, ...acts.map(a => a.id)) + 1;
    ACTIVITY_TYPES.forEach(t => {
      const c = parseInt(logCounts[t.id], 10) || 0;
      if (c > 0) {
        newEntries.push({ id: nextId++, type: t.id, count: c, date: today, points: t.points });
      }
    });
    if (newEntries.length === 0) { setLogOpen(false); return; }
    setData({ ...data, activities: [...acts, ...newEntries] });
    setLogOpen(false);
    // Reset counts but DO NOT trigger confetti — saved for end-of-day
    setLogCounts(Object.fromEntries(ACTIVITY_TYPES.map(t => [t.id, 0])));
  };

  const dayDone = () => {
    const totalToday = todayActs.reduce((s, a) => s + a.count, 0);
    const totalPoints = todayPts;
    const message = totalPoints > 200
      ? `🔥 ${totalPoints} POINTS · ${totalToday} actions · CHAMPION DAY`
      : totalPoints > 100
      ? `💪 ${totalPoints} POINTS · ${totalToday} actions · Solid work`
      : totalPoints > 0
      ? `✓ ${totalPoints} POINTS · ${totalToday} actions logged`
      : "Day closed. Rest. Tomorrow we run it back.";
    triggerConfetti(message, true);
  };

  // group today's activities by type
  const todayByType = ACTIVITY_TYPES.map(t => ({
    ...t,
    count: todayActs.filter(a => a.type === t.id).reduce((s, a) => s + a.count, 0),
    pts: todayActs.filter(a => a.type === t.id).reduce((s, a) => s + a.points * a.count, 0),
  }));

  const sortedToday = [...todayByType].sort((a, b) => b.pts - a.pts);
  const dateStr = fmtDate(todayISO());

  return (
    <div>
      <div className="flex items-start justify-between mb-6 gap-4">
        <div>
          <h1 className="font-serif text-4xl tracking-tight" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>Welcome back, <span className="text-[#9cb88f]">{(user.name || "").split(" ")[0]}</span></h1>
          <p className={`text-sm mt-1 ${themeMuted}`}>{dateStr}</p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button onClick={() => setActive("leaderboard")} className="px-3 py-2 bg-[#7a9a6e] text-white text-sm font-medium rounded hover:bg-[#5b7351] flex items-center gap-1.5"><Plus className="w-4 h-4" /> Log Activity</button>
          <button onClick={() => setActive("clients")} className={`px-3 py-2 border ${dark ? "border-stone-200 hover:border-[#7a9a6e]" : "border-stone-300 hover:border-[#7a9a6e]"} text-sm rounded flex items-center gap-1.5`}><Users className="w-4 h-4" /> Add Client</button>
          <button onClick={dayDone} className="px-4 py-2 bg-gradient-to-br from-[#7a9a6e] to-[#5b7351] text-white text-sm font-bold rounded hover:from-[#5b7351] hover:to-[#4a5d3f] shadow-lg shadow-[#7a9a6e]/30 flex items-center gap-1.5">
            <Check className="w-4 h-4" /> My Day Is Done
          </button>
        </div>
      </div>

      {/* TOP STATS */}
      <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6">
        <StatCard label="Revenue MTD" value={<><span className="text-2xl">$</span><AnimatedNumber value={mtdRevenue} /></>} sub="this month" accent="amber" dark={dark} icon={DollarSign} onClick={() => setActive("financials")} />
        <StatCard label="Revenue YTD" value={<><span className="text-2xl">$</span><AnimatedNumber value={ytdRevenue} /></>} sub="year to date" accent="amber" dark={dark} icon={DollarSign} onClick={() => setActive("financials")} />
        <StatCard label="Active Clients" value={<AnimatedNumber value={activeClients} />} sub={`${data.clients.length} total`} accent="emerald" dark={dark} icon={Users} onClick={() => setActive("clients")} />
        <StatCard label="Pending Tasks" value={<AnimatedNumber value={pendingTasks} />} sub="Today" accent="rose" dark={dark} icon={CheckSquare} onClick={() => setActive("tasks")} />
        <StatCard label="Pipeline" value={<><span className="text-2xl">$</span><AnimatedNumber value={Math.round(pipeline)} suffix="K" /></>} sub="Quoted + leads" accent="amber" dark={dark} icon={TrendingUp} onClick={() => setActive("clients")} />
        <StatCard label="Social Reach" value={<AnimatedNumber value={socialReach} />} sub="Last 7 days" accent="sky" dark={dark} icon={Share2} onClick={() => setActive("social")} />
        <StatCard label="Team Prod." value={<><span className="text-2xl">$</span><AnimatedNumber value={teamProd} /></>} sub="MTD combined" accent="emerald" dark={dark} icon={Trophy} onClick={() => setActive("team")} />
      </div>

      {/* MAIN GRID */}
      <div className="grid lg:grid-cols-3 gap-5">
        {/* PERSONAL EFFORT LEADERBOARD */}
        <div className="lg:col-span-2">
          <div className={`rounded-lg border ${themePanel}`}>
            <div className={`flex items-center justify-between p-4 border-b ${dark ? "border-stone-200" : "border-stone-200"}`}>
              <div className="flex items-center gap-3">
                <Trophy className="w-5 h-5 text-[#9cb88f]" />
                <div>
                  <h3 className="font-semibold tracking-wide">Personal Effort Leaderboard</h3>
                  <div className={`text-xs ${themeMuted}`}>Track every action. Compound the wins.</div>
                </div>
              </div>
              <div className="flex items-center gap-3 text-xs">
                <div className="flex items-center gap-1.5 px-2 py-1 rounded bg-[#9cb88f]/10 text-[#9cb88f]">
                  <Flame className="w-3 h-3" /> <span className="font-mono font-bold">{streak} day streak</span>
                </div>
                <button onClick={() => setActive("leaderboard")} className="px-2 py-1 border border-stone-200 hover:border-[#7a9a6e] text-stone-600 hover:text-[#5b7351] text-xs rounded font-medium flex items-center gap-1">Open <ChevronRight className="w-3 h-3" /></button>
              </div>
            </div>
            <div className="p-4">
              <div className="grid grid-cols-3 gap-3 mb-5">
                <div className={`p-3 rounded ${dark ? "bg-white" : "bg-stone-50"} border ${dark ? "border-stone-200" : "border-stone-200"}`}>
                  <div className="text-[10px] tracking-wider text-stone-500">TODAY</div>
                  <div className="font-serif text-2xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{todayPts}</div>
                  <div className="text-[10px] text-stone-500">{todayActs.length} actions</div>
                </div>
                <div className={`p-3 rounded ${dark ? "bg-white" : "bg-stone-50"} border ${dark ? "border-stone-200" : "border-stone-200"}`}>
                  <div className="text-[10px] tracking-wider text-stone-500">THIS WEEK</div>
                  <div className="font-serif text-2xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{weekPts}</div>
                  <div className="text-[10px] text-stone-500">{weekActs.length} actions · rank #2</div>
                </div>
                <div className={`p-3 rounded ${dark ? "bg-white" : "bg-stone-50"} border ${dark ? "border-stone-200" : "border-stone-200"}`}>
                  <div className="text-[10px] tracking-wider text-stone-500">MTD</div>
                  <div className="font-serif text-2xl" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{monthActs.reduce((s, a) => s + a.points * a.count, 0)}</div>
                  <div className="text-[10px] text-stone-500">{monthActs.length} actions</div>
                </div>
              </div>

              <div className="space-y-1">
                {sortedToday.map((t, idx) => {
                  const Icon = t.icon;
                  const medal = idx === 0 && t.count > 0 ? "🥇" : idx === 1 && t.count > 0 ? "🥈" : idx === 2 && t.count > 0 ? "🥉" : "";
                  return (
                    <div key={t.id} className={`flex items-center gap-3 px-3 py-2 rounded ${t.count > 0 ? (dark ? "bg-white border border-stone-200" : "bg-stone-50 border border-stone-200") : "opacity-60"}`}>
                      <Icon className={`w-4 h-4 ${t.color} flex-shrink-0`} />
                      <span className="flex-1 text-sm">{t.label} {medal}</span>
                      <span className={`text-xs ${themeMuted} font-mono w-20 text-right`}>{fmtDate(today)}</span>
                      <span className="text-xs font-mono text-[#9cb88f] w-12 text-right">+{t.pts}</span>
                      <span className={`text-sm font-mono font-bold w-8 text-right ${dark ? "text-stone-800" : "text-stone-900"}`}>{t.count}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>

        {/* WEEKLY CHART + ACTIVITY FEED */}
        <div className="space-y-5">
          <Panel title="Effort This Week" dark={dark}>
            <ResponsiveContainer width="100%" height={150}>
              <AreaChart data={weeklyData}>
                <defs>
                  <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#7a9a6e" stopOpacity={0.5} />
                    <stop offset="100%" stopColor="#7a9a6e" stopOpacity={0} />
                  </linearGradient>
                </defs>
                <XAxis dataKey="day" stroke={dark ? "#57534e" : "#a8a29e"} fontSize={10} />
                <YAxis stroke={dark ? "#57534e" : "#a8a29e"} fontSize={10} />
                <Tooltip contentStyle={{ background: dark ? "#1c1917" : "#fff", border: "1px solid #57534e", fontSize: 12 }} />
                <Area type="monotone" dataKey="points" stroke="#7a9a6e" fill="url(#g1)" strokeWidth={2} />
              </AreaChart>
            </ResponsiveContainer>
          </Panel>

          <Panel title="Recent Activity" dark={dark}>
            <div className="space-y-2 text-xs">
              {acts.slice(-6).reverse().map(a => {
                const t = ACTIVITY_TYPES.find(x => x.id === a.type);
                if (!t) return null;
                const Icon = t.icon;
                return (
                  <div key={a.id} className="flex items-center gap-2">
                    <Icon className={`w-3.5 h-3.5 ${t.color}`} />
                    <span className="flex-1">{t.label} {a.count > 1 && `× ${a.count}`}</span>
                    <span className={`${themeMuted} font-mono`}>{fmtDate(a.date)}</span>
                  </div>
                );
              })}
            </div>
          </Panel>
        </div>
      </div>

      <Modal open={logOpen} onClose={() => setLogOpen(false)} title="Log Today's Activity" dark={dark}>
        <div className="space-y-2">
          <p className={`text-xs ${themeMuted} mb-3`}>Log everything you did today in one shot. Set counts for each, hit save.</p>
          {ACTIVITY_TYPES.map(t => {
            const Icon = t.icon;
            const c = parseInt(logCounts[t.id], 10) || 0;
            return (
              <div key={t.id} className={`flex items-center gap-3 p-2.5 rounded border ${c > 0 ? "border-[#7a9a6e] bg-[#f4f7ee]" : "border-stone-200"}`}>
                <Icon className={`w-4 h-4 ${t.color} flex-shrink-0`} />
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium truncate">{t.label}</div>
                  <div className="text-[10px] text-stone-500">+{t.points} pts each</div>
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={() => setLogCounts({ ...logCounts, [t.id]: Math.max(0, c - 1) })} className="w-7 h-7 rounded border border-stone-200 hover:border-[#7a9a6e] hover:bg-white text-stone-600 flex items-center justify-center font-bold">−</button>
                  <input
                    type="number"
                    min="0"
                    value={c}
                    onChange={e => setLogCounts({ ...logCounts, [t.id]: parseInt(e.target.value, 10) || 0 })}
                    className="w-12 px-1 py-1 text-center rounded border border-stone-200 focus:border-[#7a9a6e] outline-none text-sm font-mono bg-white"
                  />
                  <button onClick={() => setLogCounts({ ...logCounts, [t.id]: c + 1 })} className="w-7 h-7 rounded border border-stone-200 hover:border-[#7a9a6e] hover:bg-white text-stone-600 flex items-center justify-center font-bold">+</button>
                </div>
                <div className="w-14 text-right text-sm font-mono text-[#7a9a6e]">+{t.points * c}</div>
              </div>
            );
          })}
          <div className="flex items-center justify-between p-3 rounded bg-[#f4f7ee] mt-3">
            <span className="text-sm font-medium">Total to add</span>
            <span className="font-serif text-2xl text-[#5b7351]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>
              +{ACTIVITY_TYPES.reduce((s, t) => s + (parseInt(logCounts[t.id], 10) || 0) * t.points, 0)} pts
            </span>
          </div>
          <button onClick={logBatch} className="w-full py-2.5 bg-[#7a9a6e] text-white font-medium rounded hover:bg-[#5b7351] mt-2">
            Save activities
          </button>
        </div>
      </Modal>
    </div>
  );
}

function ClientsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");
  const [editing, setEditing] = useState(null);
  const [open, setOpen] = useState(false);
  const blank = { name: "", phone: "", email: "", policy: "", premium: 0, coverage: 0, status: "lead", birthday: "", source: "referral", tags: [], notes: "", lastContact: todayISO() };
  const [form, setForm] = useState(blank);

  const filtered = data.clients.filter(c => {
    const m = (c.name + c.email + c.phone).toLowerCase().includes(search.toLowerCase());
    const f = filter === "all" || c.status === filter;
    return m && f;
  });

  const save = () => {
    if (!form.name) return;
    if (editing) {
      setData({ ...data, clients: data.clients.map(c => c.id === editing ? { ...form, id: editing } : c) });
    } else {
      const id = Math.max(0, ...data.clients.map(c => c.id)) + 1;
      setData({ ...data, clients: [...data.clients, { ...form, id }] });
      triggerConfetti("✓ Client added!");
    }
    setOpen(false); setEditing(null); setForm(blank);
  };

  const del = (id) => setData({ ...data, clients: data.clients.filter(c => c.id !== id) });

  const startEdit = (c) => { setForm(c); setEditing(c.id); setOpen(true); };
  const startNew = () => { setForm(blank); setEditing(null); setOpen(true); };

  const statusBadge = (s) => {
    const map = { lead: "bg-sky-500/10 text-sky-400 border-sky-500/30", quoted: "bg-[#9cb88f]/10 text-[#9cb88f] border-[#9cb88f]/30", active: "bg-[#9cb88f]/10 text-[#9cb88f] border-[#9cb88f]/30", lapsed: "bg-rose-500/10 text-rose-400 border-rose-500/30" };
    return <span className={`px-2 py-0.5 text-[10px] rounded border ${map[s]} capitalize tracking-wider`}>{s}</span>;
  };

  return (
    <div>
      <PageHeader title="Clients" subtitle={`${data.clients.length} contacts in your book`} dark={dark}
        action={<AddButton onClick={startNew} label="Add Client" dark={dark} />} />

      <div className="flex flex-wrap gap-2 mb-4">
        <div className={`flex items-center gap-2 px-3 py-1.5 rounded border ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"} text-sm flex-1 min-w-[200px]`}>
          <Search className="w-4 h-4 text-stone-500" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search clients…" className="bg-transparent outline-none flex-1" />
        </div>
        {["all", ...CLIENT_STATUSES].map(s => (
          <button key={s} onClick={() => setFilter(s)} className={`px-3 py-1.5 text-xs rounded border capitalize ${filter === s ? "bg-[#9cb88f] text-stone-950 border-[#9cb88f] font-medium" : dark ? "border-stone-200 text-stone-400 hover:border-[#9cb88f]" : "border-stone-300 text-stone-600 hover:border-[#9cb88f]"}`}>{s}</button>
        ))}
      </div>

      <div className={`rounded-lg border ${themePanel} overflow-hidden`}>
        <table className="w-full text-sm">
          <thead className={`${dark ? "bg-white/50" : "bg-stone-50"} text-[10px] tracking-wider ${themeMuted}`}>
            <tr>
              <th className="text-left p-3">CLIENT</th>
              <th className="text-left p-3 hidden md:table-cell">POLICY</th>
              <th className="text-right p-3 hidden md:table-cell">PREMIUM</th>
              <th className="text-right p-3 hidden lg:table-cell">COVERAGE</th>
              <th className="text-left p-3">STATUS</th>
              <th className="text-left p-3 hidden lg:table-cell">SOURCE</th>
              <th className="text-left p-3 hidden xl:table-cell">LAST CONTACT</th>
              <th className="p-3"></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(c => (
              <tr key={c.id} className={`border-t ${dark ? "border-stone-200 hover:bg-white/40" : "border-stone-200 hover:bg-stone-50"} transition`}>
                <td className="p-3">
                  <div className="font-medium">{c.name}</div>
                  <div className={`text-xs ${themeMuted}`}>{c.phone} · {c.email}</div>
                  {c.tags?.length > 0 && (
                    <div className="flex gap-1 mt-1">
                      {c.tags.map(t => <span key={t} className="text-[9px] px-1.5 py-0.5 rounded bg-[#9cb88f]/10 text-[#9cb88f]">{t}</span>)}
                    </div>
                  )}
                </td>
                <td className="p-3 hidden md:table-cell">{c.policy}</td>
                <td className="p-3 hidden md:table-cell text-right font-mono text-[#9cb88f]">${c.premium}/mo</td>
                <td className="p-3 hidden lg:table-cell text-right font-mono">${(c.coverage || 0).toLocaleString()}</td>
                <td className="p-3">{statusBadge(c.status)}</td>
                <td className={`p-3 hidden lg:table-cell text-xs ${themeMuted}`}>{c.source}</td>
                <td className={`p-3 hidden xl:table-cell text-xs ${themeMuted} font-mono`}>{c.lastContact}</td>
                <td className="p-3">
                  <div className="flex gap-1 justify-end">
                    <button onClick={() => startEdit(c)} className={`p-1.5 rounded ${dark ? "hover:bg-stone-100" : "hover:bg-stone-100"}`}><Edit2 className="w-3.5 h-3.5" /></button>
                    <button onClick={() => del(c.id)} className="p-1.5 rounded hover:bg-rose-500/10 hover:text-rose-400"><Trash2 className="w-3.5 h-3.5" /></button>
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan={8} className={`p-8 text-center ${themeMuted}`}>No clients found.</td></tr>}
          </tbody>
        </table>
      </div>

      <Modal open={open} onClose={() => setOpen(false)} title={editing ? "Edit Client" : "Add Client"} dark={dark}>
        <div className="grid grid-cols-2 gap-3">
          <TextField label="Name" value={form.name} onChange={v => setForm({ ...form, name: v })} dark={dark} />
          <TextField label="Phone" value={form.phone} onChange={v => setForm({ ...form, phone: v })} dark={dark} />
          <TextField label="Email" value={form.email} onChange={v => setForm({ ...form, email: v })} dark={dark} />
          <TextField label="Birthday" value={form.birthday} onChange={v => setForm({ ...form, birthday: v })} type="date" dark={dark} />
          <TextField label="Policy" value={form.policy} onChange={v => setForm({ ...form, policy: v })} dark={dark} placeholder="Type the policy/product name…" />
          <SelectField label="Status" value={form.status} onChange={v => setForm({ ...form, status: v })} options={CLIENT_STATUSES} dark={dark} />
          <TextField label="Premium ($/mo)" value={form.premium} onChange={v => setForm({ ...form, premium: parseFloat(v) || 0 })} type="number" dark={dark} />
          <TextField label="Coverage ($)" value={form.coverage} onChange={v => setForm({ ...form, coverage: parseFloat(v) || 0 })} type="number" dark={dark} />
          <SelectField label="Source" value={form.source} onChange={v => setForm({ ...form, source: v })} options={["referral", "social", "cold", "lead-vendor"]} dark={dark} />
          <TextField label="Last contact" value={form.lastContact} onChange={v => setForm({ ...form, lastContact: v })} type="date" dark={dark} />
        </div>
        <div className="mt-3">
          <label className={`text-xs ${themeMuted}`}>Notes</label>
          <textarea value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} rows={3} className={`mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"}`} />
        </div>
        <div className="mt-3">
          <label className={`text-xs ${themeMuted}`}>Tags (comma-separated)</label>
          <input value={(form.tags || []).join(", ")} onChange={e => setForm({ ...form, tags: e.target.value.split(",").map(t => t.trim()).filter(Boolean) })} className={`mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"}`} />
        </div>
        <button onClick={save} className="w-full mt-4 py-2 bg-[#9cb88f] text-stone-950 font-medium rounded hover:bg-[#a8c090]">{editing ? "Save changes" : "Add client"}</button>
      </Modal>
    </div>
  );
}

// ============================================================
// RECRUITS MODULE — Kanban
// ============================================================
function RecruitsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const [open, setOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const blank = { name: "", recruiter: "", phone: "", email: "", state: "", licenseNo: "", isClient: false, stage: "non-licensed", startDate: todayISO(), production: 0, level: "", notes: "" };
  const [form, setForm] = useState(blank);

  const save = () => {
    if (!form.name) return;
    if (editing) setData({ ...data, recruits: data.recruits.map(r => r.id === editing ? { ...form, id: editing } : r) });
    else {
      const id = (data.recruits.length ? Math.max(0, ...data.recruits.map(r => Number(r.id) || 0)) : 0) + 1;
      setData({ ...data, recruits: [...data.recruits, { ...form, id }] });
    }
    setOpen(false); setEditing(null); setForm(blank);
  };
  const del = (id) => {
    if (!confirm("Remove this recruit?")) return;
    setData({ ...data, recruits: data.recruits.filter(r => r.id !== id) });
  };
  const move = (id, stage) => setData({ ...data, recruits: data.recruits.map(r => r.id === id ? { ...r, stage } : r) });

  const totalProd = data.recruits.reduce((s, r) => s + (r.production || 0), 0);
  const licensedCount = data.recruits.filter(r => ["licensed", "active"].includes(r.stage)).length;
  const conversion = data.recruits.length === 0 ? 0 : Math.round(licensedCount / data.recruits.length * 100);

  const clearAllRecruits = () => {
    if (!confirm("Clear ALL recruits from the tracker?")) return;
    if (!confirm("Last chance — every recruit will be wiped.")) return;
    setData({ ...data, recruits: [] });
  };

  return (
    <div>
      <PageHeader title="Recruit Tracker" subtitle="Build the team that runs without you" dark={dark}
        action={
          <div className="flex gap-2 flex-wrap">
            <button onClick={clearAllRecruits} className="px-3 py-2 border border-stone-300 hover:border-rose-400 hover:text-rose-600 hover:bg-rose-50 text-sm rounded flex items-center gap-1.5"><RefreshCw className="w-4 h-4" /> {t("Clear all", lang)}</button>
            <AddButton onClick={() => { setForm(blank); setEditing(null); setOpen(true); }} label="Add Recruit" dark={dark} />
          </div>
        } />

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <StatCard label="Total Recruits" value={<AnimatedNumber value={data.recruits.length} />} dark={dark} icon={Users} />
        <StatCard label="Licensed" value={<AnimatedNumber value={licensedCount} />} accent="emerald" dark={dark} icon={Award} />
        <StatCard label="Conversion" value={<AnimatedNumber value={conversion} suffix="%" />} accent="amber" dark={dark} icon={TrendingUp} />
        <StatCard label="Production" value={<><span className="text-2xl">$</span><AnimatedNumber value={totalProd} /></>} accent="emerald" dark={dark} icon={DollarSign} />
      </div>

      <Panel title="Recruits" dark={dark} action={
        <button onClick={() => { setForm(blank); setEditing(null); setOpen(true); }} className="text-xs text-[#5b7351] hover:underline flex items-center gap-1"><Plus className="w-3 h-3" /> Add recruit</button>
      }>
        {data.recruits.length === 0 ? (
          <div className={`p-8 text-center italic ${themeMuted} text-sm`}>No recruits yet. Click "Add Recruit" to start your roster.</div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-[10px] tracking-wider text-stone-500 border-b border-stone-200">
                  <th className="text-left p-2 whitespace-nowrap">DATE</th>
                  <th className="text-left p-2 whitespace-nowrap">NAME</th>
                  <th className="text-left p-2 whitespace-nowrap">RECRUITER</th>
                  <th className="text-left p-2 whitespace-nowrap">PHONE</th>
                  <th className="text-left p-2 whitespace-nowrap">EMAIL</th>
                  <th className="text-left p-2 whitespace-nowrap">STATE</th>
                  <th className="text-left p-2 whitespace-nowrap">LICENSE #</th>
                  <th className="text-left p-2 whitespace-nowrap">STAGE</th>
                  <th className="text-center p-2 whitespace-nowrap">CLIENT</th>
                  <th className="text-right p-2 whitespace-nowrap">PROD.</th>
                  <th className="p-2 w-20"></th>
                </tr>
              </thead>
              <tbody>
                {[...data.recruits].sort((a, b) => (b.startDate || "").localeCompare(a.startDate || "") || ((Number(b.id) || 0) - (Number(a.id) || 0))).map(r => (
                  <tr key={r.id} className="border-b border-stone-100 hover:bg-[#f4f7ee]/40 group">
                    <td className="p-2 font-mono text-xs text-stone-500 whitespace-nowrap">{r.startDate ? fmtDate(r.startDate) : "—"}</td>
                    <td className="p-2 font-medium whitespace-nowrap">{r.name}</td>
                    <td className="p-2 text-xs text-stone-600 whitespace-nowrap">{r.recruiter || "—"}</td>
                    <td className="p-2 text-xs text-stone-600 whitespace-nowrap">{r.phone || "—"}</td>
                    <td className="p-2 text-xs text-stone-600 whitespace-nowrap max-w-[180px] truncate" title={r.email}>{r.email || "—"}</td>
                    <td className="p-2 whitespace-nowrap">{r.state ? <span className="px-1.5 py-0.5 rounded bg-stone-100 text-stone-700 text-[10px] font-mono">{r.state}</span> : <span className="text-stone-300">—</span>}</td>
                    <td className="p-2 text-xs font-mono text-stone-600 whitespace-nowrap">{r.licenseNo || "—"}</td>
                    <td className="p-2 whitespace-nowrap">
                      <select value={r.stage} onChange={e => move(r.id, e.target.value)} className="text-[10px] rounded px-1.5 py-0.5 bg-white border border-stone-200 hover:border-[#7a9a6e] outline-none capitalize">
                        {RECRUIT_STAGES.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                    <td className="p-2 text-center">{r.isClient ? <span className="text-[9px] tracking-wider px-1.5 py-0.5 rounded bg-[#f4f7ee] text-[#5b7351]">YES</span> : <span className="text-stone-300">—</span>}</td>
                    <td className="p-2 text-right font-mono text-xs whitespace-nowrap">{r.production > 0 ? <span className="text-[#9cb88f]">${r.production.toLocaleString()}</span> : <span className="text-stone-300">—</span>}</td>
                    <td className="p-2 text-right whitespace-nowrap opacity-0 group-hover:opacity-100 transition">
                      <button onClick={() => { setForm({ ...blank, ...r }); setEditing(r.id); setOpen(true); }} className="p-1 text-stone-400 hover:text-[#5b7351]" title="Edit"><Edit2 className="w-3.5 h-3.5" /></button>
                      <button onClick={() => del(r.id)} className="p-1 text-stone-400 hover:text-rose-500" title="Delete"><Trash2 className="w-3.5 h-3.5" /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Panel>

      <Modal open={open} onClose={() => setOpen(false)} title={editing ? "Edit Recruit" : "Add Recruit"} dark={dark}>
        <div className="grid grid-cols-2 gap-3">
          <TextField label="Date" value={form.startDate} onChange={v => setForm({ ...form, startDate: v })} type="date" dark={dark} />
          <TextField label="Name" value={form.name} onChange={v => setForm({ ...form, name: v })} dark={dark} />
          <TextField label="Recruiter" value={form.recruiter} onChange={v => setForm({ ...form, recruiter: v })} dark={dark} placeholder="Who recruited them" />
          <TextField label="Phone" value={form.phone} onChange={v => setForm({ ...form, phone: v })} dark={dark} />
          <TextField label="Email" value={form.email} onChange={v => setForm({ ...form, email: v })} type="email" dark={dark} />
          <TextField label="State" value={form.state} onChange={v => setForm({ ...form, state: v })} dark={dark} placeholder="e.g., GA, FL, CA" />
          <TextField label="License #" value={form.licenseNo} onChange={v => setForm({ ...form, licenseNo: v })} dark={dark} placeholder="Insurance license number" />
          <SelectField label="Stage" value={form.stage} onChange={v => setForm({ ...form, stage: v })} options={RECRUIT_STAGES} dark={dark} />
          <TextField label="Title (optional)" value={form.level} onChange={v => setForm({ ...form, level: v })} dark={dark} placeholder="Type any title…" />
          <TextField label="Production ($)" value={form.production} onChange={v => setForm({ ...form, production: parseFloat(v) || 0 })} type="number" dark={dark} />
        </div>
        <label className="flex items-center gap-2 mt-3 p-3 rounded border border-stone-200 cursor-pointer hover:border-[#7a9a6e]">
          <input type="checkbox" checked={!!form.isClient} onChange={e => setForm({ ...form, isClient: e.target.checked })} className="accent-[#7a9a6e] w-4 h-4" />
          <div>
            <div className="text-sm font-medium">Also a client</div>
            <div className="text-xs text-stone-500">Check if this person is also a paying client</div>
          </div>
        </label>
        <div className="mt-3">
          <label className={`text-xs ${themeMuted}`}>Notes</label>
          <textarea value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} rows={3} className="mt-1 w-full px-3 py-2 rounded border border-stone-300 outline-none focus:border-[#7a9a6e] text-sm bg-white" />
        </div>
        <button onClick={save} className="w-full mt-4 py-2 bg-[#9cb88f] text-stone-950 font-medium rounded hover:bg-[#a8c090]">{editing ? "Save" : "Add"}</button>
      </Modal>
    </div>
  );
}
