const OBJECTIONS = [
  // ---- LIFE INSURANCE / SALES ----
  { id: 1, category: "Life Insurance", text: "I can't afford it", best: "Lead with empathy. 'I hear you — and that's exactly why most families need this. Let me ask you this: if something happened to you next week, what would your family afford instead?' Then re-frame to a smaller policy or term." },
  { id: 2, category: "Sales", text: "I need to think about it", best: "'I respect that — this deserves a real decision, not a snap one. To help me follow up properly: what specifically are you turning over? Sometimes \"I need to think about it\" means \"I'm 80% there and want to test the price one more time\" and sometimes it means \"I have a real concern I haven't told you yet.\" Which is closer to true here?'" },
  { id: 3, category: "Life Insurance", text: "I already have coverage", best: "'That's great — you've already proven you take this seriously. When was the last time someone reviewed it with you? A lot has changed in the last 5 years. Worst case, you confirm you have the best policy. Best case, we save you money.'" },
  { id: 4, category: "Life Insurance", text: "I'll do it later", best: "'I understand. The challenge is that life insurance gets more expensive every year and harder to qualify for after a diagnosis. The best time to lock this in was 5 years ago. The second best is today.'" },
  { id: 5, category: "Trust", text: "I don't trust [companies/people] in your industry", best: "'That's fair — and probably earned, not invented. So I want to ask the question that matters most: what specifically made you lose trust? If I tell you we're different and don't address what actually went wrong, I'm just hoping you'll forget. And you won't. Tell me the story and let me show you whether anything is genuinely different here.'" },
  { id: 6, category: "Pricing", text: "It's too expensive", best: "'I appreciate you saying it directly. Let me ask what you mean by \"too expensive\" — too expensive compared to what? If it's a budget you already had, that's one conversation. If it's an alternative, that's another. If it's a gut feeling, that usually means I haven't done a good enough job showing you the value yet — and that's on me.'" },
  { id: 7, category: "Life Insurance", text: "I'm too young/healthy", best: "'You're exactly right — and that's why now is the cheapest it'll ever be. We're not insuring against today, we're locking in the best rate of your life today, before something changes.'" },
  { id: 8, category: "Decision-Making", text: "Let me talk to my spouse / partner", best: "'Of course — and the people you trust deserve to be in the room. The hardest part of this conversation is telephone-game: I tell you, you tell them, and 30% of the nuance gets lost. Would it serve you better if we had a 15-minute three-way call so they can ask me directly? I'd rather earn the answer in one conversation than bounce back and forth for two weeks.'" },
  { id: 9, category: "Sales", text: "Just send me information", best: "'I'd be happy to — but I want to make sure I send you the right thing, because information without context is usually misleading. Three minutes: what's the actual problem you're trying to solve? Then I send something that maps to your situation instead of a generic packet that just creates more questions.'" },

  // ---- NEGOTIATION / PRICING ----
  { id: 10, category: "Negotiation", text: "Your competitor offered me 30% less for the same thing", best: "'I appreciate you sharing that — and I'd consider it too if everything were equal. Help me understand: is it line-by-line capability that's identical, or just the headline number? The difference between two solutions is rarely what's in the brochure — it's what happens when something goes wrong at 11pm and you need someone to actually pick up. What matters more to you over the next three years: saving 30% upfront, or knowing you have a partner who'll be there if things go sideways?'" },
  { id: 11, category: "Pricing", text: "Can you do it for less?", best: "'I can — and I should be honest about what \"less\" would mean. There are three levers we can pull: scope, speed, or partnership terms. Which one would you want to flex? Because the worst outcome is I cut the price and you end up with a deliverable that doesn't actually solve the problem. Then I've cost you twice.'" },
  { id: 12, category: "Pricing", text: "Send me your pricing first", best: "'I will. But pricing without context tends to be misleading — same number can be a steal or a rip-off depending on the problem. Three quick questions and I'll send you a number that's actually meaningful for your situation, not a generic sheet you'll have to interpret on your own.'" },
  { id: 13, category: "Negotiation", text: "We don't have budget for this", best: "'I respect budget discipline — every well-run organization has it. May I ask: is the issue that there's no money allocated, or that this hasn't earned a place in the existing allocation yet? Those are different conversations. If it's the second, it's worth knowing what the cost of inaction looks like — not the cost of buying, but the cost of not.'" },

  // ---- DECISION-MAKING / COMMITMENT ----
  { id: 14, category: "Decision-Making", text: "I'm not ready to commit", best: "'You're being honest — I value that. \"Commitment\" is a heavy word, and probably the wrong one for where we are. Forget commitment. What's the smallest reversible step that would tell you whether this is actually right? Sometimes the way to get unstuck on a big decision is to make a small one first.'" },
  { id: 15, category: "Decision-Making", text: "We're going in a different direction", best: "'Understood — I won't try to talk you out of a decision that's been made. Two things, then I'll respect your call. First, what tipped the decision the other way? An honest answer helps me get better. Second, if anything changes — six weeks or six months — what's the cleanest way to come back to me?'" },
  { id: 16, category: "Decision-Making", text: "We tried something like this before and it didn't work", best: "'I'd want to know that too if I were you, so I won't wave it away. Help me understand: what specifically didn't work — the implementation, the partner, the fit with your team, or the underlying premise? If it's the premise, this is a quick conversation and we should both move on. If it's the execution, that's a different problem and we can talk about whether anything's actually different here.'" },
  { id: 17, category: "Decision-Making", text: "We've already invested too much in our current solution to change", best: "'That's the sunk-cost question, and it's the right one to wrestle with. But here's the harder version: if you were starting fresh today, would you choose what you have? If the honest answer is no, the question isn't whether the past investment is gone — it is, regardless. The real question is what the next two years cost you in opportunity if you stay.'" },

  // ---- LEADERSHIP / CAREER / DIFFICULT CONVERSATIONS ----
  { id: 18, category: "Leadership", text: "I don't think you're qualified for this", best: "'Fair — qualifications are signal, and you don't have a lot of signal on me yet. So rather than arguing I'm qualified, let me ask: what does qualified look like to you in this role? If it's experience, I can show you what I've done. If it's a way of thinking, give me a problem and I'll show you how I'd solve it. I'd rather lose to evidence than win on a paper credential.'" },
  { id: 19, category: "Leadership", text: "We need to push the deadline", best: "'I'd rather know now than at the deadline, so thank you for raising it. Help me understand which way this cuts: scope that grew, capacity that shrunk, or something external? Each leads to different fixes. And one practical question — what's the actual cost of slipping versus the cost of cutting scope and hitting the original date? \"We need more time\" is sometimes the wrong fix.'" },
  { id: 20, category: "Leadership", text: "Why didn't you tell me this sooner?", best: "'You're right to ask, and I owe you a real answer, not an excuse. Here's what I knew, when I knew it, and why I didn't bring it earlier. What I'd like to figure out with you is what \"sooner\" would have changed, and how we set this up so it doesn't happen again. Apology first — but the apology only matters if the system changes.'" },
  { id: 21, category: "Leadership", text: "I'm not the decision-maker", best: "'Got it — and thank you for being upfront. The worst thing I can do is build conviction with the wrong person and then try to transfer it. Two questions: who is the decision-maker, and what's the role you play in their process? Because equipping you to advocate is a different conversation from talking to them directly.'" },

  // ---- TRUST / VALUE ----
  { id: 22, category: "Trust", text: "Why should I trust you?", best: "'You shouldn't. Not yet. Trust is earned in small bets, not pitched in big ones. So instead of asking you to trust me, let me show you what I'd do — give me one specific problem you're facing, and let me walk through how I'd approach it. You can judge me on the work, not the words.'" },
  { id: 23, category: "Trust", text: "I don't believe the numbers you're showing me", best: "'Good. You shouldn't believe them just because I said them. What would make these numbers real to you — talking to a client they came from, seeing the methodology, or running a small pilot to generate your own data? Tell me which builds the most credibility for you, and let's do that.'" },
  { id: 24, category: "Sales", text: "I don't see the value", best: "'That's actually really useful feedback — because if you don't see it, I haven't shown it. Let me try this differently: what would value look like to you? If this thing was working perfectly six months from now, what's different about your day, your team, your numbers? Once we know that, we can figure out together whether what I'm offering actually gets you there.'" },
  { id: 25, category: "Sales", text: "I want to wait and see results from another company first", best: "'Smart instinct — nobody wants to be the test case. Real question: what would \"results from another company\" tell you that a deep look at our actual data wouldn't? Waiting for someone else's success usually means losing 12 months while they get the head start. There's a way to de-risk this without watching from the bleachers.'" },

  // ---- TIME / PRIORITIES ----
  { id: 26, category: "Sales", text: "I don't have time for this", best: "'I hear you, and I won't insult that. Real question though: is the issue that you don't have time for this conversation, or that you don't have time for the work this would create if it were a yes? Those are very different. The first is a 90-second problem. The second tells me whether this actually solves a real pain or just adds to your plate.'" },
  { id: 27, category: "Decision-Making", text: "It's not a priority right now", best: "'Honest answer, and I respect it. Quick reframe: not a priority compared to what? Everyone has a top-five list, and the items below the line are usually below the line for a reason — they're not on fire. The question is whether this should be on the list at all, or whether the cost of not addressing it is one of those slow-burn problems that becomes everyone's priority once it breaks. If it's the second, today is cheaper than later.'" },
  { id: 28, category: "Sales", text: "I'm not interested", best: "'I respect that — I won't push. But I'd be doing both of us a disservice if I left without understanding why, because I'm probably making the same mistake on three other calls today. Genuinely, just for me: was it the timing, the fit, the way I came in? If you tell me what bounced, I can be a better operator next conversation. And if I'm reading something wrong, I'd like to know.'" },

  // ---- RECRUITING ----
  { id: 29, category: "Recruiting", text: "I already have a job I'm comfortable with", best: "'Comfortable is a powerful word — and rare. So I'd want to know what's behind it. Are you comfortable because the work is meaningful and you're growing, or comfortable because the day is predictable and the lift is light? Those are very different reasons to stay. The question I'd really ask is: a year from now, are you closer to the version of yourself you want to be?'" },
  { id: 30, category: "Recruiting", text: "I don't want to start over", best: "'Nobody who's good wants to start over — that's reasonable. But it's worth being precise about what you'd actually be \"starting over\" on. Most people transferring careers aren't starting over on the things that matter — discipline, judgment, relationships, the way they handle pressure. Those compound. What you're really restarting is the surface stuff: a new title, a new system. The capital you've built isn't lost — it gets re-deployed.'" },

  // ---- BOUNDARIES / DIFFICULT CONVERSATIONS ----
  { id: 31, category: "Boundaries", text: "You're being unreasonable", best: "'I might be — let me check. Help me see what you're seeing. If there's a fact I'm missing, I want it. If we're working from the same facts and arriving at different conclusions, that's worth talking about because one of us is wrong. Either way, calling each other unreasonable doesn't move us. What's the specific thing you'd want to be different?'" },
  { id: 32, category: "Boundaries", text: "Can you make an exception this one time?", best: "'I want to say yes — that's the easy answer in the moment. But \"this one time\" turns into precedent, and the next person will reasonably ask why they got the harder version of the rule. So instead: tell me what outcome you're actually trying to get to. There may be a way to honor the spirit of what you need without breaking something I'd then have to explain to someone else next week.'" },
];

function ObjectionsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const [active, setActive] = useState(OBJECTIONS[0]);
  const [response, setResponse] = useState("");
  const [score, setScore] = useState(null);
  const [showBest, setShowBest] = useState(false);
  const [filterCat, setFilterCat] = useState("All");

  const categories = ["All", ...Array.from(new Set(OBJECTIONS.map(o => o.category || "Other")))];
  const filteredObjections = filterCat === "All" ? OBJECTIONS : OBJECTIONS.filter(o => (o.category || "Other") === filterCat);

  const evaluate = () => {
    const r = response.toLowerCase();
    const empathy = ["understand", "hear you", "makes sense", "appreciate", "fair", "respect", "i get it"].filter(k => r.includes(k)).length;
    const value = ["protection", "family", "legacy", "future", "loved ones", "secure"].filter(k => r.includes(k)).length;
    const urgency = ["today", "now", "lock in", "cheaper", "younger", "healthy", "this year"].filter(k => r.includes(k)).length;
    const questions = (response.match(/\?/g) || []).length;
    const story = ["client", "story", "for example", "let me tell you", "imagine", "remember"].filter(k => r.includes(k)).length;

    const breakdown = {
      empathy: Math.min(20, empathy * 7),
      value: Math.min(25, value * 8),
      urgency: Math.min(20, urgency * 7),
      questions: Math.min(20, questions * 8),
      story: Math.min(15, story * 8),
    };
    const total = Math.min(100, Object.values(breakdown).reduce((s, v) => s + v, 0) + 10);
    setScore({ total, breakdown, response });

    const id = Math.max(0, ...(data.objectionScores || []).map(s => s.id)) + 1;
    setData({ ...data, objectionScores: [...(data.objectionScores || []), { id, date: todayISO(), score: total, objection: active.text }] });

    if (total >= 80) triggerConfetti(`🏆 Score: ${total}!`);
  };

  const reset = () => { setResponse(""); setScore(null); setShowBest(false); };

  const scoresChart = (data.objectionScores || []).map((s, i) => ({ idx: i + 1, date: s.date, score: s.score }));
  const avgScore = scoresChart.length ? Math.round(scoresChart.reduce((s, x) => s + x.score, 0) / scoresChart.length) : 0;

  return (
    <div>
      <PageHeader title="Objection Trainer" subtitle="Practice. Score. Improve." dark={dark} />

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
        <StatCard label="Practice Sessions" value={<AnimatedNumber value={scoresChart.length} />} accent="emerald" dark={dark} icon={Activity} />
        <StatCard label="Avg Score" value={<AnimatedNumber value={avgScore} />} accent="amber" dark={dark} icon={Trophy} />
        <StatCard label="Best Score" value={<AnimatedNumber value={Math.max(0, ...scoresChart.map(s => s.score))} />} accent="amber" dark={dark} icon={Award} />
        <StatCard label="Improvement" value={scoresChart.length > 1 ? `+${scoresChart.at(-1).score - scoresChart[0].score}` : "—"} accent="emerald" dark={dark} icon={TrendingUp} />
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        <Panel title="Objection Library" dark={dark}>
          <div className="flex flex-wrap gap-1 mb-3">
            {categories.map(c => (
              <button key={c} onClick={() => setFilterCat(c)} className={`px-2 py-1 text-[10px] tracking-wider rounded-full transition ${filterCat === c ? "bg-[#7a9a6e] text-white" : "border border-stone-200 text-stone-500 hover:border-[#7a9a6e]"}`}>{c.toUpperCase()}</button>
            ))}
          </div>
          <div className="space-y-1 max-h-[600px] overflow-y-auto pr-1">
            {filteredObjections.map(o => (
              <button key={o.id} onClick={() => { setActive(o); reset(); }} className={`w-full text-left px-3 py-2 rounded text-sm transition ${active.id === o.id ? "bg-[#9cb88f]/10 text-[#5b7351] border border-[#9cb88f]/30" : "hover:bg-stone-100 border border-transparent"}`}>
                <div className="flex items-start justify-between gap-2">
                  <span className="flex-1">"{o.text}"</span>
                  {o.category && <span className="text-[9px] tracking-wider text-stone-400 whitespace-nowrap">{o.category}</span>}
                </div>
              </button>
            ))}
          </div>
        </Panel>

        <div className="lg:col-span-2 space-y-5">
          <Panel title="Practice Mode" dark={dark}>
            <div className={`p-4 rounded mb-4 border-l-4 border-rose-500 ${dark ? "bg-white" : "bg-rose-50"}`}>
              <div className={`text-[10px] tracking-wider ${themeMuted} mb-1`}>OBJECTION</div>
              <div className="font-serif text-xl" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>"{active.text}"</div>
            </div>
            <textarea value={response} onChange={e => setResponse(e.target.value)} placeholder="Type your response. We'll score it on empathy, value framing, urgency, questions, and storytelling…" rows={5} className={`w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"}`} />
            <div className="flex gap-2 mt-3">
              <button onClick={evaluate} disabled={!response.trim()} className="px-4 py-2 bg-[#9cb88f] text-stone-950 text-sm font-medium rounded hover:bg-[#a8c090] disabled:opacity-50">Score My Response</button>
              <button onClick={() => setShowBest(!showBest)} className={`px-4 py-2 border ${dark ? "border-stone-300" : "border-stone-300"} text-sm rounded hover:border-[#9cb88f]`}>{showBest ? "Hide" : "Show"} best practice</button>
              <button onClick={reset} className={`px-4 py-2 border ${dark ? "border-stone-300" : "border-stone-300"} text-sm rounded hover:border-[#9cb88f]`}>Reset</button>
            </div>
            {showBest && (
              <div className={`mt-4 p-4 rounded border-l-4 border-[#9cb88f] ${dark ? "bg-white" : "bg-[#f4f7ee]"} text-sm leading-relaxed`}>
                <div className={`text-[10px] tracking-wider ${themeMuted} mb-1`}>BEST PRACTICE RESPONSE</div>
                {active.best}
              </div>
            )}
            {score && (
              <div className="mt-4 p-4 rounded border border-[#9cb88f]/40 bg-[#9cb88f]/5">
                <div className="flex items-center justify-between mb-3">
                  <div className={`text-[10px] tracking-wider text-[#9cb88f]`}>YOUR SCORE</div>
                  <div className="font-serif text-5xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{score.total}<span className="text-2xl text-stone-500">/100</span></div>
                </div>
                <div className="space-y-2">
                  {Object.entries(score.breakdown).map(([k, v]) => {
                    const max = { empathy: 20, value: 25, urgency: 20, questions: 20, story: 15 }[k];
                    return (
                      <div key={k}>
                        <div className="flex justify-between text-xs mb-1"><span className="capitalize">{k}</span><span className="font-mono">{v}/{max}</span></div>
                        <div className={`h-1.5 rounded ${dark ? "bg-stone-100" : "bg-stone-200"} overflow-hidden`}>
                          <div className="h-full bg-[#9cb88f] transition-all duration-700" style={{ width: `${(v / max) * 100}%` }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className={`text-xs mt-3 ${themeMuted}`}>
                  {score.total >= 90 && "🔥 Elite. Lock that in your script."}
                  {score.total >= 75 && score.total < 90 && "👌 Strong response. Tighten the urgency and you're golden."}
                  {score.total >= 60 && score.total < 75 && "⚡ Good base. Add an empathy opener and a question."}
                  {score.total < 60 && "💪 Keep practicing. Try framing it around protection and family."}
                </div>
              </div>
            )}
          </Panel>

          {scoresChart.length > 1 && (
            <Panel title="Score History" dark={dark}>
              <ResponsiveContainer width="100%" height={180}>
                <LineChart data={scoresChart}>
                  <CartesianGrid stroke={dark ? "#292524" : "#e7e5e4"} strokeDasharray="3 3" />
                  <XAxis dataKey="idx" stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} />
                  <YAxis domain={[0, 100]} stroke={dark ? "#57534e" : "#a8a29e"} fontSize={11} />
                  <Tooltip contentStyle={{ background: dark ? "#1c1917" : "#fff", border: "1px solid #57534e", fontSize: 12 }} />
                  <Line type="monotone" dataKey="score" stroke="#7a9a6e" strokeWidth={2.5} dot={{ fill: "#7a9a6e" }} />
                </LineChart>
              </ResponsiveContainer>
            </Panel>
          )}
        </div>
      </div>
    </div>
  );
}

function NotesModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti, lang }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const [editing, setEditing] = useState(null);
  const blank = { title: "", body: "", tags: [], pinned: false, date: todayISO(), clientId: null };
  const [form, setForm] = useState(blank);

  const notes = data.notes || [];
  const filtered = notes.filter(n => (n.title + n.body + (n.tags || []).join(" ")).toLowerCase().includes(search.toLowerCase()));
  const sorted = [...filtered].sort((a, b) => (b.pinned - a.pinned) || (new Date(b.date) - new Date(a.date)));

  const save = () => {
    if (!form.title) return;
    if (editing) setData({ ...data, notes: notes.map(n => n.id === editing ? { ...form, id: editing } : n) });
    else { const id = Math.max(0, ...notes.map(n => n.id)) + 1; setData({ ...data, notes: [...notes, { ...form, id }] }); triggerConfetti(t("✓ Note saved!", lang)); }
    setOpen(false); setEditing(null); setForm(blank);
  };
  const del = (id) => setData({ ...data, notes: notes.filter(n => n.id !== id) });
  const togglePin = (id) => setData({ ...data, notes: notes.map(n => n.id === id ? { ...n, pinned: !n.pinned } : n) });

  return (
    <div>
      <PageHeader title={t("Notes", lang)} subtitle={t("Brain dump. Tag. Pin. Find later.", lang)} dark={dark}
        action={<AddButton onClick={() => { setForm(blank); setEditing(null); setOpen(true); }} label={t("Add Note", lang)} dark={dark} />} />

      <div className={`flex items-center gap-2 px-3 py-2 rounded border ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"} mb-4`}>
        <Search className="w-4 h-4 text-stone-500" />
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder={t("Search notes…", lang)} className="bg-transparent outline-none flex-1 text-sm" />
      </div>

      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
        {sorted.map(n => (
          <div key={n.id} className={`p-4 rounded-lg border ${themePanel} relative group`}>
            {n.pinned && <Pin className="absolute top-3 right-3 w-3.5 h-3.5 text-[#9cb88f]" />}
            <div className="font-medium mb-1">{n.title}</div>
            <div className={`text-xs ${themeMuted} font-mono mb-3`}>{fmtDate(n.date)}</div>
            <div className={`text-sm whitespace-pre-line line-clamp-4 ${dark ? "text-stone-300" : "text-stone-700"}`}>{n.body}</div>
            <div className="flex gap-1 mt-3 flex-wrap">{(n.tags || []).map(t => <span key={t} className="text-[10px] px-1.5 py-0.5 rounded bg-[#9cb88f]/10 text-[#9cb88f]"><Hash className="w-2.5 h-2.5 inline" />{t}</span>)}</div>
            <div className="flex gap-1 mt-3 opacity-0 group-hover:opacity-100 transition">
              <button onClick={() => togglePin(n.id)} className={`p-1 rounded ${dark ? "hover:bg-stone-100" : "hover:bg-stone-100"}`}><Pin className="w-3.5 h-3.5" /></button>
              <button onClick={() => { setForm(n); setEditing(n.id); setOpen(true); }} className={`p-1 rounded ${dark ? "hover:bg-stone-100" : "hover:bg-stone-100"}`}><Edit2 className="w-3.5 h-3.5" /></button>
              <button onClick={() => del(n.id)} className={`p-1 rounded hover:bg-rose-500/10 hover:text-rose-400`}><Trash2 className="w-3.5 h-3.5" /></button>
            </div>
          </div>
        ))}
      </div>

      <Modal open={open} onClose={() => setOpen(false)} title={editing ? t("Edit Note", lang) : t("New Note", lang)} dark={dark}>
        <div className="space-y-3">
          <TextField label={t("Title", lang)} value={form.title} onChange={v => setForm({ ...form, title: v })} dark={dark} />
          <div>
            <label className={`text-xs ${themeMuted}`}>{t("Body", lang)}</label>
            <textarea value={form.body} onChange={e => setForm({ ...form, body: e.target.value })} rows={6} className={`mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"}`} />
          </div>
          <TextField label={t("Tags (comma-separated)", lang)} value={(form.tags || []).join(", ")} onChange={v => setForm({ ...form, tags: v.split(",").map(t => t.trim()).filter(Boolean) })} dark={dark} />
          <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={form.pinned} onChange={e => setForm({ ...form, pinned: e.target.checked })} className="accent-[#9cb88f]" /> {t("Pin to top", lang)}</label>
          <button onClick={save} className="w-full py-2 bg-[#9cb88f] text-stone-950 font-medium rounded hover:bg-[#a8c090]">{editing ? t("Save", lang) : t("Add note", lang)}</button>
        </div>
      </Modal>
    </div>
  );
}

function CalcShell({ title, inputs, result, dark }) {
  return (
    <Panel title={title} dark={dark}>
      <div className="grid md:grid-cols-2 gap-5">
        <div className="space-y-3">{inputs}</div>
        <div className={`p-5 rounded ${dark ? "bg-white" : "bg-stone-50"} flex flex-col justify-center`}>{result}</div>
      </div>
    </Panel>
  );
}
function Rule72Calc({ dark }) {
  const [rate, setRate] = useState(8);
  const years = rate ? (72 / rate).toFixed(1) : 0;
  return <CalcShell title="Rule of 72 — Years to Double" dark={dark}
    inputs={<TextField label="Annual rate (%)" value={rate} onChange={v => setRate(parseFloat(v) || 0)} type="number" dark={dark} />}
    result={<div className="text-center"><div className="text-xs tracking-wider text-stone-500 mb-2">YEARS TO DOUBLE</div><div className="font-serif text-6xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>{years}</div></div>} />;
}
function CompoundCalc({ dark }) {
  const [p, setP] = useState(10000); const [r, setR] = useState(8); const [y, setY] = useState(20); const [c, setC] = useState(200);
  const future = (() => { let bal = p; for (let i = 0; i < y; i++) { bal = bal * (1 + r / 100) + c * 12; } return bal; })();
  return <CalcShell title="Compound Interest" dark={dark}
    inputs={<><TextField label="Principal ($)" value={p} onChange={v => setP(parseFloat(v) || 0)} type="number" dark={dark} /><TextField label="Annual rate (%)" value={r} onChange={v => setR(parseFloat(v) || 0)} type="number" dark={dark} /><TextField label="Years" value={y} onChange={v => setY(parseInt(v, 10) || 0)} type="number" dark={dark} /><TextField label="Monthly contribution ($)" value={c} onChange={v => setC(parseFloat(v) || 0)} type="number" dark={dark} /></>}
    result={<div className="text-center"><div className="text-xs tracking-wider text-stone-500 mb-2">FUTURE VALUE</div><div className="font-serif text-5xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${Math.round(future).toLocaleString()}</div></div>} />;
}
function TermWholeCalc({ dark }) {
  const [coverage, setCoverage] = useState(500000); const [age, setAge] = useState(35);
  const term = Math.round(coverage * 0.0001 * (1 + (age - 30) * 0.04));
  const whole = Math.round(coverage * 0.0008 * (1 + (age - 30) * 0.06));
  return <CalcShell title="Term vs Whole Life" dark={dark}
    inputs={<><TextField label="Coverage ($)" value={coverage} onChange={v => setCoverage(parseFloat(v) || 0)} type="number" dark={dark} /><TextField label="Age" value={age} onChange={v => setAge(parseInt(v, 10) || 0)} type="number" dark={dark} /></>}
    result={<div className="space-y-3"><div><div className="text-xs text-stone-500">TERM (20yr) /mo</div><div className="font-serif text-3xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${term}</div></div><div><div className="text-xs text-stone-500">WHOLE LIFE /mo</div><div className="font-serif text-3xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${whole}</div></div><div className="text-xs text-stone-500 italic">Estimate. Actual rates vary by carrier and underwriting.</div></div>} />;
}
function HLVCalc({ dark }) {
  const [income, setIncome] = useState(80000); const [years, setYears] = useState(25); const [growth, setGrowth] = useState(3);
  const hlv = Math.round(income * years * (1 + growth / 100));
  return <CalcShell title="Human Life Value" dark={dark}
    inputs={<><TextField label="Annual income ($)" value={income} onChange={v => setIncome(parseFloat(v) || 0)} type="number" dark={dark} /><TextField label="Years to retirement" value={years} onChange={v => setYears(parseInt(v, 10) || 0)} type="number" dark={dark} /><TextField label="Income growth (%)" value={growth} onChange={v => setGrowth(parseFloat(v) || 0)} type="number" dark={dark} /></>}
    result={<div className="text-center"><div className="text-xs tracking-wider text-stone-500 mb-2">RECOMMENDED COVERAGE</div><div className="font-serif text-5xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${hlv.toLocaleString()}</div></div>} />;
}
function DIMECalc({ dark }) {
  const [d, setD] = useState(35000); const [i, setI] = useState(80000); const [m, setM] = useState(280000); const [e, setE] = useState(120000);
  const total = d + (i * 10) + m + e;
  return <CalcShell title="DIME Needs Analysis" dark={dark}
    inputs={<><TextField label="Debt ($)" value={d} onChange={v => setD(parseFloat(v) || 0)} type="number" dark={dark} /><TextField label="Annual income ($)" value={i} onChange={v => setI(parseFloat(v) || 0)} type="number" dark={dark} /><TextField label="Mortgage balance ($)" value={m} onChange={v => setM(parseFloat(v) || 0)} type="number" dark={dark} /><TextField label="Education costs ($)" value={e} onChange={v => setE(parseFloat(v) || 0)} type="number" dark={dark} /></>}
    result={<div className="text-center"><div className="text-xs tracking-wider text-stone-500 mb-2">TOTAL NEEDS</div><div className="font-serif text-5xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${total.toLocaleString()}</div><div className="text-xs text-stone-500 mt-3">Debt + (Income × 10) + Mortgage + Education</div></div>} />;
}
function PremiumCalc({ dark }) {
  const [age, setAge] = useState(35); const [coverage, setCoverage] = useState(500000); const [type, setType] = useState("Term 20"); const [smoker, setSmoker] = useState(false);
  const base = type === "Term 10" ? 0.00006 : type === "Term 20" ? 0.0001 : type === "Term 30" ? 0.00018 : 0.0008;
  const ageMult = 1 + (age - 30) * 0.05;
  const smokerMult = smoker ? 2.4 : 1;
  const premium = Math.round(coverage * base * ageMult * smokerMult);
  return <CalcShell title="Premium Estimator" dark={dark}
    inputs={<><TextField label="Age" value={age} onChange={v => setAge(parseInt(v, 10) || 0)} type="number" dark={dark} /><TextField label="Coverage ($)" value={coverage} onChange={v => setCoverage(parseFloat(v) || 0)} type="number" dark={dark} /><SelectField label="Policy type" value={type} onChange={setType} options={["Term 10", "Term 20", "Term 30", "Whole Life"]} dark={dark} /><label className="flex items-center gap-2 text-sm"><input type="checkbox" checked={smoker} onChange={e => setSmoker(e.target.checked)} className="accent-[#9cb88f]" /> Smoker</label></>}
    result={<div className="text-center"><div className="text-xs tracking-wider text-stone-500 mb-2">EST. MONTHLY PREMIUM</div><div className="font-serif text-5xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${premium}</div></div>} />;
}
function WaitingCalc({ dark }) {
  const [age, setAge] = useState(35); const [waitYears, setWaitYears] = useState(5); const [coverage, setCoverage] = useState(500000);
  const todayPrem = Math.round(coverage * 0.0001 * (1 + (age - 30) * 0.05));
  const futurePrem = Math.round(coverage * 0.0001 * (1 + (age + waitYears - 30) * 0.05));
  const lifetime = (futurePrem - todayPrem) * 12 * 20;
  return <CalcShell title="Cost of Waiting" dark={dark}
    inputs={<><TextField label="Current age" value={age} onChange={v => setAge(parseInt(v, 10) || 0)} type="number" dark={dark} /><TextField label="Years to wait" value={waitYears} onChange={v => setWaitYears(parseInt(v, 10) || 0)} type="number" dark={dark} /><TextField label="Coverage ($)" value={coverage} onChange={v => setCoverage(parseFloat(v) || 0)} type="number" dark={dark} /></>}
    result={<div><div className="text-center mb-3"><div className="text-xs text-stone-500">PREMIUM TODAY</div><div className="font-serif text-3xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${todayPrem}/mo</div></div><div className="text-center mb-3"><div className="text-xs text-stone-500">PREMIUM IN {waitYears} YEARS</div><div className="font-serif text-3xl text-rose-400" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${futurePrem}/mo</div></div><div className="text-center pt-3 border-t border-stone-200"><div className="text-xs text-stone-500">EXTRA LIFETIME COST</div><div className="font-serif text-3xl text-[#9cb88f]" style={{ fontFamily: "'Playfair Display', Georgia, serif" }}>${lifetime.toLocaleString()}</div></div></div>} />;
}

const SCRIPTS_DATA = [
  // ============ COLD CALL ============
  { id: 1, cat: "Cold Call", title: "The Pattern Interrupt Opener (27-Second Rule)", body: "Hi [Name], this is [You] with [Agency]. I know I'm calling out of nowhere — do you have 27 seconds for me to tell you why I called, and at the end you can tell me to get lost or keep talking?\n\n[PAUSE — let them say yes]\n\nThanks. I help families in [City] make sure that if something unexpected happens — illness, accident, anything — their kids' lives don't fall apart financially. Most folks don't realize how affordable real protection has become.\n\nQuick question: do you currently have any life insurance in place outside of what work gives you?\n\n[If YES] Great — when's the last time someone actually reviewed it with you to make sure it still fits?\n[If NO] That's exactly why I'm calling. Worth 15 minutes this week to see what your number could look like? I'll quote it, you'll know what's possible, and if it doesn't make sense — no pressure, no follow-up." },

  { id: 2, cat: "Cold Call", title: "Referral Warm-Up", body: "Hi [Name], this is [You] with [Agency]. [Mutual Contact] gave me your name — said you and your spouse just had a baby/bought a house/started a business and that you'd want to know what I helped them put in place.\n\nDo you have a couple minutes, or is there a better time later today?\n\n[If yes:]\nWhat I did for them is what I do for most of my clients — I sit down for 15 minutes, ask a few questions about your family and your goals, and put together a one-page plan showing exactly what protection makes sense for your situation. No fluff, no pressure. If it fits, we move forward. If it doesn't, I'm out of your hair.\n\nWhat works better for you — Tuesday at 6, or Thursday at 7?" },

  { id: 3, cat: "Cold Call", title: "Lead Vendor Follow-Up", body: "Hi [Name], this is [You] with [Agency]. I'm following up — you requested some information about life insurance online a couple days ago.\n\nIs now a bad time, or do you have a few minutes?\n\n[If they remember the form:]\nGreat. Most people fill these out and then immediately get blasted by 12 different agents. I'm not going to pitch you over the phone — what I do is the opposite. I ask 4-5 quick questions, then I'll send you actual numbers from the top carriers so you can see what your options look like. Sound fair?\n\nLet's start with the basics — are you married? Any kids?" },

  { id: 4, cat: "Cold Call", title: "The 'I Was Just Thinking About You' Approach", body: "Hi [Name], this is [You] — I know it's been a minute since we last talked. I was just sitting here updating files and your name came up. How's everything going? How's [spouse/kids' names]?\n\n[Small talk — 60 seconds]\n\nReason I called — and I won't take much of your time — a few things have changed in the industry recently and I wanted to make sure your coverage still makes sense for where your family is now. Last time we talked you mentioned [memory of conversation]. Is that still where things are at?\n\nMind if I run your numbers and see if there's anything we should tighten up?" },

  // ============ DISCOVERY ============
  { id: 5, cat: "Discovery", title: "The 8 Core Discovery Questions", body: "Before I quote anything, I need to understand your situation. There's no wrong answer — I just need to ask:\n\n1. Tell me about your family. Who's at home? Any kids? Ages?\n\n2. What do you do for a living? How long have you been there?\n\n3. If something happened to you tomorrow — and I hope it doesn't — what's the immediate financial gap your family would face? Mortgage? Income replacement? Education?\n\n4. Do you have any existing coverage? Through work or otherwise? Roughly how much?\n\n5. When you think about retirement, what does that look like for you? At what age?\n\n6. Are you currently saving anything outside of your 401(k) or work plan?\n\n7. Have you ever been quoted on whole life or IUL before? What was your impression?\n\n8. On a scale of 1-10, how important is it to you that your family is protected if something happened — and that you build wealth alongside that protection?\n\n[Listen. Take notes. The plan WRITES ITSELF from these answers.]" },

  { id: 6, cat: "Discovery", title: "The Money Conversation Frame", body: "Most people I talk to fall into one of three buckets when it comes to money. Tell me which one sounds most like you:\n\nBucket 1: 'I make decent money but it disappears every month and I'm not really saving anything outside of my 401(k).'\n\nBucket 2: 'I'm saving some, but I have no idea if I'm on track. I just know I should be doing more.'\n\nBucket 3: 'I'm intentional. I have a plan, I review it, and I want to make sure my family is locked in.'\n\nWhich one resonates?\n\n[The answer determines your entire approach. Bucket 1 = lead with protection + small habit. Bucket 2 = lead with planning + structure. Bucket 3 = lead with optimization + tax strategy.]" },

  // ============ PRESENTATION ============
  { id: 7, cat: "Presentation", title: "Whole Life Pitch — The Three-Bucket Story", body: "Let me show you how I think about this for your family.\n\nMost people only have two financial buckets:\n\nBUCKET 1 — The Bank: Liquid. Safe. But earning nothing. Inflation eats it.\n\nBUCKET 2 — The Market (401k, IRA): Tax-advantaged but locked up till 59½, taxed when you pull it, and exposed to crashes right when you might need it.\n\nWhat most successful families have that the average person doesn't is BUCKET 3.\n\nBUCKET 3 — Whole Life: It's a death benefit that protects your family TODAY, but it also builds cash value you can access tax-free at any age, for any reason. Buying a house? Use it. Sending a kid to college? Use it. Starting a business? Use it. And if you don't use it — your family inherits a tax-free legacy.\n\nIt's the only financial vehicle that does protection AND wealth-building in the same product. The wealthy have used it for 150 years. Most regular people have never been shown it.\n\nFor someone in your situation, here's what bucket 3 would look like… [pull up illustration]" },

  { id: 8, cat: "Presentation", title: "IUL Pitch — Tax-Free Retirement Strategy", body: "Let me show you something most financial advisors don't talk about because they don't get paid to.\n\nYour 401(k) is great for one thing: getting your employer match. After that, it's actually one of the worst places to put your money long-term. Here's why:\n\n1. Every dollar you put in is taxed when you pull it out — and we're at historically LOW tax rates today. Where do you think rates are going?\n\n2. You can't touch it before 59½ without a 10% penalty.\n\n3. If the market crashes the year you retire (like 2008), you might delay retirement 5-10 years.\n\nAn IUL — Indexed Universal Life — solves all three problems:\n\n• Your money grows linked to the S&P 500 — when the market goes UP, you participate (with a cap). When it goes DOWN, you LOCK in 0%. No losses. Ever.\n\n• Withdrawals at retirement are TAX-FREE. Not tax-deferred. Tax-FREE.\n\n• You can access cash value any time, any age, any reason — no penalty.\n\nThis is what high-income earners use. It's what bank-owned life insurance is built on. And once I show you the math, you'll understand why people who learn about this tend to put more into it than their 401(k)." },

  { id: 9, cat: "Presentation", title: "Term Life — The Foundation Pitch", body: "Term insurance is the foundation. It's the cheapest, simplest way to make sure that if something happened to you in the next 20 years — when your kids are still home, when the mortgage is still being paid, when your income is still essential — your family doesn't lose everything.\n\nThink of term like renting protection. You pay a small monthly premium. If something happens during the term, your family gets a tax-free check that pays off the house, replaces your income, and lets them stay in the same school district.\n\nFor your situation — [age], healthy, [income] — you can lock in $[coverage] for the next 20 years for around $[premium]/month. That's [comparison: 'less than your phone bill,' 'less than what you spend on coffee,' etc.].\n\nHere's the truth: term is what you START with. Most of my clients eventually convert part of it to permanent insurance once their income grows. But the most important thing is to LOCK IN your insurability today. Because here's what I see — people wait, life happens, they get a diagnosis, and suddenly insurance is either too expensive or impossible to get.\n\nDoes 20-year term make sense for where you are right now?" },

  // ============ CLOSING ============
  { id: 10, cat: "Closing", title: "The Assumptive Close", body: "So based on everything we discussed — your family, your income, your goals — the [policy] makes the most sense for where you are right now.\n\nWe have two start dates available — the 1st of next month or the 15th. Which one works better for the autopay to come out?\n\n[If they push back, you didn't earn it. Go back to discovery.]" },

  { id: 11, cat: "Closing", title: "The Either/Or Close", body: "Would you like to start with the $500K policy or the $750K?\n\nBoth protect your family. The $500K covers the mortgage and income replacement for a decade. The $750K does that AND leaves a legacy on top — which means your kids start ahead of where you started.\n\nWhat feels right to you?" },

  { id: 12, cat: "Closing", title: "The 'If I Could' Close", body: "Let me ask you this:\n\nIf I could get this approved at the rate we discussed, with no surprises in underwriting — would there be ANY reason you wouldn't want to lock it in today?\n\n[If yes — find the real objection.]\n[If no — 'Great. Let's get the application started so we can lock in your health rating before anything changes.']" },

  { id: 13, cat: "Closing", title: "The Story Close — The Mom At Wal-Mart", body: "I want to tell you about a client of mine before we wrap up.\n\nLast year, I sat with a couple just like you guys. Mid-30s, two kids, mortgage. He worked construction. She was a teacher. We talked about a $500K policy — premium would have been about $42 a month. He said he'd think about it.\n\nFour months later, his wife called me. He'd been hit by a drunk driver on his way home from work. Forty-two dollars a month — and she didn't have it.\n\nShe's now working two jobs. Their oldest changed schools. They lost the house.\n\nI'm not telling you this to scare you. I'm telling you because that $42 was the difference between a hard year and a destroyed family.\n\nWhat we're talking about today — for your family — is just as affordable. The only question is: are you the man who locks it in tonight, or the one who said 'I'll think about it'?" },

  // ============ OBJECTION HANDLING ============
  { id: 14, cat: "Objections", title: "I Can't Afford It — Full Response", body: "I hear you. And here's what I'd say to that:\n\nWhat you're really telling me is that you can't afford to NOT have this. Because if something happened to you, your family wouldn't just be without you — they'd be without the income, the house payment, the food on the table.\n\nLet me ask: what would they afford INSTEAD? They'd have to figure out the mortgage somehow. They'd have to figure out daycare. They'd have to figure out school.\n\nWhat I'm proposing is $[X] per month — that's [coffee comparison / streaming services / dinner out]. It's not about affordability. It's about priority.\n\nBut here's what I can do: instead of the $500K, what if we started with $250K? It's half the premium. It still gives your family a fighting chance. And as your income grows, we add to it.\n\nWould that work?" },

  { id: 15, cat: "Objections", title: "I Need To Think About It — Full Response", body: "I respect that. Big decisions deserve thought.\n\nLet me ask — and you can be totally straight with me — what specifically do you need to think about? Is it the cost? The amount of coverage? The carrier? Something I haven't explained well?\n\n[Listen.]\n\nHere's why I ask: 'thinking about it' usually means I didn't answer one of your concerns. And if I didn't, I want to fix that right now — not in two weeks when you've forgotten half of what we talked about.\n\nThe other thing is — and I'm not pressuring, just being real — every day we wait, two things can happen: either your premium goes up because you're a day older, or something happens with your health that makes you uninsurable.\n\nSo let's do this: tell me what's actually on your mind, and let's figure it out together. I'd rather you say no today than 'maybe' for six months." },

  { id: 16, cat: "Objections", title: "I Already Have Coverage — Full Response", body: "That's great — you've already shown you take this seriously, and most people I talk to don't.\n\nQuick question: when's the last time someone actually reviewed it with you to make sure it still fits?\n\n[Most will say 'never' or 'when I bought it.']\n\nHere's what I find — a lot has changed in the last 5-10 years. Premiums have come down. New product designs have come out. Plus your life has changed — kids, income, mortgage, business — and your coverage may not have kept up.\n\nWhat I propose is this: let me do a 15-minute review at no cost. I'll ask you a few questions about your current policy. Then I'll run a quote against today's market. Worst case, you confirm you have the best policy possible. Best case, we save you money or upgrade your coverage.\n\nFair?" },

  // ============ REFERRAL REQUEST ============
  { id: 17, cat: "Referrals", title: "The Direct Ask — Post-Sale", body: "[Name], you mentioned earlier that you really appreciated how I walked you through this without any pressure.\n\nHere's how I grow my business — I don't run ads. I don't cold call all day. I do what I just did with you: I sit with families, ask questions, build something that makes sense, and trust that they'll send me to the people they care about.\n\nSo here's what I'm going to ask:\n\nWho are 2 or 3 people in your life — friends, family, coworkers — who would benefit from the same conversation we just had? Not a sales pitch, just a real conversation about protecting their family.\n\n[Wait. Don't fill the silence.]\n\nGreat. Tell me about [first name they say]. What's their situation?" },

  { id: 18, cat: "Referrals", title: "The Soft Ask — Email/Text Follow-Up", body: "Hey [Name],\n\nQuick favor — and no pressure either way.\n\nIf anyone in your life ever mentions wanting to figure out their life insurance, retirement planning, or just getting their financial house in order — would you mind shooting them my number?\n\nI'll take great care of them the same way I did for you. No pressure, no spam, just a real conversation.\n\nAppreciate you, and let me know if you ever need anything.\n\n[Your name]" },

  // ============ SOCIAL POSTS ============
  { id: 26, cat: "Social Post", title: "Hook: The Real Cost of Doing Nothing", body: "Most people will spend more on coffee this year than on protecting the people they say they'd die for.\n\nThe avg American spends $1,100/year on coffee.\n\nA $500K term policy for a healthy 35-year-old? About $360/year.\n\nIt's not a budget problem. It's a priority problem.\n\nDM me 'PLAN' and I'll send you your number." },

  { id: 27, cat: "Social Post", title: "Story: The Day Everything Changed", body: "When I was 9, my dad passed. No life insurance.\n\nWe lost the house in 4 months.\n\nMy mom worked two jobs for 12 years to keep us afloat. I watched her go without so we could have something.\n\nThat's why I do this. Not to sell policies. To make sure another 9-year-old doesn't have to watch their family get destroyed by something a $40/month policy could have prevented.\n\nIf you've been putting it off — don't.\n\nDM me. Let's figure out your number." },

  { id: 28, cat: "Social Post", title: "Educational: The 3 Mistakes New Parents Make", body: "3 mistakes I see new parents make with life insurance:\n\n1. Only relying on what work gives them. Work coverage ends when the job ends. And it's almost never enough.\n\n2. Buying it for THEMSELVES but not their spouse — especially the stay-at-home parent. The cost to replace what they do (childcare, household management) is $50-80K/year.\n\n3. Waiting until the baby is older. Every year you wait, the rate goes up. And if a health issue comes up, you may not be able to get coverage at all.\n\nProtection should be locked in BEFORE you need it. Save this for later. ❤️" },

  { id: 29, cat: "Social Post", title: "Carousel Hook: Term vs Whole Life", body: "TERM vs WHOLE LIFE — which is right for you?\n\nSlide 1: TERM — Like renting protection. Cheaper. Lasts 10/20/30 years. Pure death benefit. ✓ if you're young, on a budget, just need protection.\n\nSlide 2: WHOLE LIFE — Like owning. Permanent. Builds cash value. More expensive monthly but you keep the equity. ✓ if you want to build wealth + protection in one.\n\nSlide 3: IUL — The wealth-builder. Permanent + market-linked growth + tax-free retirement income. ✓ if you're high-income and want a Roth alternative.\n\nSlide 4: The truth: Most clients use a BLEND. Term for the now. Permanent for the long game.\n\nDM me 'COMPARE' for a side-by-side on your specific situation." },

  // ============ DAILY MOTIVATION ============
  { id: 30, cat: "Daily Motivation", title: "Monday Mantra", body: "I am not chasing money.\n\nI am chasing impact.\n\nThe money is the receipt." },

  { id: 31, cat: "Daily Motivation", title: "Tuesday Truth", body: "Every 'no' is just a 'not yet.'\n\nEvery hang-up is feedback.\n\nEvery objection is a question in disguise.\n\nKeep dialing." },

  { id: 32, cat: "Daily Motivation", title: "Wednesday Wisdom", body: "Discipline is choosing between what you want NOW and what you want MOST.\n\nThe top producer didn't get there because they're smarter than you.\n\nThey got there because they made a hundred small disciplined choices a day for a thousand days.\n\nStack the reps." },

  { id: 33, cat: "Daily Motivation", title: "Thursday Thought", body: "The family you're meeting tonight has been waiting their whole life for someone to show them what's possible.\n\nDon't go in there to sell.\n\nGo in there to serve.\n\nThe sale takes care of itself." },

  { id: 34, cat: "Daily Motivation", title: "Friday Reflection", body: "What you do EVERY DAY matters more than what you do once in a while.\n\nReview your week:\n• Did you make the calls?\n• Did you do the follow-ups?\n• Did you serve before you sold?\n\nCompound your reps. The rest takes care of itself." },

  // INDEX ANNUITY (FIA) SCRIPTS
  { id: 35, cat: "Discovery", title: "Index Annuity — The Risk Conversation", body: "Before I show you anything, I want to ask three questions about how you think about money in retirement.\n\nFIRST — out of every dollar you've saved for retirement, how much of it can you afford to lose if the market crashes the year before you stop working?\n\nMost people I talk to say zero. Some say maybe ten percent. Almost nobody says half. So we already know that protecting principal matters.\n\nSECOND — when you think about the next 20 years, are you more worried about not making enough, or losing what you already have?\n\nThere's no wrong answer. People in their 30s usually say the first. People in their 50s and 60s almost always say the second.\n\nTHIRD — if I could show you a way to participate in market gains when the market goes up, but never lose a dollar to market losses when it goes down, would that be worth a conversation?\n\nJust a conversation. No commitment.\n\n[If they say yes — you've earned the next 20 minutes.]" },

  { id: 36, cat: "Presentation", title: "Index Annuity — Plain-English Explanation", body: "An indexed annuity is a contract with an insurance company. Three things to know.\n\nONE — your money is protected.\nThe insurance company guarantees you cannot lose principal due to market drops. If the S&P drops 30% next year, your account drops zero.\n\nTWO — you participate in market gains, with a ceiling.\nIf the index goes up 10% and your cap is 7%, you earn 7. If it goes up 50%, you still earn 7.\n\nThe trade-off is you give up the home runs in exchange for never striking out.\n\nTHREE — your gains lock in.\nEach year, whatever you earned becomes your new floor. The market can never take it back.\n\nThe trade-off — and I want to be transparent — is liquidity. You typically have a surrender period, often 7 to 10 years, where withdrawing more than 10% in a year carries a charge.\n\nSo this is for money you don't need to touch. For most clients, that's part of their long-term retirement bucket — not their emergency fund.\n\nDoes that align with how you're thinking about retirement, or do you have questions about how it actually works?" },

  { id: 37, cat: "Closing", title: "Index Annuity — The Two-Bucket Close", body: "Most clients I work with don't put everything into one product. We think about it as buckets.\n\nYour LIQUID bucket — emergency fund, near-term needs — stays in the bank, completely accessible.\n\nYour GROWTH bucket — money you don't need for 10+ years — stays in the market for upside.\n\nBut there's a third bucket most people don't have: a PROTECTED bucket. Money that grows when the market goes up, but cannot lose when it goes down. That bucket gives you something the other two can't — peace of mind.\n\nBased on what you've told me, we'd be looking at putting [X amount] into the protected bucket. That leaves your liquid bucket fully intact and your growth bucket untouched.\n\nYou're not changing your strategy. You're adding the missing piece.\n\nIf we did that today, your money would be working under three guarantees:\n• Principal protection\n• Tax-deferred growth\n• Locked-in gains every year\n\nAre you comfortable moving forward with that allocation, or do you want me to walk through anything else first?" },

  { id: 38, cat: "Objections", title: "Index Annuity — \"My Money Is Locked Up\"", body: "That's a fair concern, and I want to address it honestly.\n\nYou typically have access to 10% of your contract value every year, penalty-free. That's there for emergencies.\n\nBeyond that, there is a surrender period — usually 7 to 10 years — where additional withdrawals carry a charge. So let me be straight with you: if you think you'll need this entire amount in 5 years, an annuity is the wrong product.\n\nBut ask yourself this — when was the last time you took 100% of your retirement savings out in cash before you actually retired?\n\nIf the honest answer is never, then the surrender period is theoretical, not real.\n\nThe trade-off is intentional. The reason the insurance company can offer principal protection AND market participation is that they need time to manage the underlying risk. The surrender period is the price of that protection.\n\nYou're not locking your money up. You're choosing to leave it alone — the same way you'd leave alone money in a 401(k) until 59½ — and getting protections you can't get anywhere else in exchange.\n\nDoes that change how you're thinking about it?" },

  { id: 39, cat: "Objections", title: "Index Annuity — \"The Caps Are Too Low\"", body: "You're right that caps look low compared to a year like 2021 when the S&P hit 27%. If you had been fully invested, you would have outperformed an annuity by a wide margin.\n\nBut here's the math people don't run.\n\nImagine two people, both starting with $100,000.\n\nPerson A is in the market — up 27, down 18, up 28, down 15, up 24. Their account ends at about $130,000.\n\nPerson B is in an FIA with a 7% cap — 7, 0, 7, 0, 7. Their account ends at about $122,500.\n\nThe difference isn't huge. And Person B never had a stomach drop. Never had a down year. Never had to pull money at the bottom. Never lost a night of sleep.\n\nNow run that math through a 30% crash year. Person A loses $39,000 in 12 months. Person B loses zero.\n\nThe caps look low when the market is winning. They look brilliant when the market is losing. And we don't know which year is which until we live through it.\n\nThe real question isn't \"will the annuity beat the market?\"\n\nThe real question is — \"is consistent, protected growth worth giving up the highest highs?\"\n\nFor most people within 10 years of retirement, the answer is yes." },

  { id: 40, cat: "Discovery", title: "Index Annuity — The 'Sequence of Returns' Hook", body: "Let me ask you something most advisors won't.\n\nIf the market drops 40% the year before you retire — and you have to start drawing income — do you know how long it takes the math to recover?\n\nMost people guess 5 years. The honest answer is closer to 15 to 20 — IF you're still drawing income from it. That's called sequence-of-returns risk, and it's the silent killer of retirement plans.\n\nWhat indexed annuities solve for is exactly this — a portion of your money that never participates in the down year. So when you go to draw income, you're drawing from a bucket that didn't fall.\n\nIs sequence risk something you've thought about, or has nobody walked you through it before?" },

  { id: 41, cat: "Presentation", title: "Index Annuity — Tax-Deferred Growth Explanation", body: "Here's something most people miss about how money compounds.\n\nIn a taxable account, every gain is taxed every year. So your $10,000 gain becomes $7,500 after tax — and only $7,500 keeps growing the next year.\n\nIn an indexed annuity, the gain stays inside the contract tax-deferred. The full $10,000 keeps compounding. You only pay tax when you actually pull it out.\n\nOver 20 years, that difference is enormous. Two identical accounts — one taxable, one tax-deferred — can end up tens of thousands apart simply because of how compounding works without the IRS taking a cut every year.\n\nThe IRS doesn't go away. But the timing of when you pay them is one of the biggest levers in retirement planning. Tax deferral lets you control that timing instead of giving it up annually.\n\nDoes that change how you think about where this money should live?" },
];
function ScriptsModule({ data, setData, dark, themePanel, themeMuted, triggerConfetti }) {
  const [open, setOpen] = useState(false);
  const [filter, setFilter] = useState("All");
  // Reset the category filter when the language toggles so we don't keep an
  // English filter value that no longer matches any Spanish category.
  useEffect(() => { setFilter("All"); }, [lang]);
  const [active, setActive] = useState(SCRIPTS_DATA[0]);
  const [form, setForm] = useState({ cat: "Cold Call", title: "", body: "" });
  const scripts = data.scripts || SCRIPTS_DATA;
  const cats = ["All", ...Array.from(new Set(scripts.map(s => s.cat)))];
  const filtered = filter === "All" ? scripts : scripts.filter(s => s.cat === filter);

  const add = () => { if (!form.title) return; const id = Math.max(0, ...scripts.map(s => s.id)) + 1; setData({ ...data, scripts: [...scripts, { ...form, id }] }); setOpen(false); setForm({ cat: "Cold Call", title: "", body: "" }); triggerConfetti("✓ Script added!"); };

  return (
    <div>
      <PageHeader title="Scripts & Resources" subtitle="Cold call. Close. Get referrals. Post." dark={dark}
        action={<AddButton onClick={() => setOpen(true)} label="Add Script" dark={dark} />} />

      <div className="flex gap-1 mb-4 flex-wrap">
        {cats.map(c => <button key={c} onClick={() => setFilter(c)} className={`px-3 py-1.5 text-xs rounded ${filter === c ? "bg-[#9cb88f] text-stone-950 font-medium" : `${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"} border ${themeMuted}`}`}>{c}</button>)}
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        <Panel title={`${filtered.length} scripts`} dark={dark}>
          <div className="space-y-1">{filtered.map(s => (
            <button key={s.id} onClick={() => setActive(s)} className={`w-full text-left px-3 py-2 rounded text-sm transition ${active.id === s.id ? "bg-[#9cb88f]/10 text-[#9cb88f] border border-[#9cb88f]/30" : `${dark ? "hover:bg-white" : "hover:bg-stone-100"}`}`}>
              <div className="font-medium">{s.title}</div>
              <div className={`text-[10px] ${themeMuted}`}>{s.cat}</div>
            </button>
          ))}</div>
        </Panel>
        <div className="lg:col-span-2">
          <Panel title={active.title} dark={dark} action={<span className="text-xs text-[#9cb88f]">{active.cat}</span>}>
            <div className={`p-5 rounded whitespace-pre-line text-sm leading-relaxed ${dark ? "bg-white" : "bg-stone-50"} font-serif`} style={{ fontFamily: "Georgia, serif" }}>{active.body}</div>
          </Panel>
        </div>
      </div>

      <Modal open={open} onClose={() => setOpen(false)} title="Add Script" dark={dark}>
        <div className="space-y-3">
          <SelectField label="Category" value={form.cat} onChange={v => setForm({ ...form, cat: v })} options={["Cold Call", "Discovery", "Presentation", "Closing", "Objections", "Referrals", "Voicemail", "Texts", "Social Post", "Daily Motivation"]} dark={dark} />
          <TextField label={t("Title", lang)} value={form.title} onChange={v => setForm({ ...form, title: v })} dark={dark} />
          <div><label className={`text-xs ${themeMuted}`}>{t("Body", lang)}</label><textarea value={form.body} onChange={e => setForm({ ...form, body: e.target.value })} rows={8} className={`mt-1 w-full px-3 py-2 rounded border outline-none focus:border-[#7a9a6e] text-sm ${dark ? "bg-white border-stone-200" : "bg-white border-stone-300"}`} /></div>
          <button onClick={add} className="w-full py-2 bg-[#9cb88f] text-stone-950 font-medium rounded hover:bg-[#a8c090]">Add script</button>
        </div>
      </Modal>
    </div>
  );
}
